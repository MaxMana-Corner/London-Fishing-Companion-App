ore)||0)<n))}var ml=[{id:"float",name:"Float",blurb:"A bait suspended under a float, at a depth you choose."},{id:"ledger",name:"Ledgering",blurb:"Bait on the bottom, weight on the line, waiting them out."},{id:"lure",name:"Lure",blurb:"Something artificial, moving, that you make look alive."},{id:"fly",name:"Fly",blurb:"Casting the line rather than the lure. Lighter than it looks."},{id:"ice",name:"Ice",blurb:"Through a hole, in winter, straight down."},{id:"troll",name:"Trolling",blurb:"Dragging lures behind a moving boat to find scattered fish."}],gl={float:"Fixed float",slipfloat:"Slip float",running:"Running ledger",weightless:"Weightless",splitshot:"Split shot",swivel:"Swivel",leader:"Leader or trace"},qh={clinch:{rigs:["float","splitshot","swivel"],baits:["worm","crawler","corn","minnow"],note:"The everyday knot for mono and fluorocarbon - a hook, a swivel, a small lure."},palomar:{rigs:["weightless","splitshot","leader"],baits:["tube","grub","senko","texas","crank","spoon"],note:"Braid to anything. The strongest simple knot, and the one to use on a jig or a lure."},uni:{rigs:["slipfloat","running","swivel","leader"],baits:["shiner","minnow","liver","cutbait"],note:"One knot for hooks, spool arbors and joining two lines. Learn it if you learn one."},loop:{rigs:["weightless","leader"],baits:["popper","frog","jerkbait","crank","spinnerbait"],note:"Leaves the lure free to swing. Worth it on anything whose action you would otherwise choke."},surgeon:{rigs:["leader"],baits:[],note:"Joining two lines of different thickness - main line to a leader."},hair:{rigs:["running","swivel"],baits:["corn","bread"],note:"The bait hangs off the hook rather than sitting on it. Carp gear."}};function Hy(e,t){let n=e==="rig"?"rigs":e==="bait"?"baits":null;return n?Object.entries(qh).filter(([,r])=>(r[n]||[]).includes(t)).map(([r])=>r):[]}var Uy=["Start here","Worth learning","Advanced"],jh=[{id:"trotting",name:"Trotting a float",style:"float",gist:"Let a float run downstream at the speed of the current, with the bait just off the bottom.",water:"Rivers with steady, walking-pace flow",season:"April to November",diff:"Start here",targets:["smb","rock","sucker","carp","wall","perch"],baits:["worm","crawler","corn","bread"],rigs:["float","splitshot"],knots:["uni","clinch"],gear:"A long rod helps more than an expensive one - it lets you keep line off the water. 6 lb line, a 4 g float, size 10 hook.",how:["Find the depth first. Set the float over-deep, trot it through, and shorten until it stops dragging under.","Cast slightly upstream and let the float settle before it reaches you.","Let it travel at the speed of the surface, no faster. If the float is outrunning the foam and leaves, your line is pulling it.","Hold a little line back every few seconds so the bait swings up and then falls again. Most takes happen on that fall.","Strike downstream, not up - you are pulling the hook into the corner of the mouth rather than out of it."],tell:"The float does not just vanish. It lifts, holds under, or slides sideways against the current. Any of those is a fish.",fail:"Fishing too shallow. The bait should be ticking bottom occasionally; if you never touch, you are fishing above them."},{id:"laying-on",name:"Laying on in still water",style:"float",gist:"Float set deeper than the water, so the bait rests on the bottom and the float sits at an angle.",water:"Ponds, canals, slow backwaters",season:"Year round, best May to September",diff:"Start here",targets:["bluegill","pump","crappie","perch","carp","sucker"],baits:["worm","corn","bread","waxworm"],rigs:["float","splitshot"],knots:["clinch","uni"],gear:"Light float, two or three small shot, size 12 to 16 hook. This is the cheapest way to catch fish there is.",how:["Plumb the depth with a heavy shot on the hook until the float sits flat, then shorten by an inch or two so only the tip shows.","Feed a small pinch of bait in the same spot every few minutes. Little and often beats one big helping.","Cast to the same place each time. You are building a pile of interest, not searching.","Sit on your hands. The bites will come to you."],tell:"The float lifts flat and lies down - that is a fish taking the bait and lifting the shot. Strike on the lift, not after it goes under.",fail:"Moving every ten minutes. This tactic works by drawing fish to you, and it needs twenty minutes before it starts."},{id:"slip-float",name:"Slip float for deep water",style:"float",gist:"A float that slides on the line, so you can fish twelve feet deep with a rod you can still cast.",water:"Deep holes, harbour walls, drop-offs, off piers",season:"Year round",diff:"Worth learning",targets:["wall","crappie","perch","wbass","pike"],baits:["minnow","shiner","microjig","jigminnow"],rigs:["slipfloat","swivel"],knots:["uni","palomar"],gear:"A slip float, a bobber stop, a bead, and a swivel. The stop knot sets the depth and reels through the guides.",how:["Thread the stop knot, then the bead, then the float, then tie on a swivel. The bead is what stops the float passing the knot.","Set the stop so the bait sits a foot above whatever the fish are holding on - a weed bed, a ledge, the bottom.","Cast and wait for the float to stand up. It lies flat until the weight has pulled the line through, then cocks.","In current, let it drift the length of the structure, then reel in and repeat rather than dragging it back through."],tell:"A walleye takes a minnow and moves off slowly. Give it three or four seconds before you tighten - striking instantly pulls it away.",fail:"No bead. Without it the stop knot jams into the float and you cannot reel in."},{id:"running-ledger",name:"Ledgering with a running rig",style:"ledger",gist:"Weight sliding freely on the line, so a fish taking the bait feels the hook before it feels the lead.",water:"Rivers and lakes, any depth",season:"May to October",diff:"Start here",targets:["carp","cat","drum","sucker","smb"],baits:["corn","bread","worm","crawler","liver"],rigs:["running","swivel"],knots:["palomar","hair"],gear:"A running lead or feeder above a swivel, a 12 inch hooklength below it. Rod pointed at the bait, line just tight.",how:["Cast, let everything settle, then tighten until the line is straight but not pulling the lead.","Put the rod on a rest with the tip low. You are watching the line or the tip, not holding it.","Recast every twenty minutes even if nothing happens - it refreshes the bait and drops more scent in the same spot.","When it goes, it goes properly. Carp and catfish do not nibble a bottom bait."],tell:"The tip pulls round and stays round, or slack line suddenly appears because the fish swam towards you. Both are takes.",fail:"A hooklength longer than about 18 inches on a running rig tangles on the cast. Keep it short."},{id:"night-cats",name:"Still bait for catfish after dark",style:"ledger",gist:"Smelly bait on the bottom, in the dark, in the deepest slow water you can reach.",water:"River holes below bridges and weirs",season:"June to September, after sunset",diff:"Start here",targets:["cat","drum"],baits:["liver","cutbait","crawler"],rigs:["running","leader"],knots:["palomar","uni"],gear:"Heavier than you think - 15 to 20 lb line, a 2/0 to 4/0 hook, and enough lead to hold in the current.",how:["Get there in daylight and find the deep slow water. Set up before you need a torch.","Fish two rods if the rules allow it, at different distances, until one of them tells you where the fish are.","Keep the bait fresh. Liver washes out in fifteen minutes and after that you are fishing an empty hook.","Bank the rods properly. A channel cat can take an unsecured rod into the river, and this happens to somebody every summer."],tell:"A slow heavy pull that keeps going. Let it develop for a second, then lean into it - do not snatch.",fail:"White light everywhere. Use a red head torch and point it at your hands, not the water."},{id:"drift-bottom",name:"Drifting bait along the bottom",style:"ledger",gist:"Just enough weight to trundle downstream, so the bait moves the way real food moves.",water:"Rivers with clean gravel or sand bottom",season:"May to October",diff:"Worth learning",targets:["smb","wall","rock","sucker","drum"],baits:["crawler","crayfish","minnow","worm"],rigs:["splitshot","swivel"],knots:["clinch","uni"],gear:"Two or three split shot 18 inches above the hook. Adjust the shot, not the retrieve.",how:["Cast up and across, and follow the line with the rod tip as it comes down.","You want it touching bottom every couple of seconds. Constant contact means too much weight; never touching means too little.","Take one step downstream after every two or three drifts, and work the whole run.","When it stops, it is either a rock or a fish. Lift gently - a rock stays put and a fish moves."],tell:"A tap-tap that is sharper than the rhythm of the bottom. Smallmouth hit a drifted crayfish hard.",fail:"Too much lead. The single most common mistake in river fishing, and it kills the presentation stone dead."},{id:"search-cranking",name:"Covering water to find them",style:"lure",gist:"Fan-cast a fast lure across a lot of water until something answers, then slow down and work that spot.",water:"Anywhere new to you",season:"May to October",diff:"Start here",targets:["smb","lmb","pike","wall","wbass"],baits:["crank","spinnerbait","chatterbait","spinner","shadrap"],rigs:["swivel"],knots:["loop","palomar"],gear:"One rod, one fast-moving lure, and a willingness to keep walking.",how:["Cast in a fan from one bank position - left, centre, right - then move twenty paces and repeat.","Retrieve steadily. You are asking a question, not making a presentation.","The moment you get a follow, a knock or a fish, stop searching and work that spot properly with something slower.","Mark it. That is what the pin drop is for, and it is worth more than the fish you just caught."],tell:"Follows count as information. A fish that tracks the lure and turns away is telling you it is there and that you are going too fast.",fail:"Falling in love with one spot. Searching only works if you actually keep moving."},{id:"jig-hopping",name:"Hopping a jig on the bottom",style:"lure",gist:"Lift, let it fall on a semi-slack line, and watch the line rather than the rod.",water:"Rocky rivers, drop-offs, bridge pilings",season:"April to November",diff:"Start here",targets:["smb","wall","rock","crappie","drum","perch"],baits:["tube","grub","jigminnow","microjig"],rigs:["splitshot"],knots:["palomar","clinch"],gear:"The lightest head that still reaches bottom. In the Thames that is usually 1/8 oz, heavier below a weir.",how:["Cast up at forty-five degrees and let it sink on a controlled line - not slack, not tight.","Lift the rod tip a foot, then lower it and let the jig fall back with the current.","Watch where the line enters the water. Almost every take happens on the fall and you will see it before you feel it.","If you are never ticking bottom, go heavier. If you are constantly snagged, go lighter."],tell:"The line twitches, jumps, or simply stops falling. Reel down until you feel weight and then set the hook.",fail:"Waiting to feel the bite. On a falling jig there is nothing to feel - by the time there is, it has gone."},{id:"topwater-window",name:"Topwater in the first and last hour",style:"lure",gist:"A lure on the surface, in low light, over shallow cover. The most exciting bite in fishing.",water:"Weedy shallows, pads, calm bays",season:"June to September",diff:"Worth learning",targets:["lmb","smb","pike"],baits:["popper","frog"],rigs:["weightless"],knots:["loop","palomar"],gear:"A loop knot. It matters more here than anywhere - a tight knot kills the side-to-side action.",how:["Be on the water before first light or stay past sunset. The window is about an hour and it is not negotiable.","Cast past the cover and bring the lure to it, not into it.","Work it in bursts with real pauses. The pause is the part that gets bitten.","Wait until you feel the weight of the fish before you strike. Striking at the splash pulls it away."],tell:"You will hear it before you understand it. Count to one, then lean into it.",fail:"Setting the hook on sight. Everyone does it once, and it costs the best fish of the morning."},{id:"finesse-slow",name:"Finesse when they have shut down",style:"lure",gist:"Small, light and slow, for bright flat days and pressured water when nothing normal works.",water:"Clear ponds and rivers, high sun, no wind",season:"Any time it is tough",diff:"Worth learning",targets:["smb","lmb","crappie","perch","rock"],baits:["senko","texas","microjig","grub"],rigs:["weightless","splitshot"],knots:["palomar","uni"],gear:"Lighter line than you are comfortable with. 6 lb fluorocarbon changes the number of bites on a hard day.",how:["Halve the size of whatever you were using and remove as much weight as you can still cast.","Cast to a specific thing - a shadow, a rock, a dock post - not to open water.","Let it sink all the way on a slack line, then do almost nothing. Shake it in place rather than moving it along.","Give each cast twice as long as feels sensible."],tell:"The line moves sideways. That is the whole bite.",fail:"Impatience. This tactic is slow by design, and rushing it turns it back into the tactic that was not working."},{id:"pike-casting",name:"Casting big lures for pike",style:"lure",gist:"Large, flashy, and always on a trace. Pike will bite through anything else.",water:"Weed edges, bays, slow deep water",season:"Best October to December, and again in spring",diff:"Worth learning",targets:["pike"],baits:["spoon","spinnerbait","jerkbait","crank"],rigs:["leader","swivel"],knots:["palomar","uni"],gear:"A wire or heavy fluorocarbon trace, long forceps, and a knotless landing net. Bring all three or do not fish for pike.",how:["Work the edges of weed rather than the middle of open water.","Vary the retrieve until something answers - pike often want a pause or a change of direction rather than a change of speed.","Do a figure of eight with the rod tip at the end of every retrieve. A following pike frequently takes right at your feet.","Unhook in the water where you can. Support the fish horizontally and never hold one vertically by the jaw."],tell:"Often no take at all, just sudden heavy weight. Sometimes you see the fish before you feel it.",fail:"No trace. You will lose the fish and leave a lure in its mouth, which is the one outcome actually worth avoiding."},{id:"fly-nymph",name:"Nymphing under an indicator",style:"fly",gist:"A weighted nymph drifting near the bottom, with a float on the leader telling you when it stops.",water:"Rivers and tributaries, especially cold and clear",season:"March to May, October to December",diff:"Worth learning",targets:["trout","smb","rock","sucker"],baits:["worm"],rigs:["float","splitshot"],knots:["uni","surgeon"],gear:"A 9 to 10 foot rod, 5 or 6 weight, floating line, 9 foot leader down to 4X. One weighted nymph and enough shot to tick bottom.",how:["Set the indicator at roughly one and a half times the depth. Too shallow is the usual mistake and it feels the same as no fish.","Cast up and across, then lead the indicator downstream with the rod tip so the line is not dragging it.","The drift should be the speed of the bubbles. If the indicator is racing them, mend upstream.","Strike at anything: a stop, a dip, a hesitation, a sideways slide. Most of them are bottom. Some are not.","Cover water in a fan, three or four drifts a lane, then move a step downstream."],tell:"It rarely goes under hard. It stops, or it tips. Set the hook on doubt and you will hook more fish than you spook.",fail:"Not enough weight. If you never touch bottom, the fly is above every fish in the run - add shot until you tick, then take one off."},{id:"fly-streamer-pike",name:"Stripping a big streamer for pike",style:"fly",gist:"A large, water-pushing fly stripped through weed edges and bays, on a wire trace.",water:"Weedy bays, drop-offs and slow river margins",season:"May to June, September to November",diff:"Worth learning",targets:["pike","lmb","smb"],baits:["spinner","spoon"],rigs:["leader"],knots:["uni","loop"],gear:"An 8 or 9 weight, floating or intermediate line, a short heavy leader and a wire trace. Pike will bite through anything else.",how:["Fish the edge of the weed, not the open water beyond it. Pike sit in the cover and watch the gap.","Long strips, then a pause. The eat almost always comes on the pause, when the fly hangs and turns.","Keep the rod tip in the water and pointing down the line so a take loads straight into the hook.","Strip-strike. Lifting the rod on a pike bends the rod and moves the fly nowhere.","Have long pliers and a wire trace ready before the first cast, not after the first fish."],tell:"Often you see it before you feel it - a wake, or the fly simply stops being there.",fail:"Nylon instead of wire. It is not a matter of luck; you will lose the fly and leave it in the fish."},{id:"fly-still-panfish",name:"A small wet fly for still-water panfish",style:"fly",gist:"A tiny fly fished slowly in still water, which is the cheapest way to learn to fly fish at all.",water:"Ponds, mill ponds and sheltered bays",season:"May to September",diff:"Start here",targets:["bluegill","pump","crappie","rock","lmb"],baits:["worm"],rigs:["float"],knots:["clinch","surgeon"],gear:"Any rod you can borrow, 4 to 6 weight, floating line. A size 12 wet fly or a small foam popper.",how:["Fish close. Twenty feet is plenty, and panfish sit tighter to the bank than anybody expects.","Cast, count to five, then draw the fly back in short slow pulls.","If nothing comes, count to ten before you start. Depth is nearly always the variable.","With a popper, twitch it once and leave it. The rings spreading out are what brings them up."],tell:"A knock rather than a pull, and then the line goes tight and stays tight.",fail:"Fishing it fast. A panfish will follow a slow fly the whole way in and refuse a quick one."},{id:"fly-egg-trib",name:"Egg pattern in a Great Lakes tributary",style:"fly",gist:"A single egg fly rolled along the bottom for migratory trout and salmon running in from the lake.",water:"Lake Huron and Lake Ontario tributaries",season:"March to April, September to November",diff:"Worth learning",targets:["trout","sucker"],baits:[],rigs:["splitshot","float"],knots:["uni","surgeon"],gear:"A 10 foot rod if you have one, 7 weight, and enough shot to keep the fly on the bottom in fast water.",how:["Read the run first. Fish hold in the slower seam beside the fast water, not in the middle of it.","Get the fly down in the first third of the drift, or the last two thirds are wasted.","Short casts, tight line, and lead the drift. Long line and a big mend is how you miss the take.","Rest a run after a fish rather than casting straight back in. They are in pods, and the pod moves.","Check the Rules tab before you go - tributary seasons and sanctuary water are specific and change by river."],tell:"A firm stop, then weight. Bottom feels the same for half a second, which is why you set on everything.",fail:"Fishing over spawning fish on the gravel. Take them from the runs and the pools, and leave the beds alone."},{id:"fly-swing",name:"Swinging a wet fly or streamer",style:"fly",gist:"Cast across the current and let the line swing the fly around below you. The current does the work.",water:"Rivers with steady flow",season:"April to October",diff:"Worth learning",targets:["trout","smb","rock"],baits:[],rigs:["leader"],knots:["surgeon","loop"],gear:"A 5 or 6 weight outfit covers almost everything in southern Ontario. Nine foot leader.",how:["Cast across and slightly downstream, then let the line come under tension and swing.","Follow the line around with the rod tip and let it hang directly below you for a few seconds before recasting.","Take two steps downstream after each swing. You are covering the run methodically, not casting at a spot.","Do not strike upwards. Let the fish turn and tighten on its own, then lift."],tell:"A solid pull mid-swing, or a pluck that does not connect - if you get plucked, swing it through again slower.",fail:"Striking like a spin fisherman. On the swing the fish hooks itself, and a hard strike pulls the fly clear."},{id:"fly-dry",name:"Dry fly to a rising fish",style:"fly",gist:"Put a floating fly a little upstream of a fish you have actually seen, and let it drift with no drag.",water:"Clear streams and river tails",season:"May to September, evenings",diff:"Advanced",targets:["trout"],baits:[],rigs:["leader"],knots:["surgeon","clinch"],gear:"Long fine leader - twelve foot down to 5x. The leader matters more than the fly.",how:["Watch first. Find one fish rising in a rhythm before you make a single cast.","Get below it and cast upstream so the fly reaches it before the line does.","Throw a little slack into the cast so the fly drifts at the speed of the water. Any wake at all and the fish is done.","If it refuses twice, change the fly or rest the fish. A third refusal usually ends the opportunity."],tell:"The rise happens where your fly is. Pause, then lift smoothly - a fast strike breaks fine tippet.",fail:"Drag. A fly moving faster or slower than the surface around it is the single reason most dry fly casts fail."},{id:"ice-jigging",name:"Jigging a hole",style:"ice",gist:"A small bait straight down, lifted and dropped, in a hole you drilled over structure.",water:"Hard water on lakes and bays",season:"January to early March",diff:"Worth learning",targets:["perch","crappie","bluegill","wall","pike"],baits:["microjig","waxworm","minnow","jigminnow"],rigs:["splitshot"],knots:["palomar","clinch"],gear:"Short rod, 4 lb line, and a spoon or small jig. A flasher earns its money here more than any other piece of tackle.",how:["Drill several holes over different depths before you fish any of them, so you can move later without making noise.","Drop to the bottom, then lift a foot. Most winter fish sit just off the bottom, not on it.","Lift sharply and let it fall on a slack line, then hold dead still for several seconds. The hold is what gets bitten.","Give a hole ten minutes. If nothing, move - in winter you go to the fish, they do not come to you."],tell:"The line goes slack early on the drop, or the rod tip loads up on the lift.",fail:"Ice thickness taken on somebody else's word. Check it yourself, and never fish new ice alone."},{id:"tip-up",name:"Tip-ups for pike and walleye",style:"ice",gist:"A live bait set at depth on a flagged trap, so you can cover several holes while you jig another.",water:"Weed edges and drop-offs on hard water",season:"January to early March",diff:"Worth learning",targets:["pike","wall"],baits:["shiner","minnow"],rigs:["leader","swivel"],knots:["palomar","uni"],gear:"A wire trace for pike. Check the local limit on how many lines you may set - it varies and it is enforced.",how:["Set the bait a foot or two above the weed or the bottom, not down in it.","Spread the tip-ups across different depths until a flag tells you which depth is right, then move the others to match.","When a flag goes, walk over - do not run, and do not grab the line until the spool has stopped turning.","Pull hand over hand, keeping steady pressure. Slack line is how you lose them."],tell:"The flag is only half of it. Watch whether the spool is still turning - a stopped spool means the fish has dropped it.",fail:"Striking while the spool is running. Let the fish turn the bait first."},{id:"flatline-troll",name:"Flatline trolling",style:"troll",gist:"Lures behind a slow-moving boat, no downrigger, covering water until you find the depth they are at.",water:"Open lake, bays, large rivers",season:"May to October",diff:"Start here",targets:["wall","pike","trout","wbass","smb"],baits:["crank","shadrap","spoon"],rigs:["swivel","leader"],knots:["palomar","loop"],gear:"Line counter reels if you have them. If not, count passes of the handle - you need to be able to repeat what worked.",how:["Start around 2 mph and let out different amounts of line on each rod so they run at different depths.","Note exactly what was out when a fish takes, then put the other rods on the same setting.","Turn regularly. The lures on the outside speed up and the inside ones slow and drop, and takes often come on the turn.","Follow a contour rather than crossing open water at random."],tell:"The rod loads and stays loaded. Most trolled fish hook themselves.",fail:"Every rod set identically. Then you learn nothing when one of them gets a fish."},{id:"bottom-bounce",name:"Bottom bouncing a worm harness",style:"troll",gist:"A weighted arm trundling along the bottom, dragging a spinner and a crawler behind it.",water:"Lake flats and river drifts with clean bottom",season:"June to September",diff:"Worth learning",targets:["wall","drum","sucker"],baits:["crawler","worm"],rigs:["swivel","leader"],knots:["uni","palomar"],gear:"A bottom bouncer heavy enough to hold roughly a forty-five degree line angle at your trolling speed.",how:["Let out line until you feel the bouncer tick bottom, then hold it just there.","Aim for a line angle of about forty-five degrees. Straight down means too slow; way out behind means too little weight.","Go slowly - around 1 mph. The spinner blade needs to turn, not fly.","Drop the rod tip when you feel a take, count to two, then lift into it."],tell:"A distinctly different weight from the rhythm of the bouncer ticking. It feels like the bottom got soft.",fail:"Too fast. The harness rides up off the bottom and you troll over the fish all afternoon."}];function Gy(e,t){let n={species:"targets",bait:"baits",rig:"rigs",knot:"knots"}[e];return n?jh.filter(r=>(r[n]||[]).includes(t)):[]}var Ri=(e,t)=>`${e}:${t}`;function Bt(e,t,n){return(e||[]).includes(Ri(t,n))}function Ky(e,t,n){let r=Ri(t,n),i=Array.isArray(e)?e:[];return i.includes(r)?i.filter(s=>s!==r):[r,...i]}function Vy(e,t,n=1/0){let r=[];for(let i of e||[]){let s=i.indexOf(":");if(s<1)continue;let a=i.slice(0,s),l=i.slice(s+1),d=t(a,l);if(d&&r.p :root{
  --ink:#1B2419;
  --ink2:#59654F;
  /* --ink3 IS A CARD-LEVEL TOKEN. Text on the page ground uses --ink2.

     It clears 4.5:1 on --card and only 3.89 on --base, and there is no value
     that does both without collapsing into --ink2. So the tier is real but it
     is conditional, and the condition has to be written down: I fixed the one
     offending site (.mapattrib) an hour before adding a second one by hand.
     Two known consumers on the ground are corrected below; anything new that
     sits on --base wants --ink2.

     Was #8A9382, which is 2.99:1 on a card. --ink3 is the text colour in 26
     rules at 9.5 to 12.5 pixels - inactive nav labels, region metadata, map
     attribution - and small text needs 4.5:1. It reads 4.56 now. The quiet
     tier is less quiet than it was; that is the trade, and it was measured
     rather than guessed. */
  --ink3:#6B7464;
  --base:#E3E7DE;
  --card:#F6F8F3;
  --card2:#ECEFE7;
  --line:#C7CDBF;
  --line2:#DBE0D3;
  --deep:#2E4A55;
  --deep2:#4A6D78;
  --brass:#A8752B;
  --brass2:#C79A4E;
  --moss:#3D6B39;
  --rust:#8E2F2F;
  /* Two more accents, added for the six fishing styles. The palette already
     had six colours, but deep2 and brass2 are tints of deep and brass, so
     using them here would have given two pairs of styles that read as the
     same colour at the size these bars actually appear. */
  --plum:#5A4A6B;
  --sky:#3E7189;
  /* Text ON the deep accent. In light, deep is a dark slate and this is
     near-white; in dark, deep LIGHTENS to stay visible against charcoal, so
     white-on-deep inverts and the pair has to flip with it. A literal #fff
     here was the only thing a contrast sweep found wrong in dark. */
  --on-deep:#F1F4EF;
  /* 4.63:1 on the brass fill. #23180A read 4.35 - a near miss nobody would
     have found by looking, since both are effectively black. Dark mode keeps
     its own value; it was never the one failing. */
  --on-brass:#1A1206;
  /* status tints: a pale ground and the ink that belongs on it */
  --good-bg:#DDEBD9;   --good-ink:#2C5228;   --good-line:#B6D0B1;
  --warn-bg:#F2E6CF;   --warn-ink:#6B4A15;   --warn-line:#DEC79A;
  --bad-bg:#F0DDDD;    --bad-ink:#722525;    --bad-line:#D9B6B6;
  --shadow:0 1px 0 var(--line2);
  /* The map paints to a canvas, so it cannot read tokens the way the DOM
     does - mapPalette() picks a whole palette instead. This is the switch it
     reads, which keeps the stylesheet the thing that decides what theme
     means, the same as everywhere else. */
  --map-scheme:light;
  /* The season hero is a dark band in BOTH themes - it is a photograph's
     backdrop, not a surface, so it does not flip. That makes it the one place
     needing its own pair rather than --deep/--on-deep, which do flip: in dark
     mode --deep is a pale tint and would give light text on a light band.

     Defined once here and once in the orchid block; neither dark block
     overrides it, which is what keeps it the same in both themes. */
  --band-a:#2E4A55; --band-b:#22333B; --on-band:#EAF0EC;
}

/* DARK.

   Three states, not two. An explicit choice stamps data-theme on the root;
   the default setting stamps nothing and only prefers-color-scheme separates
   light from dark - which is what most people will actually be in. So the
   media query is guarded against an explicit light choice, and the
   data-theme rule repeats the palette so the setting wins in both
   directions.

   Only tokens are redefined. Every component reads through them, so nothing
   below needs a dark variant - and a colour whose only definition sits
   inside one of these blocks is the classic unreadable-in-one-theme bug.

   Not an inversion. The greens carry a slight warmth in light and go cooler
   and desaturated in dark, because a saturated green on a dark ground reads
   as neon. The accents are lifted rather than kept, since the same hue that
   reads as considered on paper disappears against charcoal. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#E7EAE2;
    --ink2:#AEB6A6;
    --ink3:#828C7D;   /* 4.26 -> 4.56 on card; small text needs 4.5 in dark too */
    --base:#171A15;
    --card:#1F231C;
    --card2:#272C24;
    --line:#39402F;
    --line2:#2C3226;
    --deep:#7FB0C0;
    --deep2:#5C8794;
    --brass:#D5A458;
    --brass2:#B9873C;
    --moss:#7FB073;
    --rust:#D48A84;
    --plum:#A692BC;
    --sky:#78AAC0;
    --on-deep:#12211A;
    --on-brass:#23180A;
    /* the same six, as tints OF the dark ground rather than pale wash - a
       pale chip on charcoal reads as a hole punched in the card */
    --good-bg:#1E2E1B;   --good-ink:#A9CFA2;   --good-line:#31462C;
    --warn-bg:#2E2415;   --warn-ink:#D9B571;   --warn-line:#463818;
    --bad-bg:#2E1C1B;    --bad-ink:#E2A9A3;    --bad-line:#4A2A28;
    --shadow:0 1px 0 rgba(0,0,0,.35);
  --map-scheme:dark;
  }
}
:root[data-theme="dark"] {
  --ink:#E7EAE2;
  --ink2:#AEB6A6;
  --ink3:#828C7D;   /* 4.26 -> 4.56 on card; small text needs 4.5 in dark too */
  --base:#171A15;
  --card:#1F231C;
  --card2:#272C24;
  --line:#39402F;
  --line2:#2C3226;
  --deep:#7FB0C0;
  --deep2:#5C8794;
  --brass:#D5A458;
  --brass2:#B9873C;
  --moss:#7FB073;
  --rust:#D48A84;
  --plum:#A692BC;
  --sky:#78AAC0;
  --on-deep:#12211A;
  --on-brass:#23180A;
  /* the same six, as tints OF the dark ground rather than pale wash - a
     pale chip on charcoal reads as a hole punched in the card */
  --good-bg:#1E2E1B;   --good-ink:#A9CFA2;   --good-line:#31462C;
  --warn-bg:#2E2415;   --warn-ink:#D9B571;   --warn-line:#463818;
  --bad-bg:#2E1C1B;    --bad-ink:#E2A9A3;    --bad-line:#4A2A28;
  --shadow:0 1px 0 rgba(0,0,0,.35);
  --map-scheme:dark;
}
/* ORCHID: A SECOND PALETTE, ACROSS BOTH THEMES.

   A third axis on top of light/dark, so there are four combinations and each
   one has to be written. Specificity does the choosing:

     :root                                            (0,1,0)  light, default
     :root[data-palette="orchid"]                      (0,2,0)  light, orchid
     :root:not([data-theme="light"])  in the media     (0,2,0)  dark, default
     :root[data-theme="dark"]                          (0,2,0)  dark, default
     ...[data-theme="dark"][data-palette="orchid"]     (0,3,0)  dark, orchid

   The two middle rows tie, so order matters and the dark blocks come after
   light-orchid; the orchid dark rows outrank both. Same three-state handling
   as the theme itself - an un-stamped root in a dark OS still has to land on
   dark orchid, which is what the :not([data-theme="light"]) guard is for.

   WHAT IT DOES NOT TOUCH, deliberately:

   --moss and the good/warn/bad tints carry meaning - a season being open, a
   reading being fine, a warning. Recolouring those to match a theme would
   make "open" pink and cost the reader the one thing the colour was for.
   --plum, --sky and --rust are the encyclopedia's category inks and exist to
   tell categories apart; pulling them all toward purple would make six tiles
   look like one. So this changes the chrome - the primary and warm accents,
   their contrast pairs, and the neutrals' hue bias - and leaves meaning
   alone. */
:root[data-palette="orchid"] {
  --ink:#241B29;
  --ink2:#5E5266;
  --ink3:#7C7086;   /* 3.80 -> 4.65 on card, same reason as the default palette */
  --base:#FAF6FB;
  --card:#FFFFFF;
  --card2:#F3ECF5;
  --line:#E2D6E6;
  --line2:#EFE6F1;
  --deep:#7A4A94;
  --deep2:#5E3775;
  --brass:#A8456E;
  --brass2:#8C3459;
  --on-deep:#F8F2FB;
  --on-brass:#FFF2F7;
  --band-a:#533063; --band-b:#3A2145; --on-band:#F3E9F7;
  --shadow:0 1px 0 var(--line2);
}
@media (prefers-color-scheme: dark) {
  :root[data-palette="orchid"]:not([data-theme="light"]) {
    --ink:#EDE4F0;
    --ink2:#B7A9BE;
    --ink3:#8C8193;   /* 4.25 -> 4.54, same reason */
    --base:#191320;
    --card:#221A2A;
    --card2:#2B2134;
    --line:#463A50;
    --line2:#2F2639;
    --deep:#C89ADD;
    --deep2:#A277BC;
    --brass:#E293B4;
    --brass2:#C06E90;
    --on-deep:#1E1226;
    --on-brass:#2A121C;
    --shadow:0 1px 0 rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"][data-palette="orchid"] {
  --ink:#EDE4F0;
  --ink2:#B7A9BE;
  --ink3:#8C8193;   /* 4.25 -> 4.54, same reason */
  --base:#191320;
  --card:#221A2A;
  --card2:#2B2134;
  --line:#463A50;
  --line2:#2F2639;
  --deep:#C89ADD;
  --deep2:#A277BC;
  --brass:#E293B4;
  --brass2:#C06E90;
  --on-deep:#1E1226;
  --on-brass:#2A121C;
  --shadow:0 1px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.lfc{
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--base); color:var(--ink);
  min-height:100vh; max-width:760px; margin:0 auto;
  padding-bottom:92px; position:relative;
  font-size:15px; line-height:1.45;
}
.lfc .serif{font-family:'Newsreader',Georgia,'Iowan Old Style',serif}
.lfc h1,.lfc h2,.lfc h3,.lfc h4{font-family:'Newsreader',Georgia,serif;font-weight:600;margin:0;line-height:1.15;letter-spacing:-0.01em}
.lfc h1{font-size:29px}
.lfc h2{font-size:22px}
.lfc h3{font-size:18px}
.lfc p{margin:0 0 10px}
/* A RESET THAT WAS BEATING THE COMPONENTS IT RESET.

   .lfc button scores (0,1,1) - one class, one element - which outranks every
   single-class rule written for a button: .mfab, .opttile, .quickchip and the
   rest all score (0,1,0) and lost. The map controls have never once had their
   own background, and the settings tiles have never had their card. In light
   mode color:inherit landed on dark ink over a light ground and looked
   deliberate, so nothing gave it away until dark mode inherited near-white
   and the map buttons went blank.

   :where() contributes nothing to specificity, so this is (0,0,1): still
   ahead of the browser default, behind anything a component asks for. A reset
   should be the floor, not the ceiling. */
.lfc :where(button){font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.lfc input,.lfc select,.lfc textarea{font-family:inherit;font-size:16px;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:11px 12px;color:var(--ink)}
.lfc textarea{min-height:78px;resize:vertical;line-height:1.4}
.lfc input:focus,.lfc select:focus,.lfc textarea:focus,.lfc button:focus-visible{
  outline:2px solid var(--deep);outline-offset:1px}

.pad{padding:0 16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px;line-height:1.35}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* header */
/* SAFE AREA.

   index.html sets viewport-fit=cover and apple-mobile-web-app-status-bar-style
   to black-translucent, which is what lets the app paint edge to edge - and
   also what puts the status bar and the camera cutout ON TOP of the first
   18px of every page. The bottom bar already reserved its inset; the top
   never did, so an installed app had its heading under the clock.

   env() is 0 on a device with no cutout, so this costs nothing anywhere else. */
.hdr{padding:calc(18px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
.hdr .kick{font-size:12.5px;color:var(--ink2);letter-spacing:.02em}

/* season strip \u2014 the hero */
/* .seasonwrap's rules lived here until this commit. Nothing has carried that
   class since the season list moved into .seasoncard, and its white-on-dark
   text is exactly what leaked into .sbadge and made the fish names invisible
   in light mode. Deleted rather than left as a trap for the next person. */
.seasongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:13px}
/* These were written for .seasonwrap, a dark --deep band that no longer
   exists anywhere in the app - the season list moved into .seasoncard, which
   is var(--card). The white text came with it, so in light mode the fish
   names were white on near-white and simply were not there.

   Tokens now, so they follow the card they are actually sitting on. The
   tint is a wash OF the surface rather than a fixed white veil, which is the
   same reason the status chips are tinted grounds rather than pale ones. */
.sbadge{background:var(--card2);border-left:3px solid var(--moss);
  padding:7px 9px;border-radius:2px}
.sbadge.shut{border-left-color:var(--rust);opacity:.72}
.sbadge .nm{font-size:13px;font-weight:500;color:var(--ink)}
.sbadge .st{font-size:11.5px;color:var(--ink2);margin-top:1px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.card.flat{background:var(--card2);border-color:var(--line2)}
.listbtn{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:13px 14px}
.listbtn:active{background:var(--card2)}

/* chips */
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:2px;
  background:var(--card2);border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.solid{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.chip.brass{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn-ink)}
.chip.open{background:var(--good-bg);border-color:var(--good-line);color:var(--good-ink)}
.chip.shut{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad-ink)}

/* access gauge */
.pswatch{display:flex;width:64px;height:64px;border-radius:17px;overflow:hidden;
  border:1px solid var(--line)}
.pswatch i{flex:1;display:block}

/* Said on the row, not just in the record. Somebody scanning a list and
   picking somewhere to drive has to see which entries nobody has stood on. */
.unver{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  line-height:1;flex:0 0 auto;white-space:nowrap;
  background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}

.accesspct{display:inline-flex;align-items:baseline;gap:1px;padding:3px 8px;border-radius:999px;
  font-size:13px;font-weight:700;line-height:1;flex:0 0 auto;
  background:var(--good-bg);color:var(--good-ink);border:1px solid var(--good-line)}
.accesspct.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:var(--warn-line)}
.accesspct.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.accesspct i{font-style:normal;font-size:10px;font-weight:600;opacity:.75}

.gauge{display:flex;gap:2px;align-items:flex-end;height:16px}
.gauge i{width:5px;background:var(--line);border-radius:1px;display:block}
.gauge i.on{background:var(--deep)}

/* tabs */
/* The raised middle button. It overhangs the bar, so the bar needs room
   above it and the app needs room below - .lfc already reserves 92px, which
   covers the bar plus the overhang. */
.tabbar button.heronav{background:var(--deep);color:var(--on-deep);border-radius:999px;
  margin:-15px 5px 6px;padding:9px 4px 7px;box-shadow:0 5px 14px -5px rgba(0,0,0,.5);
  font-weight:700}
.tabbar button.heronav.on{color:var(--on-deep);box-shadow:0 5px 14px -5px rgba(0,0,0,.5)}
.tabbar button.heronav svg{stroke-width:2}
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:52;   /* above .scrim - see the note there */
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{padding:10px 1px 12px;font-size:10.5px;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--deep)}
.tabbar button.on svg{stroke:var(--deep)}
.tabbar svg{width:21px;height:21px;stroke:var(--ink3);fill:none;stroke-width:1.6}

/* TWO LAYERS OF TABS, TOLD APART.

   The nav bar says which PLACE you are in; a segbar says which part of the
   page you are looking at. They were both a filled deep block when active -
   the same weight the raised hero button uses - so nothing about the screen
   said which level a tap would move you in.

   The nav keeps the weight, because it is the bigger move. In-page tabs are
   text with an underline: clearly a control, clearly subordinate, and it
   stops competing with the bar at the bottom. */
.segbar{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;
  scrollbar-width:none}
.segbar::-webkit-scrollbar{height:0}
.segbar button{flex:0 0 auto;padding:9px 12px 8px;font-size:13.5px;color:var(--ink2);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.segbar button.on{color:var(--deep);font-weight:700;border-bottom-color:var(--deep)}

/* buttons */
.btn{background:var(--deep);color:var(--on-deep);padding:13px 16px;border-radius:4px;
  font-size:15px;font-weight:500;width:100%;text-align:center;display:block}
/* Was a literal teal, which stayed teal when the rest of the app stopped
   being teal. The pressed state is just the accent, one step down. */
.btn:active{background:var(--deep2)}
.btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
/* Brass is a mid-tone in BOTH themes, so this takes dark ink either way.
   It inherited near-white from .btn and came out at 1.86:1 - a real
   light-mode contrast failure that predated dark mode and that nobody had
   measured. */
.btn.brass{background:var(--brass);color:var(--on-brass)}

/* DISABLED, once, for everything.

   The app told people "the buttons are greyed out until you have a
   connection" and nothing greyed anything out - the only disabled styling
   was three inline opacity values on three particular buttons. A control
   that is unavailable has to LOOK unavailable, or the copy explaining it is
   a lie the interface is telling.

   Not just opacity: the cursor and the pointer events say it too, so a tap
   does nothing and looks like it will do nothing. */
/* A way out of a form field, under the control rather than beside it - the
   picker is what you came for, this is where to go if the answer is not
   obvious. */
/* Small, quiet, and the same everywhere. It sits beside a label rather than
   floating, so it never covers the thing it explains. */
.helpq{width:17px;height:17px;flex:0 0 17px;border-radius:50%;font-size:11px;
  font-weight:700;line-height:1;display:inline-grid;place-items:center;
  border:1px solid var(--line);background:var(--card2);color:var(--ink2)}
.helpq.on{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.helpnote{margin-top:8px;padding:10px 12px;border-radius:9px;
  background:var(--card2);border:1px solid var(--line2)}
.helpnote b{display:block;font-size:12px;text-transform:uppercase;
  letter-spacing:.06em;color:var(--ink2)}
.helpnote p{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--ink2)}

.lexrow{width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.lexrow+.lexrow{margin-top:7px}
.lexrow .t{font-weight:600;font-size:14.5px}
.lexrow .d{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:4px}
.lexrow .more{font-size:13px;color:var(--ink2);line-height:1.5;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line2)}

.srchwrap{position:relative;display:flex;align-items:center}
.srchwrap .srchic{position:absolute;left:11px;color:var(--ink3);pointer-events:none}
.srchwrap input{padding-left:33px;padding-right:34px;margin:0}
.srchx{position:absolute;right:8px;width:24px;height:24px;display:flex;align-items:center;
  justify-content:center;border-radius:999px;color:var(--ink2);background:var(--card2)}

.fieldlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--deep);
  padding:6px 0 0;font-weight:600}

button:disabled,.btn:disabled,.chip:disabled,.fchip:disabled,.opt:disabled{
  opacity:.42;cursor:not-allowed;box-shadow:none}
button:disabled{pointer-events:none}
/* Kept tappable so a screen reader and a curious finger can still reach it;
   the aria-disabled state is what tells you why. */
button[aria-disabled="true"]{opacity:.42;cursor:not-allowed}
.btn.danger{background:transparent;color:var(--rust);border:1px solid var(--bad-line)}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto;display:inline-block}

/* sheet */
/* WHY THE NAV BAR STOPPED WORKING WITH A PIN OPEN.

   Every sheet drew this at inset:0 and z-index 50, over a .tabbar at 40. A
   peek sheet only covers 87% of the screen, so the nav bar stayed visible
   under a half-opacity wash - and every tap on it hit the scrim, which
   closes the sheet. So the first tap on Map or Guide did not navigate, it
   dismissed the record, and you had to tap again. That is the whole of
   "clunky and often non-responsive if you have pins open".

   A peek sheet is a record you glance at, not a modal - so its scrim now
   stops above the bar and the bar sits above the scrim. A FULL sheet is a
   form or a wizard and still covers everything, because navigating away
   from a half-filled form is not a thing to make easy. */
.scrim{position:fixed;inset:0;background:rgba(20,28,20,.5);z-index:50}
.scrim.soft{bottom:calc(58px + env(safe-area-inset-bottom))}
.sheet{position:fixed;inset:0;z-index:51;background:var(--base);
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethdr{position:sticky;top:0;background:var(--base);z-index:2;
  border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{font-size:15px;color:var(--deep);padding:6px 2px;white-space:nowrap}
.linkrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);padding:8px 9px}
.linkrow a{display:flex;align-items:center;gap:7px;flex:1;min-width:0;color:var(--ink)}
.linkrow-label{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow-host{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap;flex:0 0 auto}
.linkx{color:var(--ink3);padding:4px;flex:0 0 auto;display:grid;place-items:center}
.starbtn{color:var(--ink3);padding:5px 3px;display:inline-flex;align-items:center}
.starbtn.on{color:var(--brass)}
.backlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--deep);
  text-transform:uppercase;letter-spacing:.07em;padding:2px 0 5px}

/* A RECORD opens as a peek: the page it came from stays visible above it, so
   arriving at a tactic from a fish record reads as going deeper rather than
   going somewhere else. You reach one record from four or five places, and a
   full screen made every one of those feel like leaving.

   FORMS do not do this. "Log a catch" is a task, not a reference - it wants
   the whole screen and there is nothing behind it worth keeping in view. So
   peek is opt-in per sheet rather than the default.

   Animating "top" rather than "transform" matters: bottom stays pinned at 0,
   so the sheet's own height changes with it and the last line of content is
   always reachable. A translated sheet pushes its own footer off-screen. */
.sheet.peek{top:13%;border-radius:14px 14px 0 0;box-shadow:0 -8px 28px -12px rgba(0,0,0,.4)}
.sheet.peek.full{top:0;border-radius:0}
.grab{display:flex;justify-content:center;padding:7px 0 1px;cursor:pointer}
.grab i{display:block;width:34px;height:4px;border-radius:3px;background:var(--line);
  transition:background .15s}
.grab:hover i,.grab:focus-visible i{background:var(--ink3)}
.expand{font-size:13px;color:var(--deep);padding:6px 4px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
@media (prefers-reduced-motion:no-preference){
  .sheet.peek{transition:top .2s ease,border-radius .2s ease}
}

/* encyclopedia home */
/* map, full bleed */
/* As a tab it fills the space between the header area and the nav bar,
   rather than covering the screen. 100dvh keeps it honest when a mobile
   browser's own chrome slides away. */
.tabfull{position:fixed;top:0;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;
  z-index:1;pointer-events:none}
.tabfull > *{pointer-events:auto}
.mapfull-tab{bottom:calc(58px + env(safe-area-inset-bottom))}
.mapfull{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
/* The viewport takes whatever the drawer leaves. min-height:0 is what lets a
   flex child actually shrink rather than insisting on its content size. */
.mapviewport{flex:1;position:relative;min-height:0}
.mapcanvas{position:absolute;inset:0}
.mapcanvas canvas{display:block;touch-action:none;cursor:grab}

/* The control column starts BELOW the top bar and the drawer is anchored to
   the bottom, so in the resting state nothing can overlap anything. When the
   drawer is pulled up it would eventually reach the column, so the column
   fades out instead - the drawer is what you are looking at by then. */
.maptop{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:7px;
  align-items:center;z-index:3}
/* MAP CHROME DOES NOT FOLLOW THE THEME.

   The map itself is drawn light in both themes, so the controls floating on
   it are a fixed light surface - and their ink has to be fixed too. Taking
   it from var(--ink) meant that in dark mode the pill painted near-white
   text on its own near-white background, and the buttons drew a pale --deep
   that barely showed. These three do not flip, because what is behind them
   does not flip either. */
:root{--map-ink:#1B1F1A;--map-ink2:#5C6358;--map-accent:#2C4C5A}
.mappill{display:inline-flex;align-items:center;gap:6px;background:rgba(252,253,250,.94);
  border:1px solid rgba(0,0,0,.10);border-radius:999px;padding:7px 12px;font-size:12.5px;
  font-weight:600;color:var(--map-ink);box-shadow:0 3px 10px -4px rgba(0,0,0,.35);
  white-space:nowrap;min-width:0;max-width:100%}
.mappill .sub{font-weight:400;color:var(--map-ink2);font-size:11px;overflow:hidden;
  text-overflow:ellipsis}

/* Hangs under the top bar, so it never reaches the control column or the
   drawer. Scrolls if the list ever outgrows the space. */
.regionpick{position:absolute;left:10px;top:calc(56px + env(safe-area-inset-top));width:min(260px,calc(100% - 76px));z-index:4;
  background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 10px 28px -10px rgba(0,0,0,.45);max-height:60%;overflow-y:auto}
.regionrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
  text-align:left;padding:10px 12px;font-size:13.5px}
.regionrow+.regionrow{border-top:1px solid var(--line2)}
.regionrow.on{background:var(--card2)}
.regionrow.on .regionnm{font-weight:700;color:var(--deep)}
.regionnm{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
/* The only place --brass was small text, at 3.74:1 and 9.5px. --brass has to
   stay light enough for near-black text to sit ON it, so it cannot also be a
   text colour on a card - those two pull opposite ways. This is a warning
   label anyway, so it takes the warning ink: 7.5:1 light, 8.2:1 dark. */
.regionflag{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--warn-ink)}
.regionmt{font-size:11px;color:var(--ink3);flex:0 0 auto}

.mapfab{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;
  z-index:3}
.mfab{width:40px;height:40px;border-radius:13px;background:rgba(252,253,250,.94);
  border:1px solid rgba(0,0,0,.10);display:grid;place-items:center;color:var(--map-accent);
  box-shadow:0 3px 10px -3px rgba(0,0,0,.32)}
.mfab.on{background:var(--map-accent);color:#FCFDFA;border-color:var(--map-accent)}
.mfab:disabled{opacity:.5}
.mfab .lbl{font-size:8px;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}

/* A percentage after all, now that it is draggable - the range the user picks
   from is a third to two thirds of the screen, so that is the unit. The old
   pixel floor existed to stop the panel reaching the control column; the
   column now gets out of the way instead, which is what the comment here used
   to claim happened and nothing actually did. */
.mapdrawer{flex:0 0 auto;background:var(--base);border-top:1px solid var(--line2);
  box-shadow:0 -8px 26px -12px rgba(0,0,0,.3);display:flex;flex-direction:column;
  min-height:0;transition:height .12s ease}
.mapgrab{touch-action:none;cursor:grab}
.mapgrab:active{cursor:grabbing}
/* Taller than about half and the panel is what you are working in, so the
   controls step aside rather than being covered by it. Not display:none -
   they come back the moment you pull it down, and a control that vanishes
   entirely is one you have to go looking for. */
.mapfab.tucked{opacity:0;pointer-events:none;transform:translateY(8px)}
.mapfab{transition:opacity .14s ease,transform .14s ease}
.mapgrab{display:flex;justify-content:center;padding:8px 0 6px;flex:0 0 auto}
.mapgrab i{width:34px;height:4px;border-radius:3px;background:var(--line);display:block}
.mapdrawerhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0 15px 8px;flex:0 0 auto}
.mapdrawerhd .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
/* .mapdrawer is --base, not a card, so this takes --ink2 - see the note on
   --ink3 where it is defined. */
.mapdrawerhd .mt{font-size:10.5px;color:var(--ink2);flex:0 0 auto}
.mapdrawerbody{overflow-y:auto;padding:0 15px calc(14px + env(safe-area-inset-bottom))}
.mapdrawerbody::-webkit-scrollbar{width:0}
/* Attribution lives in the drawer, which is always on screen, so it can never
   be covered by the drawer or the controls. */
/* The one piece of --ink3 TEXT that sits on the page ground rather than on a
   card, where it read 3.89:1 at 9.5px. It is also the OpenStreetMap credit,
   which is a licence condition, so it should be legible. --ink2 on base. */
.mapattrib{font-size:9.5px;color:var(--ink2);padding:0 15px 10px;flex:0 0 auto}

/* dashboard */
.placeline{display:flex;align-items:center;gap:7px;min-width:0}
.placebtn{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--deep);flex:0 0 22px}
.placebtn:disabled{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:sp 1.1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
}

/* The white surround is not decoration - a QR code with no quiet zone
   around it will not scan. The svg viewBox carries two modules of margin
   and this keeps that margin white whatever the card behind it is doing. */
.optgrid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Seven tiles in two columns leaves the last one alone in a half-width slot
   with a hole beside it. The odd one out is About, which is last precisely
   because it is the least reached for, so it takes the full row: a quiet
   footer row rather than an orphan. Wide because it is left over, not
   because it matters more - which is why it stays at the bottom. */
.opttile.wide{grid-column:span 2;flex-direction:row;align-items:center;min-height:0;padding:11px 12px}
.opttile.wide .encytile-txt{flex:1;min-width:0}
.opttile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);padding:12px 12px 13px;min-height:104px}
.opttile .encytile-ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  color:#fff;flex:0 0 32px}
.opttile .encytile-name{display:block;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.opttile .encytile-blurb{display:block;font-size:11.5px;color:var(--ink2);line-height:1.3;
  margin-top:2px}
/* A row that reads as a switch rather than another tile - it is a yes/no,
   and the tiles around it are all pick-one-of-several. */
.optrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.optrow>span:first-child{flex:1;min-width:0}
.optswitch{flex:0 0 40px;width:40px;height:23px;border-radius:999px;background:var(--line);
  position:relative;transition:background .16s ease}
.optswitch i{position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
  background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .16s ease}
.optrow.on .optswitch{background:var(--deep)}
.optrow.on .optswitch i{transform:translateX(17px)}

.cwgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cwopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;
  border:1px solid var(--line);border-radius:10px;background:var(--card)}
.cwopt.on{border-color:var(--deep);box-shadow:0 0 0 1px var(--deep)}
/* Big enough to carry the full cut. This tile's whole job is to show you
   what the icon looks like, and at 46px it was showing the reduced mark -
   a preview of something the app never actually installs. */
.cwswatch{width:64px;height:64px;border-radius:17px;display:grid;place-items:center}
.cwname{font-size:11px;color:var(--ink2);text-align:center;line-height:1.2}
.cwopt.on .cwname{color:var(--ink);font-weight:600}
.qrwrap{margin-top:11px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px;display:grid;place-items:center}
.qrwrap svg{width:100%;max-width:236px;height:auto;display:block}
.wxtile{display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  padding:11px 13px 10px;margin-top:12px;border-left:4px solid var(--sky)}
.wxtile:disabled{opacity:.7}
.wxhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wxwhere{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxwhen{display:inline-flex;align-items:center;font-size:11.5px;color:var(--deep);flex:0 0 auto}
.wxrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.wxtemp{font-size:26px;font-weight:700;letter-spacing:-.02em}
.wxbits{display:flex;flex-direction:column;font-size:13px;min-width:0}
.wxnote{font-size:11px;color:var(--ink3);line-height:1.35;margin-top:8px;
  padding-top:7px;border-top:1px solid var(--line2)}
.triprow,.catchrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 11px;
  box-shadow:var(--shadow)}
.tripdate{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:38px;flex:0 0 38px;line-height:1}
.tripdate b{font-size:17px;letter-spacing:-.02em}
.tripdate span{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.tripbd,.catchbd{flex:1;min-width:0}
.tripname,.catchname{display:block;font-size:14.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tripmeta,.catchmeta{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catchthumb{width:38px;height:38px;flex:0 0 38px;border-radius:8px;overflow:hidden;
  background:var(--card2);display:grid;place-items:center}
.catchthumb img,.catchthumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.catchtime{font-size:11px;color:var(--ink3);flex:0 0 auto}
.triplink{display:flex;align-items:center;justify-content:space-between;gap:10px;
  width:100%;text-align:left}

.statcard{display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;margin-top:12px}
.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.statrow > span{display:flex;flex-direction:column;gap:1px;min-width:0}
.statrow b{font-size:19px;letter-spacing:-.02em;line-height:1.1}
.statrow span span{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
.nearrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 11px;
  box-shadow:var(--shadow)}
.nearicon{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;color:#fff}
.nearicon.spot{background:var(--deep)} .nearicon.pin{background:var(--brass)}
.nearbd{flex:1;min-width:0}
.nearname{display:block;font-size:14px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.nearkind{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.neardist{font-size:12px;color:var(--ink2);flex:0 0 auto;font-variant-numeric:tabular-nums}
.ratecard{border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.ratecard.t-prime{border-left:4px solid var(--moss)}
.ratecard.t-good{border-left:4px solid var(--deep)}
.ratecard.t-fair{border-left:4px solid var(--brass)}
.ratecard.t-slow{border-left:4px solid var(--ink3)}
.ratehead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px}
.ratedial{position:relative;width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center}
.t-prime .ratedial{color:var(--moss)} .t-good .ratedial{color:var(--deep)}
.t-fair .ratedial{color:var(--brass)} .t-slow .ratedial{color:var(--ink3)}
.ratedial svg{position:absolute;inset:0}
.ratenum{font-size:14px;font-weight:700;color:var(--ink)}
.ratetxt{flex:1;min-width:0}
.ratelabel{display:block;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.ratesub{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.ratechev{color:var(--ink3);flex:0 0 14px;transition:transform .16s ease}
.ratechev.up{transform:rotate(180deg)}
.ratebody{border-top:1px solid var(--line2);padding:10px 13px 12px}
.raterow{display:flex;align-items:center;gap:9px;padding:5px 0}
.raterow+.raterow{border-top:1px solid var(--line2)}
.ratekind{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.k-moon{background:var(--plum)} .k-light{background:var(--brass)}
.k-weather{background:var(--sky)} .k-pressure{background:var(--moss)}
.raterow-label{flex:1;min-width:0;font-size:13.5px}
.raterow-delta{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.raterow-delta.up{color:var(--moss)} .raterow-delta.down{color:var(--rust)}

.seasoncard{border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.seasonhero{display:flex;gap:12px;align-items:center;padding:13px;
  background:linear-gradient(135deg,var(--band-a),var(--band-b));color:var(--on-band)}
.seasonart{width:96px;height:78px;flex:0 0 96px;border-radius:9px;overflow:hidden;
  background:rgba(255,255,255,.09);display:grid;place-items:center}
.seasonart img{width:100%;height:100%;object-fit:cover;display:block}
.seasonmain{min-width:0;flex:1}
.seasonkick{font-size:11px;text-transform:uppercase;letter-spacing:.11em;opacity:.75}
.seasonmain h2{font-size:20px;margin:2px 0 0;letter-spacing:-.015em;color:var(--on-band)}
.seasonwhy{font-size:12.5px;line-height:1.4;margin:5px 0 0;opacity:.9;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seasonopen{font-size:11.5px;margin-top:6px;opacity:.8}
.seasonmore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:10px;font-size:12.5px;font-weight:600;color:var(--deep);
  border-top:1px solid var(--line2)}
.filterbar{display:flex;gap:5px;overflow-x:auto;padding:10px 0 3px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{height:0}
.fchip{flex:0 0 auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);white-space:nowrap}
.fchip.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.fchip.clear{border-style:dashed;color:var(--ink3)}
.fchip:disabled{opacity:.4}
.quickbar{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.quickbar::-webkit-scrollbar{height:0}
.quickchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;
  color:var(--ink);white-space:nowrap}
.quickchip i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}

/* Four columns, and only the COLUMN span is set per size - height comes
   from aspect-ratio. Spanning rows as well would need a fixed row height,
   which cannot be derived from the column width in CSS, and every attempt
   at it leaves gaps when a small tile sits beside a wide one. This way
   four smalls fill a row on their own and the browser does the packing. */
.encygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;
  grid-auto-flow:row dense}
.encytile{border:1px solid var(--line);border-radius:11px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;min-width:0;display:flex;flex-direction:column}
/* Small is HALF THE WIDTH of wide, and nothing else - that was the whole of
   the request. A ratio of 2 on a half-width tile made it 151px tall to hold
   an icon and one word, next to a wide tile holding the same thing in 72px,
   and a row that changes height depending on how many tiles are in it reads
   as a broken grid rather than a choice. Same height, half the width. */
.encytile.s-small{aspect-ratio:auto;min-height:72px}
/* A wide tile is the full row, not two columns, so the ratio that suits a
   small tile makes this one twice as tall for exactly the same one line of
   content - a 305px card holding 63px of head and 240px of nothing. It is a
   banner; its content sets its height, the way an open tile already does. */
.encytile.s-wide{aspect-ratio:auto}
/* Once a tile is open its content sets the height - an aspect ratio would
   either clip the preview rows or leave a hole under them. */
.encytile.open{aspect-ratio:auto}   /* see also the shadow rule below */
.encytile.s-large{aspect-ratio:auto;min-height:210px}
.encytile.dragging{opacity:.55;transform:scale(.97)}
.encytile.arranging{touch-action:none;cursor:grab}
.encytiles{display:flex;flex-direction:column;gap:7px;margin-top:14px}

/* A small tile has a quarter of the width, so it drops the blurb, the count
   and the chevron and stacks what is left. */
.encytile.s-small .encytile-head{gap:9px;padding:11px 12px;height:100%}
.encytile.s-small .encytile-name{font-size:14px;line-height:1.2}
.encytile.s-small.open .encytile-head{flex-direction:row;align-items:center;gap:11px;
  padding:12px 13px;height:auto}
.encytile.s-small.open .encytile-name{font-size:15.5px}

.tilebar{display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line2);background:var(--card2)}
.tilebtn{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--deep);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--card);
  white-space:nowrap}
.tilebtn.danger{color:var(--rust);border-color:var(--bad-line)}
.tilebtn.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
.tilegrip{color:var(--ink3);flex:0 0 auto}
.tileicon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--deep);flex:0 0 22px}
.tileicon:disabled{opacity:.3}
.tileicon.danger{color:var(--rust);border-color:var(--bad-line);margin-left:auto}
.tilebar .tilebtn{padding:3px 7px;min-width:24px;text-align:center}
/* The second .encytile block that used to sit here declared the same border,
   radius, background and shadow as the one above and nothing else, so it did
   no work - but two rules with the same selector and equal specificity is how
   the .mfab bug hid for weeks. Merged upward. */
.encytile.open{border-color:var(--line);box-shadow:0 2px 10px -6px rgba(0,0,0,.3)}
.encytile-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px}
.encytile-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:#fff;flex:0 0 34px}
.encytile-txt{flex:1;min-width:0}
.encytile-name{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.encytile-blurb{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
.encytile-n{font-size:12.5px;color:var(--ink3);flex:0 0 auto}
.encytile-chev{color:var(--ink3);flex:0 0 14px;transition:transform .16s ease}
.encytile.open .encytile-chev{transform:rotate(180deg)}
.encytile-body{border-top:1px solid var(--line2);padding:5px 13px 11px}
.encyrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 0;
  border-bottom:1px solid var(--line2)}
.encyrow:last-of-type{border-bottom:none}
.encyrow-art{width:34px;height:26px;flex:0 0 34px;border-radius:4px;overflow:hidden;
  background:var(--card2);display:grid;place-items:center}
.encyrow-art img{width:100%;height:100%;object-fit:cover;display:block}
.encyrow-dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;margin-left:13px}
.encyrow-name{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.encyrow-mine{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.encyseeall{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--deep);
  padding:9px 0 2px;font-weight:600}

.encyhit{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:11px 12px}
.encyhit-bar{width:3px;border-radius:2px;flex:0 0 3px}
.encyhit-bd{flex:1;min-width:0}
.encyhit-name{display:block;font-weight:600;font-size:14.5px}
.encyhit-cat{display:block;font-size:11.5px;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.07em;margin-top:1px}

.favslots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.favslot{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.favslot-art{width:100%;aspect-ratio:1;border:1.5px solid;border-radius:9px;overflow:hidden;
  background:var(--card);display:grid;place-items:center}
.favslot-art img{width:100%;height:100%;object-fit:cover;display:block}
.favslot-art i{width:11px;height:11px;border-radius:3px}
.favslot-name{font-size:10.5px;line-height:1.2;text-align:center;color:var(--ink2);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* tactics */
.tac{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left}
.tac .bar{width:4px;flex:0 0 4px;border-radius:3px}
.tac .bd{min-width:0;flex:1}
.diffchip{font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;flex:0 0 auto}
.diffchip.d1{background:var(--good-bg);color:var(--good-ink)}
.diffchip.d2{background:var(--warn-bg);color:var(--warn-ink)}
.diffchip.d3{background:var(--bad-bg);color:var(--bad-ink)}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.glance .g{background:var(--card2);border-radius:5px;padding:7px 8px;min-width:0}
.glance .g b{display:block;font-size:11px;color:var(--ink3);font-weight:500;
  text-transform:uppercase;letter-spacing:.06em}
.glance .g span{font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;font-size:14px;line-height:1.5;
  color:var(--ink2);margin-bottom:9px}
.steps li:before{content:counter(s);flex:0 0 19px;height:19px;border-radius:5px;
  background:var(--card2);color:var(--ink3);font-size:11.5px;display:grid;
  place-items:center;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px;
  color:var(--ink);margin:0 5px 5px 0}
.pill i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.callout{border-radius:6px;padding:9px 11px;font-size:13.5px;line-height:1.45}
.callout b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:3px;font-weight:600}
.callout.good{background:var(--good-bg);color:var(--good-ink)} .callout.good b{color:var(--moss)}
.callout.bad{background:var(--bad-bg);color:var(--bad-ink)}  .callout.bad b{color:var(--rust)}

/* field */
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:11px 8px;font-size:13.5px;text-align:center;color:var(--ink)}
.opt.on{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}

/* table */
/* Numbered rather than bulleted: these are things done in an order, and the
   order is most of the advice. */
.steplist{margin:9px 0 0;padding:0;list-style:none;counter-reset:step}
.steplist li{position:relative;padding:0 0 0 26px;font-size:13.5px;line-height:1.5;
  color:var(--ink2);counter-increment:step}
.steplist li+li{margin-top:8px}
.steplist li::before{content:counter(step);position:absolute;left:0;top:1px;width:18px;
  height:18px;border-radius:50%;background:var(--card2);color:var(--ink3);font-size:10.5px;
  font-weight:700;display:grid;place-items:center}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);font-size:12.5px;
  padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}

/* prose */
/* This was a literal #2A3327 - near-black - on ten screens: the spot blurb,
   species habits, how to fish a bait, a tactic's gist, every wizard intro. On a
   dark card that is 1.22:1, which is invisible, and it is the text sitting
   directly above the Conditions heading where it was reported.

   The token sweep could not see it. It compared tokens against tokens, and a
   hard-coded hex is in neither column - which is the argument for auditing
   rendered text against its real background instead. */
.prose{font-family:'Newsreader',Georgia,serif;font-size:16.5px;line-height:1.58;color:var(--ink)}
.prose p{margin:0 0 11px;max-width:66ch}

hr.rule{border:none;border-top:1px solid var(--line);margin:18px 0}
.divlabel{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:12.5px;margin:20px 0 9px}
.divlabel:after{content:"";flex:1;height:1px;background:var(--line)}

@media (prefers-reduced-motion:no-preference){

  @keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
}
