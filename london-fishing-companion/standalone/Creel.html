itional local window"],baits:["spinner","grub","microjig"],where:["forks","springbank","greenway"],size:"10\u201314 inches, caught in numbers"},{id:"drum",name:"Freshwater drum",sci:"Aplodinotus grunniens",prov:"ON",season:"none",art:{body:"#A9A692",back:"#4C4B3C",belly:"#F0EEE0",deep:!0,marks:"scales"},idKey:["Steeply humped back and a blunt downturned mouth","Long continuous dorsal fin with a notch","Rounded rather than forked tail","Dull silver; makes an audible grunting sound when landed"],vs:"Carp: barbels at the mouth, gold rather than silver, no humped back.",habits:"A bottom feeder over gravel and sand that crushes molluscs and crayfish. Common in the main branch and often caught by accident by walleye and smallmouth anglers. Locals call them sheephead.",target:["Bottom-bounced jigs and crawlers over gravel","Not usually a target, but they fight hard and are worth enjoying when they come"],baits:["jigminnow","crawler","tube"],where:["forks","springbank","komoka"],size:"2\u20136 lb typical"},{id:"trout",name:"Migratory trout & salmon",sci:"Oncorhynchus / Salmo spp.",prov:"ON",season:"troutThames",art:{body:"#8FA0A4",back:"#3E5158",belly:"#F2F0E6",marks:"speckle",forked:!1,slim:!0},idKey:["Small fleshy adipose fin between the dorsal and the tail","Rainbow trout: pink lateral band and heavy black spotting into the tail","Brown trout: black and red spots with pale halos, spots not on the tail","Chinook: black gums and a heavily spotted tail"],vs:"Any bass or walleye: no adipose fin. That single fin settles it.",habits:"Occasional visitors this far up the Thames, not a resident population. Historically taken at Springbank and Delaware, most often in cold water with high flow. Treat every one as a bonus.",target:["Cold water, high flow, spring and late autumn","Spoons, spinners and drifted roe in the deeper runs","Check the exceptions carefully \u2014 the Thames main branch in Middlesex County runs a different season to the rest of the zone"],baits:["spoon","spinner","crawler"],where:["springbank","kilally","komoka"],size:"Rare but real \u2014 10 lb rainbows have been reported at Springbank"},{id:"sucker",name:"White sucker",sci:"Catostomus commersonii",prov:"ON",season:"none",art:{body:"#8A8578",back:"#4A473C",belly:"#EBE9DC",slim:!0},idKey:["Mouth on the underside of the head with thick fleshy lips","No barbels","Plain olive-brown, slightly paler on the belly","Torpedo body with a large forked tail"],vs:"Carp: barbels, larger scales, much deeper body.",habits:"A bottom feeder in warm shallow water throughout the river. Runs upstream in spring in numbers. Frequently caught on bottom-fished worms while you are after something else.",target:["Worm on the bottom in a slow run","Good bait indicator \u2014 where suckers feed, the bottom is soft and food-rich"],baits:["worm","crawler"],where:["springbank","gibbons","meadowlily","komoka"],size:"12\u201320 inches"},{id:"cutty",name:"Coastal cutthroat trout",sci:"Oncorhynchus clarkii clarkii",prov:"BC",season:"bcFresh",art:{body:"#7E8768",back:"#3B452C",belly:"#E9E6CE",marks:"speckle",slim:!0,forked:!0,eye:"#2A2C1E"},idKey:["Red or orange slash under each side of the lower jaw \u2014 the cut it is named for","Small irregular black spots over the whole body AND the tail","Adipose fin present \u2014 a small fleshy fin between the dorsal and the tail","Sea-run fish are bright silver and the slash can be very faint on them"],vs:"Rainbow and steelhead: no jaw slash, and the spots are usually finer and more even. A silver sea-run cutthroat and a small steelhead are genuinely hard to separate \u2014 look under the jaw.",habits:"The resident predator of the lower Fraser and its tributaries, and the one fish here worth going after most of the year. Sea-run fish move into the tidal river and the tributary mouths in spring chasing salmon fry, and again in autumn behind the spawning salmon eating eggs and dying flesh. They hold in slack water beside current \u2014 back eddies, the inside of channel bends, log jams, and the Bedford Channel side of the island.",target:["Spring, March to May, at the tributary mouths \u2014 the fish are there for the outgoing salmon fry and a small silver bait is the whole trick","Autumn, behind spawning salmon, on anything that looks like an egg","Fish the slack next to the current, never the current itself","Small everything. A cutthroat spinner is a size 1 or 2, not a salmon spinner"],baits:["spinner","jerkbait","worm","microjig"],where:["bc-fortlangley","bc-derbyreach","bc-salmonriver","bc-alouette","bc-nicomekl"],size:"Sea-run 12\u201318 inches; a 20-inch cutthroat is a very good fish"},{id:"rbt",name:"Rainbow trout",sci:"Oncorhynchus mykiss",prov:"BC",season:"bcFresh",art:{body:"#8E9179",back:"#42503A",belly:"#F0EDD9",marks:"speckle",slim:!0,forked:!0,eye:"#2A2C1E"},idKey:["Pink or red band along the flank, strongest on a mature fish","Small black spots scattered over the back, dorsal fin and tail","Adipose fin present","No red slash under the jaw"],vs:"Cutthroat: red slash under the lower jaw. Steelhead: the same species, but a sea-run one \u2014 bright chrome, larger, and legally a different fish.",habits:"In this region rainbow mostly means a stocked lake fish. The Freshwater Fisheries Society of BC puts catchable rainbow of 200\u2013300 g into small lakes like Whonnock in spring and autumn, and those fish behave like stocked fish everywhere: they hold in the top few feet for a week or two after release, then settle deeper and get harder. Alouette gets rainbow in alternate years and fishes like a proper cold reservoir.",target:["Go within a fortnight of a stocking. The Freshwater Fisheries Society publishes its stocking records lake by lake","Small lakes: a worm or a wax worm under a float, or a micro jig, from the bank","Reservoirs: work the drop-off out from the launch, and the creek mouths","By late summer a small lake warms up and the fish drop out of reach from the bank"],baits:["worm","waxworm","microjig","spinner","spoon"],where:["bc-whonnock","bc-alouette","bc-salmonriver","bc-nicomekl"],size:"Stocked 10\u201312 inches at 200\u2013300 g; reservoir fish larger"},{id:"steel",name:"Steelhead",sci:"Oncorhynchus mykiss",prov:"BC",season:"bcFresh",art:{body:"#A7AC96",back:"#4B5545",belly:"#F4F2E4",marks:"speckle",slim:!0,forked:!0,eye:"#2A2C1E"},idKey:["Bright chrome flanks with a clean white belly on a fresh fish","Small black spots on the back and across the whole tail","Adipose fin present \u2014 and whether it is present or clipped is the legal question","Thick shoulders and a small head for the body length"],vs:"A rainbow trout that went to sea and came back. Coho: no spots on the lower tail, and white gums. Cutthroat: jaw slash, smaller.",habits:"The hardest fish in this region to catch on purpose and the one with the tightest rules. Winter and spring fish run the larger Lower Mainland rivers; the small Langley tributaries hold a few and are not a steelhead fishery in any real sense. Fish hold in the tail-out of a run, in the seam, and in the deeper water under a cut bank.",target:["Wild steelhead in the Lower Mainland are protected. An unclipped adipose fin means release it, in the water, without lifting it","This is a river you cover rather than a spot you sit on \u2014 a step and a cast, repeated","Tail-outs and seams, and the water nobody else has walked through","If you are catching steelhead in Langley you are lucky, not skilled \u2014 the numbers here are small"],baits:["spinner","spoon","jerkbait"],where:["bc-salmonriver","bc-nicomekl","bc-campbellvalley"],size:"Winter fish 8\u201315 lb; a 20 lb steelhead is a fish of a lifetime"},{id:"chinook",name:"Chinook salmon",sci:"Oncorhynchus tshawytscha",prov:"BC",season:"bcSalmon",art:{body:"#7C8474",back:"#2F3A2F",belly:"#E4E3D2",marks:"spots",slim:!0,forked:!0,eye:"#25281C"},idKey:["Black gums along the base of the teeth in the lower jaw \u2014 the single most reliable mark","Small black spots on the back AND on both lobes of the tail","Silver body, heavy through the shoulders, biggest of the Pacific salmon","Locally called a spring, or a king"],vs:"Coho: white gums, and spots on the upper tail lobe only. Chum: no spots on the tail at all, and white fin tips.",habits:"The Fraser run is what the bars at Glen Valley and Derby Reach exist for. Fish move through the tidal river from late summer into autumn, holding in the deeper channel and running the edges of the bars on the tide. They are travelling rather than feeding, so it is about intercepting them on a known line rather than finding a feeding fish.",target:["Bar fishing the tidal Fraser: a bait or a spin-n-glow above a lead, on the seam off the bar, and then you wait","The seam where fast water meets the slack behind a bar is the line the fish follow","Fish the ebb \u2014 the tide moves the line the fish are on","Retention is set by DFO notice and changes within a season and between stocks. Read the current notice for Area 29 before you go"],baits:["spoon","spinner","cutbait"],where:["bc-glenvalley","bc-derbyreach","bc-fortlangley"],size:"Fraser fish 15\u201330 lb, with much larger possible"},{id:"coho",name:"Coho salmon",sci:"Oncorhynchus kisutch",prov:"BC",season:"bcSalmon",art:{body:"#899180",back:"#37432F",belly:"#EDEBDA",marks:"spots",slim:!0,forked:!0,eye:"#25281C"},idKey:["White gums \u2014 the mirror of the chinook's black ones","Small black spots on the back and on the UPPER lobe of the tail only","Bright silver at sea, turning dark with a deep red flank in the river","Locally called a silver, or a bluefish when fresh from the salt"],vs:"Chinook: black gums, spots on both tail lobes. Chum: no tail spots, and vertical calico bars once coloured up.",habits:"Coho use the small streams, which is why they matter in Langley specifically \u2014 the Salmon River, the Nicomekl and the Little Campbell all carry them. They come in on autumn rain: a dry October means fish waiting at the mouth, and a wet one means fish spread up the system overnight. Aggressive and willing to chase, unlike most salmon in fresh water.",target:["Fish after rain. A rise in the river is the trigger and the fish move on it","Coho chase \u2014 a spinner or a small spoon worked across the current outfishes bait for them","The lower reaches and the mouth first, then work up as the water comes up","Wild coho in the Lower Mainland are frequently non-retention. A clipped adipose fin means hatchery; unclipped means release"],baits:["spinner","spoon","jerkbait"],where:["bc-salmonriver","bc-nicomekl","bc-derbyreach","bc-campbellvalley"],size:"6\u201312 lb"},{id:"chum",name:"Chum salmon",sci:"Oncorhynchus keta",prov:"BC",season:"bcSalmon",art:{body:"#7F8778",back:"#38412F",belly:"#E8E6D6",marks:"vbars",slim:!0,forked:!0,eye:"#25281C",whiteTip:!0},idKey:["No black spots on the back or the tail \u2014 that absence is the mark","Faint white tips on the tail and the anal fin","In the river, bold vertical calico bars of purple, green and grey down the flank","A deep narrow tail base and, on a male, a badly hooked jaw with large teeth"],vs:"Coho and chinook: both spotted. A big autumn salmon with no spots and calico bars is a chum.",habits:"The most numerous salmon most people will hook here, and the one that made the lower Fraser autumn fishery. They run late \u2014 roughly late October into December \u2014 and they hold in slow deep water in loose groups rather than moving constantly. They fight far harder than their reputation suggests.",target:["Late autumn. Chum are the fish still running when the coho are finished","Slow deep water and the tail of a pool, not the fast stuff","Chartreuse and purple, which is not folklore with this fish \u2014 they do respond to it","A fish that has coloured up is close to spawning. The fresh ones down at the mouth are the ones worth keeping"],baits:["spinner","spoon","jigminnow"],where:["bc-derbyreach","bc-glenvalley","bc-fortlangley","bc-salmonriver"],size:"8\u201315 lb"},{id:"pink",name:"Pink salmon",sci:"Oncorhynchus gorbuscha",prov:"BC",season:"bcSalmon",art:{body:"#96997F",back:"#454E3C",belly:"#F1EEDC",marks:"spots",slim:!0,forked:!0,eye:"#25281C"},idKey:["Very large oval black blotches over the whole tail, far bigger than any other salmon's spots","Smallest and slimmest of the Pacific salmon, with very fine scales","A spawning male grows a pronounced hump \u2014 hence humpback, or humpy","Present in strength on the Fraser only in odd-numbered years"],vs:"Every other salmon: the tail blotches settle it. Coho and chinook have small round spots.",habits:"The Fraser pink run works on a two-year cycle and it is an odd-year fish here, arriving in very large numbers in late summer when it arrives at all. In an on-year they are the easiest salmon in the river to catch and the whole lower river fishes for them; in an off-year there is little point looking.",target:["Check the year first. An even year on the Fraser is not a pink year","Small pink or fluorescent everything \u2014 a small jig or a tiny spoon in pink is the standard","They run close to the bank, so a long cast is not the answer","Soft flesh that spoils fast. Bleed and ice it immediately or do not keep it"],baits:["spoon","spinner","microjig"],where:["bc-glenvalley","bc-derbyreach"],size:"3\u20136 lb"},{id:"sturgeon",name:"White sturgeon",sci:"Acipenser transmontanus",prov:"BC",season:"bcSturgeon",art:{body:"#7B7A6A",back:"#3A3B31",belly:"#DEDCCB",slim:!0,gar:!0,barbels:!0,eye:"#23241B"},idKey:["Rows of bony plates along the back and flanks instead of scales","A long snout with barbels underneath, and the mouth on the underside","A shark-like tail with a much longer upper lobe","Enormous \u2014 the largest freshwater fish in North America"],vs:"Nothing else in this river looks remotely like it.",habits:"The lower Fraser holds the one healthy white sturgeon population left, and a fish in front of Derby Reach or Glen Valley can be older than the parks are. They lie on the bottom in the deep channel holes and feed on whatever the river brings down \u2014 eulachon in spring, salmon carcasses in autumn.",target:["Bottom fishing the deep channel with a heavy rod and a lot of lead, and mostly waiting","A hooked sturgeon is a big animal and a serious handful from the bank. Most people fish for these from a guided boat and there is a reason for that","Never lift one clear of the water and never out of it: keep it in the river, support it, and let it go","Mandatory catch and release throughout. There is no version of this where you keep one"],baits:["cutbait","crawler"],where:["bc-derbyreach","bc-glenvalley","bc-fortlangley"],size:"Commonly 3\u20136 ft; the Fraser produces fish over 10 ft"},{id:"bull",name:"Bull trout",sci:"Salvelinus confluentus",prov:"BC",season:"bcFresh",art:{body:"#6F7B63",back:"#333D2C",belly:"#E6E4CE",marks:"beans",slim:!0,eye:"#2A2C1E"},idKey:["Pale cream, yellow or pink spots on a darker green body \u2014 light spots on dark, the reverse of a trout","No black spots anywhere on the dorsal fin","A large flat head and a broad mouth \u2014 the bull it is named for","A char, not a trout, despite the name"],vs:"Any rainbow or cutthroat: those are dark spots on a light body. Brook trout: worm-like pale markings on the back and a squarer tail.",habits:"A cold-water char and a predator of other fish. Uncommon in this region and near the edge of its range at the coast \u2014 fish use the lower Fraser and the deeper reservoirs rather than the small warm tributaries. Spring and autumn are when they show up, following other fish.",target:["Cold, deep, clean water. If a spot is warm and weedy there is no bull trout in it","A larger bait than you would use for cutthroat \u2014 these eat fish","Spring and autumn, in the main river and the reservoirs","Bull trout are a conservation concern in much of BC and are release-only in many waters. Check before you keep one"],baits:["spoon","spinner","jerkbait","shadrap"],where:["bc-derbyreach","bc-alouette"],size:"Coastal fish 2\u20135 lb; interior fish far larger"}],Mb=[{id:"tube",name:"Tube jig",kind:"Soft plastic",sizes:"2.5\u20133 in, 1/8\u20131/4 oz head",colours:"Green pumpkin, crawfish orange, smoke",targets:["smb","rock","crappie","drum"],hook:"Internal tube jig head, size 1/0 \u2014 the weight sits inside the tube so it falls nose-down like a crayfish",rig:"Jig head inserted inside the tube body",float:"No \u2014 you need direct contact with the bottom",how:"Cast upstream at a 45-degree angle, let it sink, then hop it back with the current in short lifts. Most takes come as it falls. If you are not occasionally ticking bottom, go heavier.",when:"The single most productive smallmouth bait in the Thames, all season"},{id:"grub",name:"Curly-tail grub",kind:"Soft plastic",sizes:"3\u20134 in on 1/8 oz head",colours:"Pumpkinseed, white, chartreuse",targets:["smb","wall","rock","wbass"],hook:"Round or darter jig head, size 1 to 1/0",rig:"Threaded straight onto a jig head",float:"No",how:"Steady slow retrieve just off the bottom, with an occasional pause. The tail does the work \u2014 you do not need to add action.",when:"The most forgiving lure in the box. If you own one thing, own this."},{id:"senko",name:"Wacky-rigged stick worm",kind:"Soft plastic",sizes:"4\u20135 in, no weight",colours:"Green pumpkin, black-blue",targets:["lmb","smb"],hook:"Size 1 or 1/0 octopus or wacky hook through the middle of the worm; add an O-ring to make each worm last",rig:"Weightless, hooked through the middle so both ends shimmy on the fall",float:"No",how:"Cast past the cover, let it sink on a slack line, and watch the line rather than the lure. When the line jumps or moves sideways, reel down and lean into it.",when:"Pond largemouth, and clear calm days when nothing else gets bitten"},{id:"texas",name:"Texas-rigged worm or creature",kind:"Soft plastic",sizes:"4\u20136 in, 1/8\u20133/8 oz bullet weight",colours:"Green pumpkin, junebug",targets:["lmb"],hook:"3/0 to 4/0 offset worm hook, point buried in the plastic so it comes through weed-free",rig:"Bullet weight above the hook, point tucked back into the body",float:"No",how:"Pitch into pads and timber, let it fall, shake twice, lift and move. Fish it slowly \u2014 this rig is for getting into places other lures cannot go.",when:"Heavy cover on Westminster Ponds and Dorchester Mill Pond"},{id:"frog",name:"Hollow-body frog",kind:"Topwater",sizes:"2.5 in",colours:"Black, white, green",targets:["lmb","pike"],hook:"Built-in double hook riding upward against the body",rig:"Tied straight to braid \u2014 you need zero stretch to drive those hooks home",float:"It is the float",how:"Walk it across matted pads with small rod twitches, pausing in every gap. When a fish blows up, wait until you feel the weight before setting.",when:"Dawn and dusk over pad mats from June to September"},{id:"spinnerbait",name:"Spinnerbait",kind:"Wire bait",sizes:"3/8 oz, willow or Colorado blade",colours:"White-chartreuse, all white",targets:["pike","lmb","smb"],hook:"Fixed single hook on the wire arm; add a trailer hook when fish are short-striking",rig:"Tie straight to the wire arm",float:"No",how:"Slow-roll it just over the weed tops or bump it off timber. The deflection off cover triggers the strike more than the retrieve does.",when:"Coloured water and weed edges; near weedless, so fish it where you would not risk trebles"},{id:"chatterbait",name:"Bladed jig",kind:"Wire bait",sizes:"3/8 oz",colours:"White, black-blue",targets:["lmb","pike"],hook:"Fixed jig hook, plus a paddle-tail trailer",rig:"Trailer threaded on the hook shank",float:"No",how:"Steady retrieve with a hard vibration you should feel in the rod tip the whole way back. If the vibration stops, something has hold of it.",when:"Stained pond water and low light"},{id:"spinner",name:"Inline spinner",kind:"Hardware",sizes:"Size 2\u20133",colours:"Silver blade, brass blade",targets:["smb","rock","pike","wbass","trout"],hook:"Factory treble \u2014 swap to a single inline hook if you are releasing everything",rig:"Small barrel swivel 18 in up the line to stop line twist",float:"No",how:"Cast across the current and retrieve just fast enough to feel the blade turning. Slower is almost always better than faster.",when:"The easiest lure for a beginner to fish correctly"},{id:"jerkbait",name:"Small jerkbait",kind:"Hard bait",sizes:"2.5\u20133.5 in suspending",colours:"Perch, silver-black, clown",targets:["smb","pike","wall"],hook:"Two size 8\u201310 trebles as supplied; crush the barbs for easier release",rig:"Loop knot or small snap so it can swing freely",float:"No \u2014 it suspends",how:"Two sharp twitches, then a pause of three to five seconds. The pause is where the bite happens. In cold water, make the pause twice as long.",when:"Very small jerkbaits have a long local reputation on the Thames"},{id:"crank",name:"Squarebill crankbait",kind:"Hard bait",sizes:"2 in, shallow diving",colours:"Craw orange, chartreuse-black",targets:["smb","lmb","wall"],hook:"Two size 6\u20138 trebles",rig:"Tie direct or use a small snap",float:"Floats at rest, dives on retrieve",how:"Deliberately bump it into rock and timber. The deflection is what triggers the strike \u2014 a crankbait that never touches anything catches far less.",when:"Covering water fast to find where the fish are holding"},{id:"shadrap",name:"Jointed diving minnow",kind:"Hard bait",sizes:"3\u20135 in jointed",colours:"Perch, blue-silver",targets:["wall","pike"],hook:"Two or three small trebles",rig:"Loop knot for maximum wobble",float:"No",how:"Cast and retrieve very slowly from shore, or troll it along the old river channel at Fanshawe at walking pace.",when:"The bait Fanshawe walleye anglers have used from shore and boat for decades"},{id:"popper",name:"Topwater popper",kind:"Topwater",sizes:"2\u20133 in",colours:"Bone, frog, silver",targets:["smb","lmb","pike"],hook:"Two small trebles; consider replacing the rear treble with a feathered one",rig:"Loop knot so it sits and pops freely",float:"It is the float",how:"Cast, let the rings settle completely, then one sharp pop and wait. Impatience kills more topwater fish than anything else.",when:"First and last light in summer, low clear water"},{id:"spoon",name:"Casting spoon",kind:"Hardware",sizes:"1/2\u20133/4 oz",colours:"Five of Diamonds, silver, brass",targets:["pike","trout"],hook:"Single treble; a wire trace is mandatory for pike",rig:"Snap swivel to prevent twist",float:"No",how:"Cast long, let it flutter down, then retrieve with an occasional pause so it flashes and falls. The flutter on the drop draws pike in.",when:"Cold-water pike, spring and late autumn"},{id:"jigminnow",name:"Jig and minnow",kind:"Live bait rig",sizes:"1/8\u20131/4 oz jig head",colours:"Chartreuse, orange, plain lead",targets:["wall","perch","drum"],hook:"Jig head size 2 to 1/0; hook the minnow once through both lips so it swims naturally",rig:"Jig head only, no extra weight",float:"Optional \u2014 a slip float suspends it over snaggy bottom",how:"Lift twelve inches, let it fall on a semi-slack line, pause, repeat. Almost every take comes on the fall or the pause.",when:"The local standard for walleye at Komoka, Delaware and Fanshawe"},{id:"minnow",name:"Minnow under a float",kind:"Live bait",sizes:"2\u20133 in shiners or dace",colours:"n/a",targets:["perch","crappie","pike"],hook:"Size 4\u20136 baitholder through the back, just behind the dorsal fin",rig:"Slip float, split shot 12 in above the hook",float:"Yes \u2014 a slip float lets you fish deep and still cast",how:"Set the depth so the minnow sits just above weed or bottom. Let the float drift with the current. When it goes under, count two before lifting.",when:"Fanshawe perch in autumn, pond crappie in spring"},{id:"shiner",name:"Large shiner or sucker",kind:"Live bait",sizes:"4\u20136 in",colours:"n/a",targets:["pike","lmb"],hook:"Size 1/0\u20132/0 single or a small quick-strike rig, on a wire trace for pike",rig:"Free-lined or under a large float",float:"Yes, a large sliding float",how:"Cast to the weed edge and let the bait swim. Give a pike line when it takes, then set once it has turned and moved off.",when:"Cold water when pike will not chase a lure"},{id:"crawler",name:"Nightcrawler",kind:"Live bait",sizes:"Whole or half",colours:"n/a",targets:["cat","drum","sucker","carp","wall"],hook:"Size 4\u20138 baitholder with the barbs on the shank that stop the worm sliding down",rig:"Sliding sinker rig on the bottom, or under a float in slow water",float:"Either, depending on target",how:"On the bottom, cast out, tighten gently, and set the rod so you can see the tip. Let it develop \u2014 do not strike at the first tap.",when:"The most versatile bait in Ontario. Nothing refuses a worm."},{id:"worm",name:"Piece of worm under a float",kind:"Live bait",sizes:"Half-inch fragment",colours:"n/a",targets:["bluegill","pump","rock","perch","sucker"],hook:"Size 8\u201312 fine-wire hook \u2014 small enough for a panfish mouth",rig:"Small waggler float, one split shot",float:"Yes \u2014 this is the classic float application",how:"Set shallow first, about two feet, and go deeper until you find them. Recast every few minutes to keep the bait moving.",when:"The best way to get anyone catching their first fish"},{id:"waxworm",name:"Wax worm",kind:"Live bait",sizes:"One or two on the hook",colours:"n/a",targets:["bluegill","pump","perch"],hook:"Size 10\u201312 fine wire, or tipped on a micro jig",rig:"Under a small float or on a micro jig",float:"Yes",how:"Tip a small jig and give it the tiniest lift-and-drop. Panfish inhale it.",when:"Cold water and hard-fished ponds, and through the ice"},{id:"microjig",name:"Micro jig",kind:"Soft plastic",sizes:"1/32\u20131/16 oz, 1\u20132 in body",colours:"Pink-white, chartreuse, black",targets:["crappie","bluegill","perch","wbass"],hook:"Integrated size 6\u20138 jig hook",rig:"Alone, or suspended under a small float",float:"Often \u2014 a float keeps it in the strike zone at a fixed depth",how:"Barely move it. A slow steady draw with tiny shakes is all that is needed. Set the float so the jig sits above the school.",when:"Spring crappie in the ponds, and panfish year-round"},{id:"corn",name:"Sweetcorn",kind:"Bait",sizes:"3\u20136 grains",colours:"n/a",targets:["carp"],hook:"Size 6\u20138 wide-gape, or a hair rig with the corn on a short hair below the hook",rig:"Running lead of 1\u20132 oz above a swivel, 12 in hooklength",float:"No \u2014 fish it hard on the bottom",how:"Scatter two handfuls of loose corn into a swim, then fish two or three grains on the hook in the middle of it. Give it thirty minutes before you move.",when:"The London carp bait. Cheap, effective, and available anywhere."},{id:"bread",name:"Bread",kind:"Bait",sizes:"Flake or a torn crust",colours:"n/a",targets:["carp"],hook:"Size 6 wide-gape, bread pinched onto the shank",rig:"Free-lined on the surface, or bottom-fished with a light lead",float:"Floating crust is its own float",how:"Throw a few torn pieces of crust in and watch. When carp start taking them confidently, put one on a hook and drift it in among them.",when:"Warm summer afternoons when carp are cruising the surface"},{id:"liver",name:"Chicken liver",kind:"Bait",sizes:"Thumb-sized piece",colours:"n/a",targets:["cat"],hook:"Size 2\u20132/0 wide-gape, or a treble to hold the soft bait on",rig:"Sliding sinker rig; use bait thread or a mesh to stop it flying off the cast",float:"No",how:"Cast gently, not hard. Let the scent trail develop for fifteen or twenty minutes before recasting.",when:"After dark for channel cats at Greenway and the east-end parks"},{id:"cutbait",name:"Cut bait",kind:"Bait",sizes:"1\u20132 in chunk of oily fish",colours:"n/a",targets:["cat"],hook:"Size 1/0\u20133/0 circle hook \u2014 the fish hooks itself, no strike needed",rig:"Sliding sinker on the bottom",float:"No",how:"With a circle hook, do not strike. When the rod loads up, simply lift and start reeling.",when:"Big channel cats, warm nights, coloured water"},{id:"crayfish",name:"Live or soft-plastic crayfish",kind:"Bait",sizes:"2\u20133 in",colours:"Brown, orange, olive",targets:["smb","rock"],hook:"Size 2\u20131/0 through the tail so it swims backwards naturally",rig:"One or two split shot, drifted through a riffle",float:"No",how:"Let it tumble naturally through the current with just enough weight to keep contact. This is the Thames smallmouth's main food.",when:"Any smallmouth situation on the river"}],gc=[{art:"finewire",size:"10\u201312",type:"Fine-wire baitholder",use:"Worm fragments, wax worms",sp:"Bluegill, pumpkinseed"},{art:"baitholder",size:"8",type:"Baitholder",use:"Half a worm under a float",sp:"Rock bass, perch, small panfish"},{art:"widegape",size:"6",type:"Wide-gape or hair rig",use:"Corn, bread",sp:"Carp"},{art:"baitholderworm",size:"4\u20136",type:"Baitholder",use:"Whole nightcrawler, minnow",sp:"Catfish, perch, sucker, drum"},{art:"octopus",size:"1\u20131/0",type:"Octopus / wacky",use:"Wacky-rigged stick worm",sp:"Largemouth, smallmouth"},{art:"tubehead",size:"1/0",type:"Tube jig head (internal)",use:"Tube baits",sp:"Smallmouth"},{art:"jighead",size:"2\u20131/0",type:"Round jig head",use:"Grubs, jig and minnow",sp:"Walleye, smallmouth, drum"},{art:"offset",size:"3/0\u20134/0",type:"Offset worm hook",use:"Texas-rigged plastics",sp:"Largemouth in cover"},{art:"wiretrace",size:"1/0\u20132/0",type:"Single, on a wire trace",use:"Live shiner or sucker",sp:"Northern pike"},{art:"circle",size:"1/0\u20133/0",type:"Circle hook",use:"Cut bait on the bottom",sp:"Channel catfish"},{art:"treble",size:"6\u201310",type:"Treble (factory)",use:"Cranks, jerkbaits, spoons",sp:"All predators \u2014 crush barbs to release cleanly"}],Eb=[{rig:"float",when:"Use a float",why:"You need the bait at a set depth above weed, snags or a suspended school \u2014 panfish, crappie, perch, live-baiting pike."},{rig:"slipfloat",when:"Use a slip float",why:"You need to fish deeper than your rod is long. The float slides down to the bait for casting and stops at your bead on the way back up."},{rig:"running",when:"Fish the bottom instead",why:"Your target feeds on the bottom and you want the bait still \u2014 carp, catfish, drum, sucker. A running lead lets the fish move without feeling resistance."},{rig:"weightless",when:"Fish weightless",why:"Clear, calm, pressured water where a slow natural fall is the whole trigger \u2014 wacky worms for pond largemouth."},{rig:"splitshot",when:"Add split shot",why:"You need a live bait to get down through current without deadening it. Two small shot beat one big one."},{rig:"swivel",when:"Add a barrel swivel",why:"You are throwing anything that spins \u2014 inline spinners and spoons \u2014 and want to avoid a twisted mess of line."},{rig:"leader",when:"Add a wire or heavy fluoro leader",why:"Pike are possible. Their teeth cut through mainline. This is not optional at Fanshawe, Westminster or Dorchester."}],Kv=[{region:"london-on",id:"springbank",name:"Springbank Park",area:"West end",water:"Thames \u2014 main branch",addr:"1085 Commissioners Rd W",ll:[42.9584,-81.3222],blurb:"The longest continuous walkable shoreline in the city, roughly 30 km of trail along the river. With the dam gone this stretch now runs shallower and faster than it did for a century.",depth:[0,1,2,3.5,5,6.5,7,6,4,2.5,1,0],hot:[{i:3,n:"Gravel shelf \u2014 smallmouth at first light"},{i:6,n:"Main channel hole \u2014 carp, cats, walleye"},{i:9,n:"Inside slack \u2014 panfish and cruising carp"}],density:{smb:4,carp:5,cat:3,wall:2,pike:2,rock:4,drum:3,sucker:3,trout:1,pump:3,wbass:3},access:{parking:5,walk:5,footing:4,amenities:5,cost:5},accessNote:"Paved trail to the water at multiple points, large free lots at Springbank Gate and Storybook, clean washrooms, LTC service. The most accessible fishing in London.",bank:"Mixed \u2014 mown grass, some rip-rap and gravel bar",hazards:"Trail closures continue around the dam site while restoration finishes. Check london.ca before parking there.",best:[4,5,6,8,9,10],tip:"The lower reaches below the old dam are the productive part. Walk past the crowds at Storybook."},{region:"london-on",id:"greenway",name:"Greenway Park",area:"West-central",water:"Thames \u2014 main branch",addr:"Terry Fox Pkwy",ll:[42.9764,-81.2733],blurb:"Deeper, slower water with easy bank access and a boat launch. The classic London spot for sitting behind two rods on the bottom.",depth:[0,1.5,3,5,7,8.5,9,8,6,3.5,1.5,0],hot:[{i:4,n:"Drop-off \u2014 cast to the lip, not over it"},{i:6,n:"Deep hole \u2014 big cats after dark"},{i:2,n:"Margin \u2014 carp graze right against the bank"}],density:{carp:5,cat:5,pike:3,smb:2,wall:2,drum:3,wbass:3,rock:3},access:{parking:5,walk:5,footing:4,amenities:4,cost:5},accessNote:"Free lot, level ground, boat access point. Short carry from car to water.",bank:"Grass down to a soft silt margin",hazards:"Soft mud at the waterline after rain.",best:[5,6,7,8,9],tip:"Twelve-pound-plus channel cats have come out of here. Fish it after dark with liver on a sliding lead."},{region:"london-on",id:"forks",name:"Harris Park & the Forks",area:"Downtown",water:"Thames \u2014 north and south branches meet",addr:"531 Ridout St N",ll:[42.9853,-81.2567],blurb:"Where the two branches join, under the fountain. Pavement to water's edge and bus routes at the door \u2014 the easiest fishing in the city, and the carp capital of London.",depth:[0,2,4,5.5,6,6.5,6,5,3.5,2,1,0],hot:[{i:4,n:"Confluence seam \u2014 everything funnels through it"},{i:8,n:"Slack inside \u2014 carp and drum"}],density:{carp:5,cat:4,drum:4,wbass:4,rock:3,smb:2,pike:1},access:{parking:4,walk:5,footing:5,amenities:2,cost:5},accessNote:"Paved right to the bank, flat, LTC routes adjacent. No washrooms \u2014 that is the one weakness.",bank:"Hard surface and engineered stone",hazards:"Busy park; watch your backcast for pedestrians and cyclists.",best:[5,6,7,8,9,11],tip:"There is a long-standing December run of white bass here. It is slow, silty water \u2014 do not expect much smallmouth."},{region:"london-on",id:"gibbons",name:"Gibbons Park",area:"North, by Western",water:"Thames \u2014 north branch",addr:"2A Grosvenor St",ll:[42.9984,-81.2607],blurb:"Riffle-and-pool water below the university. The best light-tackle smallmouth in the city core.",depth:[0,.5,1.5,2.5,3.5,4,3.5,2.5,1.5,.8,0],hot:[{i:2,n:"Head of the riffle \u2014 hold above it and cast up"},{i:5,n:"Pool \u2014 the deepest holding water"},{i:7,n:"Tail-out \u2014 smallmouth stage here at dusk"}],density:{smb:4,rock:5,sucker:4,carp:2,pump:3},access:{parking:4,walk:4,footing:3,amenities:4,cost:5},accessNote:"Free lot, paved trail, washrooms and playground. Short scramble down the bank to fishable water.",bank:"Gravel and cobble, wadeable in low summer flow",hazards:"Uneven bottom with unexpected holes. Wade only where you can see the bottom.",best:[5,6,7,8,9,10],tip:"Small jerkbaits and tubes. Fish upstream and let the bait come back to you naturally."},{region:"london-on",id:"kilally",name:"Kilally Meadows ESA",area:"Northeast",water:"Thames \u2014 north branch",addr:"Edgevalley Rd",ll:[43.0331,-81.232],blurb:"North branch below the Fanshawe dam, so the water runs colder and clearer than anywhere else in the city. This is where the trout exception matters.",depth:[0,1,2,3,4.5,5,4,3,2,1,0],hot:[{i:4,n:"Cold deep run \u2014 best trout chance in London"},{i:2,n:"Boulder seam \u2014 smallmouth"}],density:{smb:4,rock:4,trout:2,sucker:3,carp:1},access:{parking:3,walk:3,footing:3,amenities:1,cost:5},accessNote:"Trailhead parking, then a walk in along the Thames Valley Parkway. No washrooms.",bank:"Natural, wooded, some steep sections",hazards:"ESA rules apply \u2014 stay on marked trails, no hunting, licence required.",best:[4,5,6,9,10],tip:"The North Thames main branch in Middlesex County is open all year for brown and rainbow trout at S-5 / C-2. Read the exception carefully."},{region:"london-on",id:"meadowlily",name:"Meadowlily Woods ESA",area:"Southeast",water:"Thames \u2014 main branch",addr:"Meadowlily Rd S",ll:[42.9717,-81.1869],blurb:"The quiet one. Wooded banks, undercut holes and gravel bars, with far fewer people than the downtown parks.",depth:[0,1.5,3,4.5,6,6.5,5.5,4,2,1,0],hot:[{i:1,n:"Undercut bank \u2014 smallmouth sit tight underneath"},{i:5,n:"Deep hole \u2014 catfish after dark"},{i:8,n:"Gravel bar tail-out"}],density:{smb:4,cat:4,rock:4,carp:3,sucker:3,drum:2},access:{parking:3,walk:2,footing:2,amenities:1,cost:5},accessNote:"Free street parking, then a real hike in on natural trail with roots and elevation. No washrooms, no paved surface.",bank:"Natural, steep in places, tree-lined",hazards:"Steep descents to the water and slippery clay after rain. Not suitable for limited mobility.",best:[5,6,7,8,9,10],tip:"Worth the walk if you want to fish without an audience. Undercut banks are the spot."},{region:"london-on",id:"vauxhall",name:"Vauxhall Park",area:"East end",water:"Thames \u2014 main branch",addr:"54 Price St",ll:[42.9738,-81.2082],blurb:"The east-end access locals have fished for decades. Unglamorous and consistently productive.",depth:[0,1.5,3,4.5,5.5,6,5,3.5,2,1,0],hot:[{i:4,n:"Channel \u2014 carp and cats"},{i:2,n:"Shallow gravel \u2014 smallmouth at dusk"}],density:{carp:4,cat:4,smb:3,rock:3,drum:2},access:{parking:4,walk:4,footing:3,amenities:2,cost:5},accessNote:"Street and lot parking, short flat walk. Minimal facilities.",bank:"Grass and gravel",hazards:"Nothing unusual \u2014 standard river caution.",best:[5,6,7,8,9],tip:"Between the rail trestle and the Horton bridge there is deeper holding water worth finding."},{region:"london-on",id:"thamespark",name:"Thames Park",area:"Central south",water:"Thames \u2014 main branch",addr:"15 Ridout St S",ll:[42.9756,-81.2534],blurb:"Central, easy, and overlooked. Good bottom-fishing water with a paved trail and full park facilities.",depth:[0,2,3.5,5,6,6.5,5.5,4,2.5,1,0],hot:[{i:5,n:"Main channel \u2014 carp and cats"},{i:8,n:"Inside bend slack"}],density:{carp:4,cat:3,smb:2,drum:2,rock:3},access:{parking:5,walk:5,footing:4,amenities:4,cost:5},accessNote:"Large lot, paved paths, pool and playground on site. Very family-friendly.",bank:"Mown grass with a gentle slope",hazards:"Busy in summer.",best:[5,6,7,8,9],tip:"A good place to bring someone who has never fished. Facilities cover the boredom problem."},{region:"london-on",id:"westminster",name:"Westminster Ponds / Pond Mills",area:"South",water:"Still water \u2014 five connected ponds",addr:"696 Wellington Rd",ll:[42.9477,-81.2269],blurb:"Five or six connected ponds minutes from the core, all lily-pad edges and weed lines. The best largemouth water inside the city and the reason to own a frog.",depth:[0,2,4,7,11,15,16,14,9,5,2,0],hot:[{i:2,n:"Pad edge \u2014 largemouth ambush lane"},{i:4,n:"Weed line drop \u2014 pike patrol this"},{i:6,n:"Basin \u2014 crappie suspend here in spring"}],density:{lmb:5,bluegill:5,pump:4,crappie:4,pike:3},access:{parking:4,walk:3,footing:1,amenities:2,cost:5},accessNote:"Parking off Wellington and Commissioners, then boardwalk and natural trail. Getting to fishable shoreline is the hard part.",bank:"Boggy, soft, undercut at the pad fringe",hazards:"Serious: the lily-pad fringe is boggy and full of holes. Anglers report going from one metre to two metres of water in a single step. Do not wade here.",best:[5,6,7,8,9],tip:"A float tube or kickboat unlocks this place completely. From shore, fish the accessible pad edges and be patient."},{region:"london-on",id:"fanshawe",name:"Fanshawe Conservation Area",area:"Northeast",water:"Reservoir \u2014 228 ha",addr:"1424 Clarke Rd",ll:[43.0355,-81.1884],blurb:"London's only real lake fishery, and the only local water that holds a proper walleye and perch population. Entry fee applies.",depth:[0,3,6,10,15,22,28,24,16,9,4,0],hot:[{i:6,n:"Old river channel \u2014 deepest, coolest water in summer"},{i:2,n:"Weedy bay \u2014 pike and largemouth"},{i:9,n:"Flats \u2014 autumn perch schools"},{i:4,n:"Near the dam and canoe launch \u2014 shore walleye"}],density:{wall:4,pike:4,perch:5,smb:3,lmb:3,crappie:2,bluegill:3},access:{parking:4,walk:4,footing:4,amenities:5,cost:2},accessNote:"Full facilities, camping, washrooms, TackleShare rod-and-reel loans through OFAH. But there is an entry fee, and outboards must be under 10 hp.",bank:"Managed shoreline, docks, launch",hazards:"Open water and wind. Wear a PFD if you are afloat.",best:[4,5,6,9,10,1],tip:"It is not easy fishing. Targeting offshore, unseen structure \u2014 especially the old river channel through the middle \u2014 pays off far more than fishing the visible bank."},{region:"london-on",id:"komoka",name:"Komoka Provincial Park",area:"15 min west",water:"Thames \u2014 main branch, downstream",addr:"503 Gideon Dr",ll:[42.953,-81.384],blurb:"Cleaner, faster Thames water west of the city. Consistently the best local shot at walleye and better-average smallmouth.",depth:[0,1,3,5,7,8,7,5,3,1.5,0],hot:[{i:3,n:"Current seam off the point"},{i:5,n:"Deep run \u2014 walleye at dusk"},{i:8,n:"Gravel tail-out \u2014 smallmouth"}],density:{smb:5,wall:4,rock:4,drum:3,carp:3,sucker:3,trout:2},access:{parking:3,walk:3,footing:3,amenities:2,cost:3},accessNote:"Paid parking, 2-hour or 4-hour passes. The payment machine is unreliable \u2014 bring coins and a backup plan. Then a walk to the river.",bank:"Natural, gravel and clay, some steep descents",hazards:"$95 fines for dogs off leash. Steep riverbank in places.",best:[4,5,6,9,10,11],tip:"The Delaware and Kilworth bridge stretches nearby are long-standing local walleye spots, best in cold water before and after summer."},{region:"london-on",id:"dorchester",name:"Dorchester Mill Pond",area:"20 min east",water:"Still water \u2014 mill pond",addr:"Mill Pond, Thames Centre",ll:[42.9872,-81.0663],blurb:"A textbook largemouth and pike pond with a decent crappie population, and a proper ecotrail around it. Electric motors only.",depth:[0,2,4,6,9,11,12,10,7,4,2,0],hot:[{i:2,n:"Concrete blocks by the entrance \u2014 easy shore access"},{i:4,n:"Weed line \u2014 pike and largemouth"},{i:6,n:"Basin \u2014 spring crappie"}],density:{lmb:5,pike:4,crappie:4,bluegill:4,pump:3},access:{parking:5,walk:4,footing:4,amenities:3,cost:5},accessNote:"Free parking on-street and in two lots. Portable toilet on site, ice cream shop at the trail entrance. Concrete blocks near the entrance make solid casting platforms.",bank:"Concrete blocks, then natural shoreline and boardwalk",hazards:"Discarded line and tackle along the popular stretches \u2014 take a bag.",best:[4,5,6,7,8,9],tip:"Worth the drive for the largemouth. Kayak-friendly with an easy launch just right of the entrance."}],a0=[{id:"before",title:"Before you decide anything",lead:"Everything here assumes the fish might go back, because until you have looked at the season and the limit, it might.",see:[["gear","net"],["gear","unhooking-mat"],["tips","t7"]],steps:["Wet your hands, or wear wet gloves. Dry hands take off the slime coat, and that coat is what keeps a fish free of infection.","Support it horizontally, one hand under the belly. Hanging a heavy fish by the jaw alone damages the jaw and the organs behind it.","Leave it in the water while you unhook. Air is the clock: under thirty seconds and it swims off, a minute or two and it floats.","Fingers out of the gills and away from the eyes. Gills bleed and do not stop."]},{id:"unhook",title:"Unhooking",see:[["gear","pliers"],["gear","hook-out"],["hooks","circle"],["tips","t9"]],steps:["Long-nose pliers or a hook-out, in your pocket, not in the car.","Pinch the barbs down. You lose far fewer fish than people claim, and the hook comes out in one movement instead of three.","Deeply hooked: cut the line at the corner of the mouth and leave the hook in. A fish sheds a hook. It does not recover from someone digging for one."]},{id:"release",title:"Putting it back",see:[["gear","net"],["tips","t10"],["species","smb"]],steps:["Hold it upright, facing into the current, until it kicks out of your hand.","In still water, move it forward only. Rocking a fish back and forth pushes water the wrong way through the gills.","If it rolls, keep hold of it. A fish that drifts off belly-up is usually a fish that died.","Warm water is the hard one. Much above 21 degrees a played-out smallmouth or walleye can swim off strongly and die hours later. Fish first light, land them fast, or go somewhere deeper."]},{id:"keep",title:"Deciding to keep one",see:[["regs","regs"],["gear","measure"],["tips","t11"]],steps:["Season and limit first, for this zone and this waterbody. Waterbody exceptions override the zone rules - check the Rules tab.","Then the eating advice. The Guide to Eating Ontario Fish gives meal limits by waterbody, species and size, and it matters on a river running through a city.","Keep what you will eat this week. A freezer of last year\u2019s fillets is a fish that died for nothing."]},{id:"dispatch",title:"Killing it cleanly",grave:!0,lead:"The part people are squeamish about and therefore do badly. Decide before you land it, and be quick.",see:[["gear","knife"],["gear","cooler"]],steps:["A firm blow to the top of the head, just behind the eyes. One, meant.","Bleed it straight away: cut the gill arches on one side and hold it in cold water for five minutes.","A bled fish keeps better and tastes cleaner. A fish left to suffocate in a bucket takes a long time and is worse on the plate."]},{id:"chill",title:"Getting it cold",see:[["gear","cooler"],["handling","law"]],steps:["Ice and water together - a slurry - chills far faster than ice alone.","A stringer in warm water is a fish going soft while you carry on fishing."]},{id:"gut",title:"Gutting",see:[["gear","knife"],["handling","fillet"]],steps:["Slit from the vent forward to the gills, shallow, so you do not open the intestine.","Take the gills out with the guts. They spoil first.","Scrape the dark blood line along the spine with a thumbnail or a spoon. That line is what people mean when they say a fish tasted muddy.","Rinse in clean cold water. If the river is questionable, rinse at home instead."]},{id:"fillet",title:"Filleting",see:[["gear","knife"],["species","pike"],["handling","law"]],steps:["Cut behind the pectoral fin down to the spine, turn the blade toward the tail, and run along the spine in one pass.","Lift the fillet and take the ribcage out as a thin sheet.","Skin last. Skin down, blade angled slightly into the skin, and pull the skin while the knife stays still.","Pike carry a row of Y-bones above the lateral line. Either learn the cut or accept them and make burgers."]},{id:"law",title:"What the rules say about cleaning and carrying",law:!0,lead:"Checked against the Ontario fishing regulations summary. These are the ones people get charged over.",see:[["regs","regs"],["gear","measure"],["gear","cooler"]],steps:["Leave a large patch of skin on every fillet. It is how the species gets identified.","Fish from waters with a size limit must stay readily measurable while you transport them - unless you are cooking them there and then, or storing them at your overnight accommodation.","Package so they can be counted and identified: fillets flat in a clear bag, each fish separate, not frozen into a clump.","Transporting live fish overland needs a permit. Sport fish go home dead and on ice, not swimming in a livewell.","Possession limits add up across zones, not per zone."]},{id:"tidy",title:"Before you leave",see:[["tips","t19"],["gear","tackle-box"]],steps:["Guts do not go back in the water at the launch, and they do not go in the car park. Bag them, or bury them well back from the bank.","Take your line home. Discarded monofilament is the thing that kills birds at every popular spot."]}],s0=[["cast","Rods and reels"],["line","Line and leader"],["hold","Landing and holding"],["tools","Tools"],["carry","Carrying it"],["safe","Safety"]],Fb=[{id:"spin-rod",name:"Spinning rod",group:"cast",what:"The general-purpose rod. A reel hangs underneath and the line comes off a fixed spool, which is why it handles light baits without tangling.",pick:"Seven feet, medium power, fast action, rated roughly 1/4 to 3/4 oz. That one rod covers bass, walleye, pike, panfish and most bait fishing on this river.",note:"Length buys casting distance and line control; power is how much weight it will throw without folding. Getting a rod too heavy is the common mistake - it casts light baits badly and you feel nothing.",see:[["tactics","search-cranking"],["tactics","jig-hopping"],["hooks","jighead"]]},{id:"spin-reel",name:"Spinning reel",group:"cast",what:"Holds the line, gives it out under tension when a fish pulls, and winds it back. The drag is the part that matters.",pick:"A 2500 size for everything here; 3000 or 4000 if you are chasing pike or catfish. The number is roughly the spool size - bigger holds more and heavier line.",note:"Set the drag by pulling line off by hand until it slips with firm effort, not by guessing at the knob. A drag set too tight is the single most common reason a good fish comes off.",see:[["gear","mono"],["tactics","night-cats"]]},{id:"baitcaster",name:"Baitcasting reel",group:"cast",what:"The spool sits in line with the rod and turns as the line leaves. More accurate and stronger for heavy lures, and it will overrun and tangle until you learn it.",pick:"Worth it if you throw big lures for pike or musky. Not worth it as a first reel, and nothing you can do here needs one.",note:"Thumb the spool as the lure lands. That is the whole skill and it takes an afternoon.",see:[["tactics","pike-casting"]]},{id:"fly-rod",name:"Fly rod and reel",group:"cast",what:"You cast the weight of the line rather than the weight of the lure, which is what lets a fly weighing nothing get anywhere.",pick:"A 9 foot 5 weight for trout and panfish. An 8 weight if pike are the point. The reel is mostly a line holder until a fish runs.",note:"Rod weight, line weight and leader all have to match - a 5 weight line on an 8 weight rod will not load it and will not cast.",see:[["tactics","fly-nymph"],["tactics","fly-still-panfish"],["tactics","fly-streamer-pike"]]},{id:"mono",name:"Monofilament line",group:"line",what:"One strand of nylon. Stretches, floats, cheap, forgiving, and the default for bait fishing.",pick:"6 lb for panfish and river smallmouth, 8 to 10 lb general, 12 to 15 lb for catfish and carp. Replace it every season - it goes brittle in sunlight.",note:"The stretch is a feature when a fish lunges at close range and a problem when you need to set a hook at forty yards.",see:[["knots","clinch"],["knots","uni"]]},{id:"braid",name:"Braided line",group:"line",what:"Woven fibres. No stretch, far thinner than mono of the same strength, and it does not forgive a bad knot.",pick:"20 to 30 lb braid on a 2500 reel behind a fluorocarbon leader. Use it where you need to feel the bottom or drive a hook a long way off.",note:"It is visible in clear water and it cuts into itself if you spool it loose. Always fish a leader, and always use a knot rated for braid.",see:[["knots","palomar"],["knots","surgeon"],["tactics","jig-hopping"]]},{id:"fluoro",name:"Fluorocarbon leader",group:"line",what:"A length of near-invisible, abrasion-resistant line tied between your main line and the hook.",pick:"A metre of 8 to 12 lb for most things here. Heavier if you are fishing rock or zebra mussels, which cut everything.",note:"This is the cheapest improvement available in low clear summer water. It sinks, which also helps a bait get down.",see:[["knots","surgeon"],["tactics","finesse-slow"]]},{id:"wire-trace",name:"Wire trace",group:"line",what:"A short length of wire, or very heavy fluorocarbon, between the line and the lure.",pick:"Non-negotiable for pike and musky. Thirty centimetres is enough.",note:"This is a fish-welfare item as much as a tackle one - a pike that bites through nylon swims off with the lure in it.",see:[["species","pike"],["tactics","pike-casting"],["handling","unhook"]]},{id:"net",name:"Landing net",group:"hold",what:"Gets the fish out of the water without you lifting it by the line or dragging it up the bank.",pick:"Rubber or rubber-coated mesh, and as big a hoop as you will actually carry. Knotted nylon mesh strips slime and scales.",note:"Wet the net before the fish goes in it, and leave the fish in the net in the water while you get the pliers.",see:[["handling","before"],["handling","release"]]},{id:"unhooking-mat",name:"Unhooking mat",group:"hold",what:"A padded mat to lay a fish on if it has to come out of the water at all.",pick:"Only really needed for carp and big catfish. Wet it first.",note:"Gravel, concrete and mown grass all take the slime coat off. If there is no mat, the fish stays in the net in the water.",see:[["species","carp"],["handling","before"]]},{id:"measure",name:"Tape or measuring board",group:"hold",what:"How you record a length honestly and how you prove a fish is legal.",pick:"A soft tape in the bag costs nothing. A board is faster and kinder if you are measuring often.",note:"Ontario size limits are measured as total length, and a fish from water with a size limit has to stay measurable until you get home - see the handling rules.",see:[["handling","law"],["regs","regs"]]},{id:"pliers",name:"Long-nose pliers",group:"tools",what:"For getting a hook out of a fish, and out of you.",pick:"Six-inch needle-nose with a side cutter. The cutter is what lets you cut a hook shank rather than dig.",note:"In your pocket, not in the car. This is the tool that decides whether a deeply hooked fish swims away.",see:[["handling","unhook"],["gear","wire-trace"]]},{id:"hook-out",name:"Hook-out or forceps",group:"tools",what:"A narrow clamp that reaches further back than fingers and locks onto the hook.",pick:"Any surgical forceps. Cheap, and better than pliers for small hooks in small mouths.",note:"Lock it on the bend of the hook, not the shank, and back the hook out the way it went in.",see:[["handling","unhook"],["hooks","baitholder"]]},{id:"knife",name:"Filleting knife",group:"tools",what:"A thin flexible blade for taking fillets off the bone.",pick:"Six to seven inches, flexible, and sharp. A stiff knife follows its own line instead of the ribcage.",note:"Sharpen it before the trip. A blunt filleting knife wastes fish and cuts you, in that order.",see:[["handling","fillet"],["handling","gut"]]},{id:"line-clippers",name:"Clippers",group:"tools",what:"For trimming a knot tag cleanly.",pick:"Nail clippers on a lanyard. Braid needs a proper cutter or scissors; clippers crush it rather than cut it.",note:"Trim to about 2 mm. Leaving a long tag catches weed; cutting flush can let the knot slip.",see:[["knots","uni"],["gear","braid"]]},{id:"headlamp",name:"Headlamp",group:"tools",what:"Hands-free light for rigging in the dark and for walking back.",pick:"Anything with a red mode. Red keeps your night vision and does not empty the shallows.",note:"White light on the water at night will move fish off a spot for a while. Rig facing away from the river.",see:[["tactics","night-cats"],["tactics","topwater-window"]]},{id:"tackle-box",name:"Tackle box or bag",group:"carry",what:"Where the small expensive things live so you can find them on the bank.",pick:"A shoulder bag with removable trays beats a hard box if you walk to your spots, which on this river you do.",note:"Two trays - one for terminal tackle, one for lures - and everything else at home. A full box on your shoulder is why people stop walking past the car park.",see:[["hooks","baitholder"],["hooks","jighead"]]},{id:"cooler",name:"Cooler and ice",group:"carry",what:"For fish you are keeping, and the only honest way to bring one home.",pick:"Small hard cooler, ice and water together as a slurry. A stringer in warm water is a fish going soft.",note:"Ontario requires sport fish to travel dead and on ice rather than alive in water - see the handling rules.",see:[["handling","chill"],["handling","law"]]},{id:"pfd",name:"Life jacket",group:"safe",what:"The thing that matters most and gets talked about least.",pick:"An inflatable belt or vest if you find a bulky one puts you off wearing it. The one you wear beats the one you own.",note:"Wading a river after rain is the highest-risk thing in this app. Cold water takes your breath before it takes your strength.",see:[["tips","t15"],["handling","release"]]},{id:"grip-boots",name:"Boots with grip",group:"safe",what:"Footing on wet rock, clay bank and algae.",pick:"Felt is banned in some jurisdictions for spreading invasives; rubber lugs or studs are the safe default. Check before you travel.",note:"Algae-covered bedrock is the most slippery surface on this river and it looks like clean rock.",see:[["tips","t15"]]},{id:"first-aid",name:"Small first-aid kit",group:"safe",what:"Mostly for hooks in fingers and cuts from gill plates and teeth.",pick:"Plasters, antiseptic, tape, and the side cutter on your pliers. That covers almost everything that happens.",note:"A hook past the barb comes out by pushing it through and cutting the barb off, not by pulling it back. If it is near an eye or an artery, stop and go to a hospital.",see:[["gear","pliers"],["handling","unhook"]]}],l0={rating:{term:"The conditions rating",short:"A score out of 100 for how promising right now looks. It is built from the things this app can actually know: time of day against sunrise and sunset, the moon phase and the solunar windows, and the weather and river readings if you have fetched them.",long:"It is a rule-of-thumb, not a forecast. A high score on a day the fish ignore you is the score being wrong about that day, not you fishing it badly. Expand the card to see which factors moved it and by how much - that breakdown is the useful part, because it tells you whether the number is resting on real weather or only on the clock."},solunar:{term:"Solunar period",short:"A window when the sun and moon are lined up in a way that has long been associated with fish feeding. Major periods are when the moon is overhead or underfoot; minor periods are moonrise and moonset.",long:"It is folk knowledge with mixed evidence behind it, and it is in here because anglers use it and because it costs nothing to calculate offline. Treat it as a tiebreaker for choosing between two hours, not as a reason to go or stay home. The moon phase matters more in clear water than in stained water."},windows:{term:"Feeding windows",short:"The times today that fall inside a solunar period. Major windows run about two hours, minor ones about an hour.",long:"They are computed on your device from the date and your rough position, so they work with no signal. If two of them land on dawn or dusk, that is the overlap worth planning around - low light and a solunar period together is a better bet than either alone."},access:{term:"Access rating",short:"One percentage for how easy a place is to get to and fish: parking, the walk to the water, footing on the bank, whether there are facilities, and whether it costs anything.",long:"Green is roughly eighty and up - park and cast without a scramble. Amber is a walk or awkward footing. Red means work. It says nothing about how many fish are there; a hard-to-reach spot is often better fishing, which is part of why the two numbers are kept separate."},unchecked:{term:"Unchecked",short:"This place was put together from maps and public information rather than from standing on the bank. The water and the species are right for the area; parking, the walk in and the footing are not rated because nobody has confirmed them.",long:"It has no access rating on purpose. Generating one from a map would invent exactly the detail that leaves somebody at a locked gate or on a bank they cannot stand on. Fill the access in yourself once you have been and the badge clears itself."},region:{term:"Regions, locations and pins",short:"A REGION is a downloadable map covering about 50 km - London, Windsor, Sarnia, Goderich, Grand Bend or the GTA. A LOCATION is a fishing spot inside one, like Springbank Park. A PIN is something you marked yourself: a snag, a hazard, a good spot.",long:"The region decides which map draws offline and which locations the home list shows, so switching region changes both. Locations ship with the app and you can add your own. Pins are always yours and always show, whatever region you are in, because you put them where you fish. Only the region has to be downloaded; locations and pins are already on the device."},density:{term:"Fish density",short:"How likely each species is at a place, on a five-step scale from occasional to abundant.",long:"For the London locations these come from local knowledge and the provincial fishery data. For researched locations they are set from what the water is known for rather than from a survey, which is why those places are marked Unchecked. It describes the water, not today."},gauge:{term:"River gauge",short:"A real Environment Canada monitoring station near a spot, giving live water level and flow. The app picks the nearest one within 50 km and you can change it.",long:"Level tells you whether the bank is fishable and safe; flow tells you how hard the water is pushing. After rain, both spike and then fall over a day or two - the falling limb is usually the good fishing. Readings are fetched when you tap, never in the background, so the app still opens with no signal."},season:{term:"Open and closed season",short:"The dates you may fish for a species in this zone. Closed means you may not target them at all, not merely that you must release them.",long:"The app shows Zone 16 dates, and waterbody exceptions override them - the Thames main branch in Middlesex is open all year for trout and salmon, for instance. The Ontario regulations summary is updated annually and is the authority; this app is a convenience."},licence:{term:"Licence and Outdoors Card",short:"Anglers 18 to 64 need a fishing licence. The Outdoors Card is a separate plastic card, valid three years, that your licence is attached to - it is not itself a licence.",long:"Sport and conservation licences come in one-year and three-year terms; conservation is cheaper and has lower catch limits. The one-day sport licence is the only one that needs no card. Record the date you bought yours and the app will warn you before it runs out."},hookrate:{term:"Hook rate",short:"A modelled estimate of how a fish looks right now, out of 100. It combines how much of that species the water holds, whether the season is open, the conditions rating, and whether today falls in the fish\u2019s good months.",long:"It is NOT a probability - it does not say four in five anglers catch one. It is for comparing options: this fish against that fish, here against twenty minutes away, today against Saturday. A closed season reads zero rather than a low number, a species that is not in the water reads zero, and the top is capped below ninety, because a model built from four coarse inputs has no business claiming near-certainty."},photos:{term:"One photo per record",short:"Each catch, spot or other record keeps a single photo. Adding a second replaces the first.",long:"The replacement is immediate and there is no undo, which is a deliberate trade for a log that stays small enough to work offline and back up over a phone connection. Export a backup before a big clear-out if a photo matters."},offline:{term:"Working offline",short:"Everything except live weather and river readings works with no signal: the map for any region you have downloaded, the whole encyclopedia, and your log.",long:"Nothing is fetched in the background - readings update only when you tap, so the app always opens instantly and never burns data at the side of a road. Your log lives on the device; if you want it somewhere else, connect Drive or Sheets, or export a backup."}},Yv={"london-on":{prov:"ON",label:"Zone 16",waters:"the Thames and inland southwestern Ontario"},"windsor-on":{prov:"ON",label:"Zone 19",waters:"the Detroit and St. Clair rivers and Lake Erie"},"sarnia-on":{prov:"ON",label:"Zone 19",waters:"the Detroit and St. Clair rivers and Lake Erie"},"goderich-on":{prov:"ON",label:"Zone 13",waters:"the main basin of Lake Huron"},"grand-bend-on":{prov:"ON",label:"Zone 13",waters:"the main basin of Lake Huron"},"gta-on":{prov:"ON",label:"Zone 20",waters:"Lake Ontario"},"langley-bc":{prov:"BC",label:"Region 2 \u2014 Lower Mainland",waters:"the lower Fraser, its tributaries, and the Lower Mainland lakes",tidalLine:"the CPR bridge at Mission"}},zl={ON:{name:"Ontario",authority:"the Ontario fishing regulations summary",licence:"One provincial licence, sport or conservation, covers everything in this app."},BC:{name:"British Columbia",authority:"the BC freshwater fishing regulations synopsis for Region 2, plus the DFO recreational notices for tidal Area 29",licence:"TWO different licences, and which one you need depends on where you stand. Tidal water needs a federal DFO Tidal Waters Sport Fishing Licence; non-tidal water needs a provincial freshwater licence. A freshwater licence is not valid in tidal water and the other way round."}},Vo="london-on",Zr=e=>{let t=Yv[e]||Yv[Vo];return{...t,known:e===Vo,province:zl[t.prov]||zl.ON}},Kr=[["parking","Parking"],["walk","Walk to water"],["footing","Bank footing"],["amenities","Washrooms & facilities"],["cost","Free to fish"]],zb=e=>Math.round(Kr.reduce((t,[n])=>t+((e||{})[n]||0),0)/Kr.length),yc=e=>!!e&&Kr.some(([t])=>e[t]!=null),d0=e=>Math.round(Kr.reduce((t,[n])=>t+((e||{})[n]||0),0)/(Kr.length*5)*100),Pb=[{id:"clinch",name:"Improved clinch",use:"Tying a hook, lure or swivel to monofilament or fluorocarbon",strength:"Around 95% of line strength",diff:"Start here",steps:["Pass 6 inches of line through the hook eye.","Twist the tag end around the standing line five times.","Bring the tag back through the small loop right above the hook eye.","Then pass it through the big loop you just created \u2014 this is the 'improved' part and it is what stops it slipping.","Wet the knot with saliva, pull the standing line slowly until the coils bed down neatly, and trim the tag to 2 mm."],fail:"If it slips, you skipped the second loop or you pulled it tight dry. Always wet it."},{id:"palomar",name:"Palomar",use:"Braided line to anything. The strongest simple knot there is.",strength:"Close to 100%",diff:"Start here",steps:["Double 6 inches of line and pass the loop through the hook eye.","Tie a loose overhand knot with the doubled line \u2014 do not tighten it.","Pass the loop over the entire hook or lure.","Wet it and pull both the standing line and the tag together until it seats.","Trim the tag."],fail:"Make sure the loop passes cleanly over the hook point and does not cross the knot. A crossed Palomar fails at half strength."},{id:"uni",name:"Uni knot",use:"One knot for everything \u2014 hooks, spool arbors, and joining two lines",strength:"Around 90%",diff:"Worth learning second",steps:["Pass the line through the eye and double it back alongside itself, forming a loop.","Wrap the tag end around both strands and through the loop, six times.","Wet it and pull the tag to close the coils into a barrel.","Slide the barrel down to the eye by pulling the standing line, and trim."],fail:"Fewer than five wraps in slippery fluorocarbon will slip. Use six or seven."},{id:"loop",name:"Non-slip loop knot",use:"Jerkbaits, jointed minnows and topwater \u2014 anything that needs free movement",strength:"Around 85\u201390%",diff:"Once you are comfortable",steps:["Tie a loose overhand knot in the line about 6 inches from the end, leaving it open.","Pass the tag through the hook eye and back through the overhand knot.","Wrap the tag around the standing line four or five times.","Bring the tag back through the overhand knot, entering from the same side it exited.","Wet, pull the standing line and the tag together, then set the loop size before final tightening."],fail:"A lure tied on tight swims worse. This is the difference between a jerkbait that catches and one that does not."},{id:"surgeon",name:"Double surgeon's",use:"Joining your mainline to a leader \u2014 braid to fluorocarbon",strength:"Around 90%, and it is fast",diff:"Once you are comfortable",steps:["Lay the two lines alongside each other with about 8 inches of overlap.","Treat the doubled section as one line and tie a simple overhand knot.","Pass the same ends through a second time \u2014 that is the double.","Wet thoroughly and pull all four ends apart at once, slowly.","Trim both tags flush."],fail:"Pulling only two of the four ends creates a lopsided knot that fails under load. Pull all four."},{id:"hair",name:"Hair rig (carp)",use:"Presenting corn or bread off the hook rather than on it",strength:"n/a \u2014 a rig, not a knot",diff:"Carp-specific",steps:["Tie a small loop in one end of a 10-inch hooklength.","Pass the other end through the back of the hook eye and lay it along the shank so the loop hangs 1 cm below the bend.","Whip the line down the shank seven or eight times, trapping it.","Pass the end back through the hook eye from front to back and pull tight.","Thread corn onto the hair with a baiting needle and hold it on with a small boilie stop."],fail:"The whole point is that the hook is exposed. If the bait covers the hook point, the rig will not hook fish."}],Ob=[{id:"t1",cat:"Reading water",title:"Fish the seam, not the fast or the slow",body:"Every riffle on the Thames has a visible line where fast water meets slow. Smallmouth and walleye sit on the slow side of that line and dart into the fast water to feed. Cast into the fast water and let your bait swing across the seam."},{id:"t2",cat:"Reading water",title:"Structure beats open water, every time",body:"A single boulder, a fallen tree, a bridge pier, a weed edge, a drop-off. If there is nothing for a fish to relate to, there is no fish. Cast to something, not at nothing."},{id:"t3",cat:"Reading water",title:"Deep holes hold fish through the middle of the day",body:"In summer, fish move shallow at dawn and dusk and drop back into the deepest available water when the sun is high. If you are fishing at noon, fish deep and slow or accept a hard day."},{id:"t4",cat:"Conditions",title:"Watch the river level, not just the weather",body:"UTRCA publishes Thames levels at thamesriver.on.ca. The recommended paddling flow is 15 cubic metres per second on the north and south branches and 20 on the main branch. Those numbers are also a reasonable proxy for whether the bank is fishable and safe."},{id:"t5",cat:"Conditions",title:"Colour after rain is an opportunity",body:"Stained water makes walleye feed all day instead of only at dusk, and lets you get closer to spooky smallmouth. Go bigger, brighter and noisier when the river colours up."},{id:"t6",cat:"Conditions",title:"Low clear summer water demands a lighter approach",body:"In August the Thames runs low and clear and the fish become genuinely spooky. Lengthen your leader, downsize the bait, stay off the skyline, and fish first and last light."},{id:"t7",cat:"Handling",title:"Keep the fish in the water",body:"Keep fish in the water as much as possible. Wet your hands or use wetted gloves before touching one, never touch the gills or eyes, and hold the fish horizontally supporting its belly rather than suspending it vertically."},{id:"t8",cat:"Handling",title:"Have the camera ready before you hook up",body:"Photograph fish in the water where you can, and have the camera set before the fish is landed rather than fumbling for it while the fish is out of the water."},{id:"t9",cat:"Handling",title:"Cut the line on a deeply hooked fish",body:"Remove hooks while the fish is still in the water where possible, using pliers. If it is deeply hooked, cut the line or the hook shank and leave the hook in place \u2014 that fish survives far better than one you dig around inside."},{id:"t10",cat:"Handling",title:"Release properly",body:"Lower the fish gently back into the water rather than dropping it. If it cannot swim away immediately, hold it upright in the current until it goes on its own."},{id:"t11",cat:"Rules",title:"Closed season means you cannot target them at all",body:"Casting to spawning smallmouth in May is a violation even if you release every fish. Targeting a species during its closed season is the offence, not keeping it."},{id:"t12",prov:"ON",cat:"Rules",title:"Do not move bait in or out of the zone",body:"FMZ 16 sits in the Southern Bait Management Zone. Live or dead baitfish and leeches may not be transported into or out of a Bait Management Zone. Preserved dead bait is exempt. Buy locally, use locally, and never dump a bait bucket."},{id:"t13",prov:"ON",cat:"Rules",title:"Know who needs a licence",body:"Anglers aged 18 to 64 need a licence. Those outside that range do not, but carry all the same rights and responsibilities. For 2026 an Ontario resident pays $26.57 for a 1-year sport licence or $15.07 conservation; the three-year terms are $79.71 sport and $45.21 conservation, which is the same price per year. Add $8.57 for the Outdoors Card, which is valid three years and is not itself a licence. The 1-day sport licence at $12.21 is the only one that does not need a card. Fees are before HST and hold until 31 December 2026."},{id:"t14",prov:"ON",cat:"Rules",title:"Warmouth may not be kept",body:"Warmouth is listed as endangered in Ontario and may not be caught or possessed under a recreational fishing licence. It looks like a rock bass with a bigger mouth \u2014 if in doubt, release immediately."},{id:"t15",cat:"Safety",title:"Wade only where you can see the bottom",body:"The Thames bottom is uneven and there may be holes or deeper areas close to you. If you cannot see the bottom, do not step there. The Westminster Ponds pad fringe is the worst offender in the region."},{id:"t16",prov:"ON",cat:"Safety",title:"The Thames is not drinking water",body:"Carry your own water. Also consult the Guide to Eating Ontario Sport Fish before keeping anything from an urban river running through a city of 400,000."},{id:"t17",prov:"ON",cat:"Gear",title:"One rod covers ninety percent of London",body:`A 6'6" to 7' medium spinning rod with a 2500-size reel, 10 lb braid and an 8 lb fluorocarbon leader handles smallmouth, walleye, pond largemouth and light carp work. Add a heavier bottom rod only when you get serious about carp and cats.`},{id:"t18",cat:"Gear",title:"Crush your barbs",body:"Barbless hooks come out of fish faster and cleanly, and out of your own hand faster too. The Fish & Paddle Guide recommends them for catch and release, and you lose far fewer fish than people claim."},{id:"t21",prov:"BC",cat:"Rules",title:"Two licences, and the line between them",body:"British Columbia sells a provincial freshwater licence and Fisheries and Oceans Canada sells a separate tidal waters licence, and neither is valid where the other is. On the lower Fraser the boundary is the CPR bridge at Mission: seaward of it is tidal, upstream of it is not. Derby Reach and the Glen Valley bars are tidal water. Both annual licences run 1 April to 31 March whenever you buy them."},{id:"t22",prov:"BC",cat:"Rules",title:"Check the adipose fin before you keep a salmon or a steelhead",body:"A clipped adipose fin - the small fleshy fin between the dorsal and the tail - means a hatchery fish. An intact one usually means a wild fish, and wild coho and wild steelhead in the Lower Mainland are frequently non-retention. Salmon openings here are set by in-season DFO notice rather than by a fixed calendar, so the notice for Area 29 on the day you go is the only thing that settles it."},{id:"t23",prov:"BC",cat:"Safety",title:"A gravel bar is not a beach",body:"Bar fishing the lower Fraser is the most dangerous shore fishing in this region. A bar that is walkable on one tide is cut off on the next, the channel behind it fills, the drop at the edge is abrupt, and the water is cold and silty enough that you will not see the bottom go. Know the tide and the river level, and do not fish a bar alone. Freshet from late May through July runs high, fast and full of debris."},{id:"t24",prov:"BC",cat:"Handling",title:"A sturgeon never leaves the water",body:"White sturgeon on the lower Fraser are mandatory catch and release, and the release is the regulated part: keep the fish in the river, support its weight, and never lift it clear or drag it up the bank. These are animals that can be older than you are and they do not recover from being handled like a salmon."},{id:"t19",cat:"Gear",title:"Carry a line bin",body:"Discarded monofilament is the single most visible fishing problem on London's banks, especially at Dorchester and the Forks. Bring a small bag out with you and leave with more line than you brought."},{id:"t20",cat:"Getting started",title:"Borrow before you buy",body:"The conservation areas partner with OFAH on TackleShare, which loans rod, reel and tackle at no charge \u2014 a library service for fishing gear. Use it before spending money."}],Ll={sky:["Clear","Part cloud","Overcast","Rain","Snow"],wind:["Calm","Light","Moderate","Strong"],clarity:["Gin clear","Slight stain","Stained","Muddy"],level:["Very low","Normal","High","Flood"],moon:["New","Waxing","Full","Waning"]};function Wb({children:e,onClose:t,bleed:n,asTab:r}){return r?o.default.createElement("div",{className:"tabfull"},e):o.default.createElement(Re,{onClose:t,bleed:n},e)}function Re({title:e,onClose:t,children:n,action:r,peek:i=!1,bleed:a=!1}){let[s,l]=(0,o.useState)(!1);(0,o.useEffect)(()=>{let u=h=>{h.key==="Escape"&&(i&&s?l(!1):t())};return window.addEventListener("keydown",u),()=>window.removeEventListener("keydown",u)},[t,i,s]);let d=i?`sheet peek${s?" full":""}`:"sheet";return o.default.createElement(o.default.Fragment,null,o.default.createElement("div",{className:"scrim"+(i&&!s?" soft":""),onClick:t}),o.default.createElement("div",{className:d,role:"dialog","aria-modal":i&&!s?void 0:"true"},i&&o.default.createElement("div",{class
