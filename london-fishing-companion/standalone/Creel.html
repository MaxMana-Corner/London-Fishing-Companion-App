ish"],where:["springbank","gibbons","kilally","meadowlily","komoka","fanshawe","vauxhall"],size:"Thames average 0.5\u20131.5 lb; a 3 lb river smallmouth is a very good fish"},{id:"lmb",name:"Largemouth bass",sci:"Micropterus salmoides",season:"bass",art:{body:"#6E8449",back:"#2F4020",belly:"#EFEBD4",marks:"stripe",bigJaw:!0,spiny:!0},idKey:["Upper jaw extends past the back of the eye","One broken dark stripe running the length of the flank","Deep notch between the spiny and soft dorsal fins","Green rather than bronze"],vs:"Smallmouth: jaw stops at mid-eye, red eye, vertical bars.",habits:"A cover ambush predator, not a current fish. In London that means the ponds. They sit under lily pads, against fallen timber, and along the inside edge of weed beds, and they will not chase far. Warm water makes them aggressive; cold water pushes them deep and slow.",target:["Fish the edge of the pads, then work into them \u2014 the biggest fish are in the thickest cover","Weightless soft plastics fall slowly and get eaten on the drop; count the fall and stay in contact","Frogs over matted pads at dawn and dusk on Westminster Ponds and Dorchester Mill Pond","If you get a blow-up and miss, cast straight back \u2014 they almost always eat twice"],baits:["senko","texas","frog","spinnerbait","chatterbait","shiner"],where:["westminster","dorchester","fanshawe"],size:"Westminster Ponds holds genuine 5 lb-plus fish"},{id:"pike",name:"Northern pike",sci:"Esox lucius",season:"pike",art:{body:"#5C6B3A",back:"#33401F",belly:"#EDE9CC",marks:"beans",slim:!0},idKey:["Light bean-shaped spots on a dark green body \u2014 the reverse of a muskie","Duck-bill snout full of teeth","Single soft dorsal set far back, near the tail","Rounded tail lobes"],vs:"Muskellunge: dark bars on a light body, pointed tail lobes. A muskie must exceed 91 cm to be kept and is C-0.",habits:"A weed-edge ambush hunter that sits motionless and accelerates. Cold water suits them \u2014 spring and late autumn are the big-fish windows, and they go sluggish in warm midsummer shallows. They will follow a lure to your feet and eat at the last second.",target:["Always use a wire trace or a 40 lb fluorocarbon leader \u2014 pike teeth cut straight line","Finish every retrieve with a slow figure-eight beside the bank; followers eat on the turn","Work parallel to the weed edge rather than casting straight out over it","Carry long-nose pliers and jaw spreaders, and never put fingers inside the gill plate"],baits:["spinnerbait","spoon","jerkbait","spinner","shiner"],where:["fanshawe","westminster","dorchester","greenway","springbank"],size:"28-inch fish are caught in the Thames west end; Fanshawe holds bigger"},{id:"wall",name:"Walleye",sci:"Sander vitreus",season:"walleye",art:{body:"#9A8B4B",back:"#4E4220",belly:"#F0EAC8",eye:"#C9B96A",whiteTip:!0,forked:!0,slim:!0},idKey:["White tip on the lower lobe of the tail \u2014 the reliable tell","Large glassy, reflective eye","Dark blotch at the rear base of the spiny dorsal fin","Olive-gold with fine mottling"],vs:"Sauger: dark spots in rows on the dorsal fin, no white tail tip.",habits:"Light-sensitive. That single fact governs everything \u2014 they feed at dawn, at dusk, after dark, and all day when the river is stained and pushing. Bright, clear, low water means they sit deep and tight to the bottom and barely feed.",target:["Fish the last hour of light and the first hour of dark, or fish a coloured river after rain","Jig and minnow bounced on the bottom is the local standard and outfishes everything else","Jointed Shad Raps work from shore at Fanshawe and trolled slowly along the old river channel","Slow down. A walleye retrieve should feel too slow to be working"],baits:["jigminnow","shadrap","grub","crank","crawler"],where:["komoka","fanshawe","springbank","greenway"],size:"Max 1 fish over 46 cm may be retained in FMZ 16"},{id:"carp",name:"Common carp",sci:"Cyprinus carpio",season:"none",art:{body:"#8E7440",back:"#4A3A18",belly:"#E9DFBD",marks:"scales",barbels:!0,deep:!0},idKey:["Two pairs of barbels at the corners of the mouth","Very large, distinct scales","Long dorsal fin with a serrated leading spine","Thick-shouldered brassy gold body"],vs:"Freshwater drum: no barbels, steeply humped back, silver rather than gold.",habits:"The biggest fish you will hook inside the city and the most abundant on the main branch. They graze the bottom in loose groups and give themselves away by clouding the water and rolling on the surface. Warm months are prime. They are strong, long-running, and will strip line.",target:["Pre-bait a spot with loose corn, then fish a small patch of corn on a size 6 hook or a hair rig","Bread works both floating on the surface and pinched on the bottom","Set the rod on a rest with a loose drag \u2014 a carp will drag unattended tackle into the river","The Forks, Greenway and lower Springbank are the proven London carp swims"],baits:["corn","bread","crawler"],where:["forks","greenway","springbank","thamespark","vauxhall"],size:"Double-figure fish are routine; 20 lb-plus exist in the Thames"},{id:"cat",name:"Channel catfish",sci:"Ictalurus punctatus",season:"catfish",art:{body:"#6B6656",back:"#38352A",belly:"#E7E4D2",marks:"spots",barbels:!0,forked:!0,slim:!0},idKey:["Deeply forked tail \u2014 the tell against bullheads","Scattered dark spots on the flanks, fading with age","Four pairs of barbels; smooth scaleless skin","Sharp spines in the dorsal and pectoral fins \u2014 handle with care"],vs:"Brown bullhead: square or slightly rounded tail, no spots, chunkier head.",habits:"A nocturnal bottom scavenger that hunts by smell. They move into shallower runs at night and drop back to deep holes at first light. Warm, slightly coloured water after rain switches them on.",target:["Fish after dark from a bank you scouted in daylight","Chicken liver, cut bait, shrimp or a bunched nightcrawler on a sliding sinker rig","Cast to the head or tail of a deep hole, not the middle","Grip behind the pectoral spines, never over the top of them"],baits:["liver","cutbait","crawler"],where:["greenway","forks","vauxhall","meadowlily","thamespark"],size:"12 lb-plus fish have come out of Greenway"},{id:"rock",name:"Rock bass",sci:"Ambloplites rupestris",season:"sunfish",art:{body:"#7B7350",back:"#42402A",belly:"#E4E2CA",eye:"#B32A18",marks:"speckle",deep:!0,spiny:!0},idKey:["Bright red eye","Rows of dark spots forming faint stripes along the flank","Six spines in the anal fin \u2014 more than any sunfish","Big mouth for its body size"],vs:"Smallmouth bass: much longer body, vertical bars rather than dotted rows.",habits:"Everywhere the Thames has rock and shade, and completely undiscriminating. The most reliable fish in the river for a beginner or a child, and the one that saves a blank day.",target:["Anything small dropped near rock will get eaten","Great first-fish species \u2014 small jig or worm under a float","They shoal, so where you get one, keep casting"],baits:["grub","worm","spinner","tube"],where:["gibbons","springbank","kilally","meadowlily","komoka"],size:"Rarely over 10 inches"},{id:"bluegill",name:"Bluegill",sci:"Lepomis macrochirus",season:"sunfish",art:{body:"#5E7758",back:"#2E4030",belly:"#E9C77E",earFlap:"#1C2320",deep:!0,spiny:!0},idKey:["Solid black ear flap with no coloured margin","Dark smudge at the rear base of the soft dorsal fin","Very small mouth","Deep, plate-shaped body"],vs:"Pumpkinseed: orange or red crescent on the edge of the ear flap and wavy blue face lines.",habits:"Pond and weed-edge fish that shoal thickly. In late spring they fan out saucer-shaped beds in the shallows and become extremely easy to catch.",target:["Tiny hook \u2014 size 8 to 12 \u2014 with a fragment of worm under a small float","Fish the beds in late spring, weed edges through summer","Set the float shallow first, then deeper until you find them"],baits:["worm","waxworm","microjig"],where:["westminster","dorchester","fanshawe"],size:"4\u20137 inches typical"},{id:"pump",name:"Pumpkinseed",sci:"Lepomis gibbosus",season:"sunfish",art:{body:"#8C9440",back:"#4C5522",belly:"#F0B94E",earFlap:"#B4381E",marks:"speckle",deep:!0,spiny:!0},idKey:["Bright orange or red crescent on the trailing edge of the ear flap","Wavy blue lines across the cheek and gill cover","Orange spotting over an olive-gold body","Small mouth, very deep body"],vs:"Bluegill: all-black ear flap, no orange margin.",habits:"Prefers still, shallow water with vegetation. Shares the pond edges with bluegill and is usually the more colourful of the two.",target:["Same approach as bluegill \u2014 small hook, small bait, small float","Works its way right up to the bank; you often do not need to cast far"],baits:["worm","waxworm","microjig"],where:["westminster","dorchester","springbank"],size:"4\u20138 inches"},{id:"crappie",name:"Black crappie",sci:"Pomoxis nigromaculatus",season:"crappie",art:{body:"#7E8878",back:"#3B4438",belly:"#EDEFE2",marks:"speckle",deep:!0,spiny:!0},idKey:["Irregular black speckling scattered over silver-green, no ordered rows","Seven or eight dorsal spines","Very deep, compressed, almost circular body","Papery thin mouth membrane"],vs:"White crappie: five or six dorsal spines and faint vertical bars.",habits:"Schools suspend around submerged timber and deeper weed edges. Spring, as the water first warms, is by far the best window. They feed upward, so a bait above them beats a bait below them.",target:["Small tube jigs, 2 inch, fished slowly and steadily","Set your float so the jig sits just above the fish, never below","Strike gently \u2014 a hard hookset tears the hook straight out of their mouth"],baits:["microjig","tube","minnow"],where:["westminster","dorchester","fanshawe"],size:"8\u201312 inches"},{id:"perch",name:"Yellow perch",sci:"Perca flavescens",season:"perch",art:{body:"#C9A63C",back:"#4F5A22",belly:"#F2E6B4",marks:"vbars",slim:!0,spiny:!0},idKey:["Six to eight bold dark vertical bars over a golden-yellow body","Bright orange pelvic and anal fins","Two separate dorsal fins","Rough, sandpapery scales"],vs:"Walleye: no bold bars, glassy eye, white tail tip.",habits:"Shoaling fish that patrol flats in loose groups. Fanshawe is the local perch water, best in autumn and through the ice. Where you catch one, there are usually thirty.",target:["A small minnow or worm on a perch rig near the bottom","Fish autumn flats and, when safe, through the ice","Keep the bait moving in short lifts \u2014 they respond to motion"],baits:["minnow","worm","microjig"],where:["fanshawe"],size:"S-50 / C-25, open all year"},{id:"wbass",name:"White bass",sci:"Morone chrysops",season:"none",art:{body:"#A6B0AA",back:"#3F4A46",belly:"#F1F2EA",marks:"hstripes",forked:!0},idKey:["Several unbroken dark horizontal stripes on bright silver","Deep, slab-sided body with a humped back","Two separate dorsal fins","Locals call them silver bass"],vs:"Freshwater drum: no stripes, blunter head, and a distinctive drumming sound.",habits:"Travels in fast-moving schools that push baitfish to the surface. There is a well-known run to the Forks of the Thames in December, and they show up through the summer in the west end.",target:["When a school shows, cast small spinners or jigs into it and retrieve fast","Move as the school moves \u2014 they do not stay put","December at the Forks is the traditional local window"],baits:["spinner","grub","microjig"],where:["forks","springbank","greenway"],size:"10\u201314 inches, caught in numbers"},{id:"drum",name:"Freshwater drum",sci:"Aplodinotus grunniens",season:"none",art:{body:"#A9A692",back:"#4C4B3C",belly:"#F0EEE0",deep:!0,marks:"scales"},idKey:["Steeply humped back and a blunt downturned mouth","Long continuous dorsal fin with a notch","Rounded rather than forked tail","Dull silver; makes an audible grunting sound when landed"],vs:"Carp: barbels at the mouth, gold rather than silver, no humped back.",habits:"A bottom feeder over gravel and sand that crushes molluscs and crayfish. Common in the main branch and often caught by accident by walleye and smallmouth anglers. Locals call them sheephead.",target:["Bottom-bounced jigs and crawlers over gravel","Not usually a target, but they fight hard and are worth enjoying when they come"],baits:["jigminnow","crawler","tube"],where:["forks","springbank","komoka"],size:"2\u20136 lb typical"},{id:"trout",name:"Migratory trout & salmon",sci:"Oncorhynchus / Salmo spp.",season:"troutThames",art:{body:"#8FA0A4",back:"#3E5158",belly:"#F2F0E6",marks:"speckle",forked:!1,slim:!0},idKey:["Small fleshy adipose fin between the dorsal and the tail","Rainbow trout: pink lateral band and heavy black spotting into the tail","Brown trout: black and red spots with pale halos, spots not on the tail","Chinook: black gums and a heavily spotted tail"],vs:"Any bass or walleye: no adipose fin. That single fin settles it.",habits:"Occasional visitors this far up the Thames, not a resident population. Historically taken at Springbank and Delaware, most often in cold water with high flow. Treat every one as a bonus.",target:["Cold water, high flow, spring and late autumn","Spoons, spinners and drifted roe in the deeper runs","Check the exceptions carefully \u2014 the Thames main branch in Middlesex County runs a different season to the rest of the zone"],baits:["spoon","spinner","crawler"],where:["springbank","kilally","komoka"],size:"Rare but real \u2014 10 lb rainbows have been reported at Springbank"},{id:"sucker",name:"White sucker",sci:"Catostomus commersonii",season:"none",art:{body:"#8A8578",back:"#4A473C",belly:"#EBE9DC",slim:!0},idKey:["Mouth on the underside of the head with thick fleshy lips","No barbels","Plain olive-brown, slightly paler on the belly","Torpedo body with a large forked tail"],vs:"Carp: barbels, larger scales, much deeper body.",habits:"A bottom feeder in warm shallow water throughout the river. Runs upstream in spring in numbers. Frequently caught on bottom-fished worms while you are after something else.",target:["Worm on the bottom in a slow run","Good bait indicator \u2014 where suckers feed, the bottom is soft and food-rich"],baits:["worm","crawler"],where:["springbank","gibbons","meadowlily","komoka"],size:"12\u201320 inches"}],Uw=[{id:"tube",name:"Tube jig",kind:"Soft plastic",sizes:"2.5\u20133 in, 1/8\u20131/4 oz head",colours:"Green pumpkin, crawfish orange, smoke",targets:["smb","rock","crappie","drum"],hook:"Internal tube jig head, size 1/0 \u2014 the weight sits inside the tube so it falls nose-down like a crayfish",rig:"Jig head inserted inside the tube body",float:"No \u2014 you need direct contact with the bottom",how:"Cast upstream at a 45-degree angle, let it sink, then hop it back with the current in short lifts. Most takes come as it falls. If you are not occasionally ticking bottom, go heavier.",when:"The single most productive smallmouth bait in the Thames, all season"},{id:"grub",name:"Curly-tail grub",kind:"Soft plastic",sizes:"3\u20134 in on 1/8 oz head",colours:"Pumpkinseed, white, chartreuse",targets:["smb","wall","rock","wbass"],hook:"Round or darter jig head, size 1 to 1/0",rig:"Threaded straight onto a jig head",float:"No",how:"Steady slow retrieve just off the bottom, with an occasional pause. The tail does the work \u2014 you do not need to add action.",when:"The most forgiving lure in the box. If you own one thing, own this."},{id:"senko",name:"Wacky-rigged stick worm",kind:"Soft plastic",sizes:"4\u20135 in, no weight",colours:"Green pumpkin, black-blue",targets:["lmb","smb"],hook:"Size 1 or 1/0 octopus or wacky hook through the middle of the worm; add an O-ring to make each worm last",rig:"Weightless, hooked through the middle so both ends shimmy on the fall",float:"No",how:"Cast past the cover, let it sink on a slack line, and watch the line rather than the lure. When the line jumps or moves sideways, reel down and lean into it.",when:"Pond largemouth, and clear calm days when nothing else gets bitten"},{id:"texas",name:"Texas-rigged worm or creature",kind:"Soft plastic",sizes:"4\u20136 in, 1/8\u20133/8 oz bullet weight",colours:"Green pumpkin, junebug",targets:["lmb"],hook:"3/0 to 4/0 offset worm hook, point buried in the plastic so it comes through weed-free",rig:"Bullet weight above the hook, point tucked back into the body",float:"No",how:"Pitch into pads and timber, let it fall, shake twice, lift and move. Fish it slowly \u2014 this rig is for getting into places other lures cannot go.",when:"Heavy cover on Westminster Ponds and Dorchester Mill Pond"},{id:"frog",name:"Hollow-body frog",kind:"Topwater",sizes:"2.5 in",colours:"Black, white, green",targets:["lmb","pike"],hook:"Built-in double hook riding upward against the body",rig:"Tied straight to braid \u2014 you need zero stretch to drive those hooks home",float:"It is the float",how:"Walk it across matted pads with small rod twitches, pausing in every gap. When a fish blows up, wait until you feel the weight before setting.",when:"Dawn and dusk over pad mats from June to September"},{id:"spinnerbait",name:"Spinnerbait",kind:"Wire bait",sizes:"3/8 oz, willow or Colorado blade",colours:"White-chartreuse, all white",targets:["pike","lmb","smb"],hook:"Fixed single hook on the wire arm; add a trailer hook when fish are short-striking",rig:"Tie straight to the wire arm",float:"No",how:"Slow-roll it just over the weed tops or bump it off timber. The deflection off cover triggers the strike more than the retrieve does.",when:"Coloured water and weed edges; near weedless, so fish it where you would not risk trebles"},{id:"chatterbait",name:"Bladed jig",kind:"Wire bait",sizes:"3/8 oz",colours:"White, black-blue",targets:["lmb","pike"],hook:"Fixed jig hook, plus a paddle-tail trailer",rig:"Trailer threaded on the hook shank",float:"No",how:"Steady retrieve with a hard vibration you should feel in the rod tip the whole way back. If the vibration stops, something has hold of it.",when:"Stained pond water and low light"},{id:"spinner",name:"Inline spinner",kind:"Hardware",sizes:"Size 2\u20133",colours:"Silver blade, brass blade",targets:["smb","rock","pike","wbass","trout"],hook:"Factory treble \u2014 swap to a single inline hook if you are releasing everything",rig:"Small barrel swivel 18 in up the line to stop line twist",float:"No",how:"Cast across the current and retrieve just fast enough to feel the blade turning. Slower is almost always better than faster.",when:"The easiest lure for a beginner to fish correctly"},{id:"jerkbait",name:"Small jerkbait",kind:"Hard bait",sizes:"2.5\u20133.5 in suspending",colours:"Perch, silver-black, clown",targets:["smb","pike","wall"],hook:"Two size 8\u201310 trebles as supplied; crush the barbs for easier release",rig:"Loop knot or small snap so it can swing freely",float:"No \u2014 it suspends",how:"Two sharp twitches, then a pause of three to five seconds. The pause is where the bite happens. In cold water, make the pause twice as long.",when:"Very small jerkbaits have a long local reputation on the Thames"},{id:"crank",name:"Squarebill crankbait",kind:"Hard bait",sizes:"2 in, shallow diving",colours:"Craw orange, chartreuse-black",targets:["smb","lmb","wall"],hook:"Two size 6\u20138 trebles",rig:"Tie direct or use a small snap",float:"Floats at rest, dives on retrieve",how:"Deliberately bump it into rock and timber. The deflection is what triggers the strike \u2014 a crankbait that never touches anything catches far less.",when:"Covering water fast to find where the fish are holding"},{id:"shadrap",name:"Jointed diving minnow",kind:"Hard bait",sizes:"3\u20135 in jointed",colours:"Perch, blue-silver",targets:["wall","pike"],hook:"Two or three small trebles",rig:"Loop knot for maximum wobble",float:"No",how:"Cast and retrieve very slowly from shore, or troll it along the old river channel at Fanshawe at walking pace.",when:"The bait Fanshawe walleye anglers have used from shore and boat for decades"},{id:"popper",name:"Topwater popper",kind:"Topwater",sizes:"2\u20133 in",colours:"Bone, frog, silver",targets:["smb","lmb","pike"],hook:"Two small trebles; consider replacing the rear treble with a feathered one",rig:"Loop knot so it sits and pops freely",float:"It is the float",how:"Cast, let the rings settle completely, then one sharp pop and wait. Impatience kills more topwater fish than anything else.",when:"First and last light in summer, low clear water"},{id:"spoon",name:"Casting spoon",kind:"Hardware",sizes:"1/2\u20133/4 oz",colours:"Five of Diamonds, silver, brass",targets:["pike","trout"],hook:"Single treble; a wire trace is mandatory for pike",rig:"Snap swivel to prevent twist",float:"No",how:"Cast long, let it flutter down, then retrieve with an occasional pause so it flashes and falls. The flutter on the drop draws pike in.",when:"Cold-water pike, spring and late autumn"},{id:"jigminnow",name:"Jig and minnow",kind:"Live bait rig",sizes:"1/8\u20131/4 oz jig head",colours:"Chartreuse, orange, plain lead",targets:["wall","perch","drum"],hook:"Jig head size 2 to 1/0; hook the minnow once through both lips so it swims naturally",rig:"Jig head only, no extra weight",float:"Optional \u2014 a slip float suspends it over snaggy bottom",how:"Lift twelve inches, let it fall on a semi-slack line, pause, repeat. Almost every take comes on the fall or the pause.",when:"The local standard for walleye at Komoka, Delaware and Fanshawe"},{id:"minnow",name:"Minnow under a float",kind:"Live bait",sizes:"2\u20133 in shiners or dace",colours:"n/a",targets:["perch","crappie","pike"],hook:"Size 4\u20136 baitholder through the back, just behind the dorsal fin",rig:"Slip float, split shot 12 in above the hook",float:"Yes \u2014 a slip float lets you fish deep and still cast",how:"Set the depth so the minnow sits just above weed or bottom. Let the float drift with the current. When it goes under, count two before lifting.",when:"Fanshawe perch in autumn, pond crappie in spring"},{id:"shiner",name:"Large shiner or sucker",kind:"Live bait",sizes:"4\u20136 in",colours:"n/a",targets:["pike","lmb"],hook:"Size 1/0\u20132/0 single or a small quick-strike rig, on a wire trace for pike",rig:"Free-lined or under a large float",float:"Yes, a large sliding float",how:"Cast to the weed edge and let the bait swim. Give a pike line when it takes, then set once it has turned and moved off.",when:"Cold water when pike will not chase a lure"},{id:"crawler",name:"Nightcrawler",kind:"Live bait",sizes:"Whole or half",colours:"n/a",targets:["cat","drum","sucker","carp","wall"],hook:"Size 4\u20138 baitholder with the barbs on the shank that stop the worm sliding down",rig:"Sliding sinker rig on the bottom, or under a float in slow water",float:"Either, depending on target",how:"On the bottom, cast out, tighten gently, and set the rod so you can see the tip. Let it develop \u2014 do not strike at the first tap.",when:"The most versatile bait in Ontario. Nothing refuses a worm."},{id:"worm",name:"Piece of worm under a float",kind:"Live bait",sizes:"Half-inch fragment",colours:"n/a",targets:["bluegill","pump","rock","perch","sucker"],hook:"Size 8\u201312 fine-wire hook \u2014 small enough for a panfish mouth",rig:"Small waggler float, one split shot",float:"Yes \u2014 this is the classic float application",how:"Set shallow first, about two feet, and go deeper until you find them. Recast every few minutes to keep the bait moving.",when:"The best way to get anyone catching their first fish"},{id:"waxworm",name:"Wax worm",kind:"Live bait",sizes:"One or two on the hook",colours:"n/a",targets:["bluegill","pump","perch"],hook:"Size 10\u201312 fine wire, or tipped on a micro jig",rig:"Under a small float or on a micro jig",float:"Yes",how:"Tip a small jig and give it the tiniest lift-and-drop. Panfish inhale it.",when:"Cold water and hard-fished ponds, and through the ice"},{id:"microjig",name:"Micro jig",kind:"Soft plastic",sizes:"1/32\u20131/16 oz, 1\u20132 in body",colours:"Pink-white, chartreuse, black",targets:["crappie","bluegill","perch","wbass"],hook:"Integrated size 6\u20138 jig hook",rig:"Alone, or suspended under a small float",float:"Often \u2014 a float keeps it in the strike zone at a fixed depth",how:"Barely move it. A slow steady draw with tiny shakes is all that is needed. Set the float so the jig sits above the school.",when:"Spring crappie in the ponds, and panfish year-round"},{id:"corn",name:"Sweetcorn",kind:"Bait",sizes:"3\u20136 grains",colours:"n/a",targets:["carp"],hook:"Size 6\u20138 wide-gape, or a hair rig with the corn on a short hair below the hook",rig:"Running lead of 1\u20132 oz above a swivel, 12 in hooklength",float:"No \u2014 fish it hard on the bottom",how:"Scatter two handfuls of loose corn into a swim, then fish two or three grains on the hook in the middle of it. Give it thirty minutes before you move.",when:"The London carp bait. Cheap, effective, and available anywhere."},{id:"bread",name:"Bread",kind:"Bait",sizes:"Flake or a torn crust",colours:"n/a",targets:["carp"],hook:"Size 6 wide-gape, bread pinched onto the shank",rig:"Free-lined on the surface, or bottom-fished with a light lead",float:"Floating crust is its own float",how:"Throw a few torn pieces of crust in and watch. When carp start taking them confidently, put one on a hook and drift it in among them.",when:"Warm summer afternoons when carp are cruising the surface"},{id:"liver",name:"Chicken liver",kind:"Bait",sizes:"Thumb-sized piece",colours:"n/a",targets:["cat"],hook:"Size 2\u20132/0 wide-gape, or a treble to hold the soft bait on",rig:"Sliding sinker rig; use bait thread or a mesh to stop it flying off the cast",float:"No",how:"Cast gently, not hard. Let the scent trail develop for fifteen or twenty minutes before recasting.",when:"After dark for channel cats at Greenway and the east-end parks"},{id:"cutbait",name:"Cut bait",kind:"Bait",sizes:"1\u20132 in chunk of oily fish",colours:"n/a",targets:["cat"],hook:"Size 1/0\u20133/0 circle hook \u2014 the fish hooks itself, no strike needed",rig:"Sliding sinker on the bottom",float:"No",how:"With a circle hook, do not strike. When the rod loads up, simply lift and start reeling.",when:"Big channel cats, warm nights, coloured water"},{id:"crayfish",name:"Live or soft-plastic crayfish",kind:"Bait",sizes:"2\u20133 in",colours:"Brown, orange, olive",targets:["smb","rock"],hook:"Size 2\u20131/0 through the tail so it swims backwards naturally",rig:"One or two split shot, drifted through a riffle",float:"No",how:"Let it tumble naturally through the current with just enough weight to keep contact. This is the Thames smallmouth's main food.",when:"Any smallmouth situation on the river"}],C0=[{art:"finewire",size:"10\u201312",type:"Fine-wire baitholder",use:"Worm fragments, wax worms",sp:"Bluegill, pumpkinseed"},{art:"baitholder",size:"8",type:"Baitholder",use:"Half a worm under a float",sp:"Rock bass, perch, small panfish"},{art:"widegape",size:"6",type:"Wide-gape or hair rig",use:"Corn, bread",sp:"Carp"},{art:"baitholderworm",size:"4\u20136",type:"Baitholder",use:"Whole nightcrawler, minnow",sp:"Catfish, perch, sucker, drum"},{art:"octopus",size:"1\u20131/0",type:"Octopus / wacky",use:"Wacky-rigged stick worm",sp:"Largemouth, smallmouth"},{art:"tubehead",size:"1/0",type:"Tube jig head (internal)",use:"Tube baits",sp:"Smallmouth"},{art:"jighead",size:"2\u20131/0",type:"Round jig head",use:"Grubs, jig and minnow",sp:"Walleye, smallmouth, drum"},{art:"offset",size:"3/0\u20134/0",type:"Offset worm hook",use:"Texas-rigged plastics",sp:"Largemouth in cover"},{art:"wiretrace",size:"1/0\u20132/0",type:"Single, on a wire trace",use:"Live shiner or sucker",sp:"Northern pike"},{art:"circle",size:"1/0\u20133/0",type:"Circle hook",use:"Cut bait on the bottom",sp:"Channel catfish"},{art:"treble",size:"6\u201310",type:"Treble (factory)",use:"Cranks, jerkbaits, spoons",sp:"All predators \u2014 crush barbs to release cleanly"}],Gw=[{rig:"float",when:"Use a float",why:"You need the bait at a set depth above weed, snags or a suspended school \u2014 panfish, crappie, perch, live-baiting pike."},{rig:"slipfloat",when:"Use a slip float",why:"You need to fish deeper than your rod is long. The float slides down to the bait for casting and stops at your bead on the way back up."},{rig:"running",when:"Fish the bottom instead",why:"Your target feeds on the bottom and you want the bait still \u2014 carp, catfish, drum, sucker. A running lead lets the fish move without feeling resistance."},{rig:"weightless",when:"Fish weightless",why:"Clear, calm, pressured water where a slow natural fall is the whole trigger \u2014 wacky worms for pond largemouth."},{rig:"splitshot",when:"Add split shot",why:"You need a live bait to get down through current without deadening it. Two small shot beat one big one."},{rig:"swivel",when:"Add a barrel swivel",why:"You are throwing anything that spins \u2014 inline spinners and spoons \u2014 and want to avoid a twisted mess of line."},{rig:"leader",when:"Add a wire or heavy fluoro leader",why:"Pike are possible. Their teeth cut through mainline. This is not optional at Fanshawe, Westminster or Dorchester."}],p0=[{id:"springbank",name:"Springbank Park",area:"West end",water:"Thames \u2014 main branch",addr:"1085 Commissioners Rd W",ll:[42.9584,-81.3222],blurb:"The longest continuous walkable shoreline in the city, roughly 30 km of trail along the river. With the dam gone this stretch now runs shallower and faster than it did for a century.",depth:[0,1,2,3.5,5,6.5,7,6,4,2.5,1,0],hot:[{i:3,n:"Gravel shelf \u2014 smallmouth at first light"},{i:6,n:"Main channel hole \u2014 carp, cats, walleye"},{i:9,n:"Inside slack \u2014 panfish and cruising carp"}],density:{smb:4,carp:5,cat:3,wall:2,pike:2,rock:4,drum:3,sucker:3,trout:1,pump:3,wbass:3},access:{parking:5,walk:5,footing:4,amenities:5,cost:5},accessNote:"Paved trail to the water at multiple points, large free lots at Springbank Gate and Storybook, clean washrooms, LTC service. The most accessible fishing in London.",bank:"Mixed \u2014 mown grass, some rip-rap and gravel bar",hazards:"Trail closures continue around the dam site while restoration finishes. Check london.ca before parking there.",best:[4,5,6,8,9,10],tip:"The lower reaches below the old dam are the productive part. Walk past the crowds at Storybook."},{id:"greenway",name:"Greenway Park",area:"West-central",water:"Thames \u2014 main branch",addr:"Terry Fox Pkwy",ll:[42.9764,-81.2733],blurb:"Deeper, slower water with easy bank access and a boat launch. The classic London spot for sitting behind two rods on the bottom.",depth:[0,1.5,3,5,7,8.5,9,8,6,3.5,1.5,0],hot:[{i:4,n:"Drop-off \u2014 cast to the lip, not over it"},{i:6,n:"Deep hole \u2014 big cats after dark"},{i:2,n:"Margin \u2014 carp graze right against the bank"}],density:{carp:5,cat:5,pike:3,smb:2,wall:2,drum:3,wbass:3,rock:3},access:{parking:5,walk:5,footing:4,amenities:4,cost:5},accessNote:"Free lot, level ground, boat access point. Short carry from car to water.",bank:"Grass down to a soft silt margin",hazards:"Soft mud at the waterline after rain.",best:[5,6,7,8,9],tip:"Twelve-pound-plus channel cats have come out of here. Fish it after dark with liver on a sliding lead."},{id:"forks",name:"Harris Park & the Forks",area:"Downtown",water:"Thames \u2014 north and south branches meet",addr:"531 Ridout St N",ll:[42.9853,-81.2567],blurb:"Where the two branches join, under the fountain. Pavement to water's edge and bus routes at the door \u2014 the easiest fishing in the city, and the carp capital of London.",depth:[0,2,4,5.5,6,6.5,6,5,3.5,2,1,0],hot:[{i:4,n:"Confluence seam \u2014 everything funnels through it"},{i:8,n:"Slack inside \u2014 carp and drum"}],density:{carp:5,cat:4,drum:4,wbass:4,rock:3,smb:2,pike:1},access:{parking:4,walk:5,footing:5,amenities:2,cost:5},accessNote:"Paved right to the bank, flat, LTC routes adjacent. No washrooms \u2014 that is the one weakness.",bank:"Hard surface and engineered stone",hazards:"Busy park; watch your backcast for pedestrians and cyclists.",best:[5,6,7,8,9,11],tip:"There is a long-standing December run of white bass here. It is slow, silty water \u2014 do not expect much smallmouth."},{id:"gibbons",name:"Gibbons Park",area:"North, by Western",water:"Thames \u2014 north branch",addr:"2A Grosvenor St",ll:[42.9984,-81.2607],blurb:"Riffle-and-pool water below the university. The best light-tackle smallmouth in the city core.",depth:[0,.5,1.5,2.5,3.5,4,3.5,2.5,1.5,.8,0],hot:[{i:2,n:"Head of the riffle \u2014 hold above it and cast up"},{i:5,n:"Pool \u2014 the deepest holding water"},{i:7,n:"Tail-out \u2014 smallmouth stage here at dusk"}],density:{smb:4,rock:5,sucker:4,carp:2,pump:3},access:{parking:4,walk:4,footing:3,amenities:4,cost:5},accessNote:"Free lot, paved trail, washrooms and playground. Short scramble down the bank to fishable water.",bank:"Gravel and cobble, wadeable in low summer flow",hazards:"Uneven bottom with unexpected holes. Wade only where you can see the bottom.",best:[5,6,7,8,9,10],tip:"Small jerkbaits and tubes. Fish upstream and let the bait come back to you naturally."},{id:"kilally",name:"Kilally Meadows ESA",area:"Northeast",water:"Thames \u2014 north branch",addr:"Edgevalley Rd",ll:[43.0331,-81.232],blurb:"North branch below the Fanshawe dam, so the water runs colder and clearer than anywhere else in the city. This is where the trout exception matters.",depth:[0,1,2,3,4.5,5,4,3,2,1,0],hot:[{i:4,n:"Cold deep run \u2014 best trout chance in London"},{i:2,n:"Boulder seam \u2014 smallmouth"}],density:{smb:4,rock:4,trout:2,sucker:3,carp:1},access:{parking:3,walk:3,footing:3,amenities:1,cost:5},accessNote:"Trailhead parking, then a walk in along the Thames Valley Parkway. No washrooms.",bank:"Natural, wooded, some steep sections",hazards:"ESA rules apply \u2014 stay on marked trails, no hunting, licence required.",best:[4,5,6,9,10],tip:"The North Thames main branch in Middlesex County is open all year for brown and rainbow trout at S-5 / C-2. Read the exception carefully."},{id:"meadowlily",name:"Meadowlily Woods ESA",area:"Southeast",water:"Thames \u2014 main branch",addr:"Meadowlily Rd S",ll:[42.9717,-81.1869],blurb:"The quiet one. Wooded banks, undercut holes and gravel bars, with far fewer people than the downtown parks.",depth:[0,1.5,3,4.5,6,6.5,5.5,4,2,1,0],hot:[{i:1,n:"Undercut bank \u2014 smallmouth sit tight underneath"},{i:5,n:"Deep hole \u2014 catfish after dark"},{i:8,n:"Gravel bar tail-out"}],density:{smb:4,cat:4,rock:4,carp:3,sucker:3,drum:2},access:{parking:3,walk:2,footing:2,amenities:1,cost:5},accessNote:"Free street parking, then a real hike in on natural trail with roots and elevation. No washrooms, no paved surface.",bank:"Natural, steep in places, tree-lined",hazards:"Steep descents to the water and slippery clay after rain. Not suitable for limited mobility.",best:[5,6,7,8,9,10],tip:"Worth the walk if you want to fish without an audience. Undercut banks are the spot."},{id:"vauxhall",name:"Vauxhall Park",area:"East end",water:"Thames \u2014 main branch",addr:"54 Price St",ll:[42.9738,-81.2082],blurb:"The east-end access locals have fished for decades. Unglamorous and consistently productive.",depth:[0,1.5,3,4.5,5.5,6,5,3.5,2,1,0],hot:[{i:4,n:"Channel \u2014 carp and cats"},{i:2,n:"Shallow gravel \u2014 smallmouth at dusk"}],density:{carp:4,cat:4,smb:3,rock:3,drum:2},access:{parking:4,walk:4,footing:3,amenities:2,cost:5},accessNote:"Street and lot parking, short flat walk. Minimal facilities.",bank:"Grass and gravel",hazards:"Nothing unusual \u2014 standard river caution.",best:[5,6,7,8,9],tip:"Between the rail trestle and the Horton bridge there is deeper holding water worth finding."},{id:"thamespark",name:"Thames Park",area:"Central south",water:"Thames \u2014 main branch",addr:"15 Ridout St S",ll:[42.9756,-81.2534],blurb:"Central, easy, and overlooked. Good bottom-fishing water with a paved trail and full park facilities.",depth:[0,2,3.5,5,6,6.5,5.5,4,2.5,1,0],hot:[{i:5,n:"Main channel \u2014 carp and cats"},{i:8,n:"Inside bend slack"}],density:{carp:4,cat:3,smb:2,drum:2,rock:3},access:{parking:5,walk:5,footing:4,amenities:4,cost:5},accessNote:"Large lot, paved paths, pool and playground on site. Very family-friendly.",bank:"Mown grass with a gentle slope",hazards:"Busy in summer.",best:[5,6,7,8,9],tip:"A good place to bring someone who has never fished. Facilities cover the boredom problem."},{id:"westminster",name:"Westminster Ponds / Pond Mills",area:"South",water:"Still water \u2014 five connected ponds",addr:"696 Wellington Rd",ll:[42.9477,-81.2269],blurb:"Five or six connected ponds minutes from the core, all lily-pad edges and weed lines. The best largemouth water inside the city and the reason to own a frog.",depth:[0,2,4,7,11,15,16,14,9,5,2,0],hot:[{i:2,n:"Pad edge \u2014 largemouth ambush lane"},{i:4,n:"Weed line drop \u2014 pike patrol this"},{i:6,n:"Basin \u2014 crappie suspend here in spring"}],density:{lmb:5,bluegill:5,pump:4,crappie:4,pike:3},access:{parking:4,walk:3,footing:1,amenities:2,cost:5},accessNote:"Parking off Wellington and Commissioners, then boardwalk and natural trail. Getting to fishable shoreline is the hard part.",bank:"Boggy, soft, undercut at the pad fringe",hazards:"Serious: the lily-pad fringe is boggy and full of holes. Anglers report going from one metre to two metres of water in a single step. Do not wade here.",best:[5,6,7,8,9],tip:"A float tube or kickboat unlocks this place completely. From shore, fish the accessible pad edges and be patient."},{id:"fanshawe",name:"Fanshawe Conservation Area",area:"Northeast",water:"Reservoir \u2014 228 ha",addr:"1424 Clarke Rd",ll:[43.0355,-81.1884],blurb:"London's only real lake fishery, and the only local water that holds a proper walleye and perch population. Entry fee applies.",depth:[0,3,6,10,15,22,28,24,16,9,4,0],hot:[{i:6,n:"Old river channel \u2014 deepest, coolest water in summer"},{i:2,n:"Weedy bay \u2014 pike and largemouth"},{i:9,n:"Flats \u2014 autumn perch schools"},{i:4,n:"Near the dam and canoe launch \u2014 shore walleye"}],density:{wall:4,pike:4,perch:5,smb:3,lmb:3,crappie:2,bluegill:3},access:{parking:4,walk:4,footing:4,amenities:5,cost:2},accessNote:"Full facilities, camping, washrooms, TackleShare rod-and-reel loans through OFAH. But there is an entry fee, and outboards must be under 10 hp.",bank:"Managed shoreline, docks, launch",hazards:"Open water and wind. Wear a PFD if you are afloat.",best:[4,5,6,9,10,1],tip:"It is not easy fishing. Targeting offshore, unseen structure \u2014 especially the old river channel through the middle \u2014 pays off far more than fishing the visible bank."},{id:"komoka",name:"Komoka Provincial Park",area:"15 min west",water:"Thames \u2014 main branch, downstream",addr:"503 Gideon Dr",ll:[42.953,-81.384],blurb:"Cleaner, faster Thames water west of the city. Consistently the best local shot at walleye and better-average smallmouth.",depth:[0,1,3,5,7,8,7,5,3,1.5,0],hot:[{i:3,n:"Current seam off the point"},{i:5,n:"Deep run \u2014 walleye at dusk"},{i:8,n:"Gravel tail-out \u2014 smallmouth"}],density:{smb:5,wall:4,rock:4,drum:3,carp:3,sucker:3,trout:2},access:{parking:3,walk:3,footing:3,amenities:2,cost:3},accessNote:"Paid parking, 2-hour or 4-hour passes. The payment machine is unreliable \u2014 bring coins and a backup plan. Then a walk to the river.",bank:"Natural, gravel and clay, some steep descents",hazards:"$95 fines for dogs off leash. Steep riverbank in places.",best:[4,5,6,9,10,11],tip:"The Delaware and Kilworth bridge stretches nearby are long-standing local walleye spots, best in cold water before and after summer."},{id:"dorchester",name:"Dorchester Mill Pond",area:"20 min east",water:"Still water \u2014 mill pond",addr:"Mill Pond, Thames Centre",ll:[42.9872,-81.0663],blurb:"A textbook largemouth and pike pond with a decent crappie population, and a proper ecotrail around it. Electric motors only.",depth:[0,2,4,6,9,11,12,10,7,4,2,0],hot:[{i:2,n:"Concrete blocks by the entrance \u2014 easy shore access"},{i:4,n:"Weed line \u2014 pike and largemouth"},{i:6,n:"Basin \u2014 spring crappie"}],density:{lmb:5,pike:4,crappie:4,bluegill:4,pump:3},access:{parking:5,walk:4,footing:4,amenities:3,cost:5},accessNote:"Free parking on-street and in two lots. Portable toilet on site, ice cream shop at the trail entrance. Concrete blocks near the entrance make solid casting platforms.",bank:"Concrete blocks, then natural shoreline and boardwalk",hazards:"Discarded line and tackle along the popular stretches \u2014 take a bag.",best:[4,5,6,7,8,9],tip:"Worth the drive for the largemouth. Kayak-friendly with an easy launch just right of the entrance."}],Gc=[["parking","Parking"],["walk","Walk to water"],["footing","Bank footing"],["amenities","Washrooms & facilities"],["cost","Free to fish"]],Vc=e=>Math.round(Gc.reduce((t,[n])=>t+(e[n]||0),0)/Gc.length),Vw=[{id:"clinch",name:"Improved clinch",use:"Tying a hook, lure or swivel to monofilament or fluorocarbon",strength:"Around 95% of line strength",diff:"Start here",steps:["Pass 6 inches of line through the hook eye.","Twist the tag end around the standing line five times.","Bring the tag back through the small loop right above the hook eye.","Then pass it through the big loop you just created \u2014 this is the 'improved' part and it is what stops it slipping.","Wet the knot with saliva, pull the standing line slowly until the coils bed down neatly, and trim the tag to 2 mm."],fail:"If it slips, you skipped the second loop or you pulled it tight dry. Always wet it."},{id:"palomar",name:"Palomar",use:"Braided line to anything. The strongest simple knot there is.",strength:"Close to 100%",diff:"Start here",steps:["Double 6 inches of line and pass the loop through the hook eye.","Tie a loose overhand knot with the doubled line \u2014 do not tighten it.","Pass the loop over the entire hook or lure.","Wet it and pull both the standing line and the tag together until it seats.","Trim the tag."],fail:"Make sure the loop passes cleanly over the hook point and does not cross the knot. A crossed Palomar fails at half strength."},{id:"uni",name:"Uni knot",use:"One knot for everything \u2014 hooks, spool arbors, and joining two lines",strength:"Around 90%",diff:"Worth learning second",steps:["Pass the line through the eye and double it back alongside itself, forming a loop.","Wrap the tag end around both strands and through the loop, six times.","Wet it and pull the tag to close the coils into a barrel.","Slide the barrel down to the eye by pulling the standing line, and trim."],fail:"Fewer than five wraps in slippery fluorocarbon will slip. Use six or seven."},{id:"loop",name:"Non-slip loop knot",use:"Jerkbaits, jointed minnows and topwater \u2014 anything that needs free movement",strength:"Around 85\u201390%",diff:"Once you are comfortable",steps:["Tie a loose overhand knot in the line about 6 inches from the end, leaving it open.","Pass the tag through the hook eye and back through the overhand knot.","Wrap the tag around the standing line four or five times.","Bring the tag back through the overhand knot, entering from the same side it exited.","Wet, pull the standing line and the tag together, then set the loop size before final tightening."],fail:"A lure tied on tight swims worse. This is the difference between a jerkbait that catches and one that does not."},{id:"surgeon",name:"Double surgeon's",use:"Joining your mainline to a leader \u2014 braid to fluorocarbon",strength:"Around 90%, and it is fast",diff:"Once you are comfortable",steps:["Lay the two lines alongside each other with about 8 inches of overlap.","Treat the doubled section as one line and tie a simple overhand knot.","Pass the same ends through a second time \u2014 that is the double.","Wet thoroughly and pull all four ends apart at once, slowly.","Trim both tags flush."],fail:"Pulling only two of the four ends creates a lopsided knot that fails under load. Pull all four."},{id:"hair",name:"Hair rig (carp)",use:"Presenting corn or bread off the hook rather than on it",strength:"n/a \u2014 a rig, not a knot",diff:"Carp-specific",steps:["Tie a small loop in one end of a 10-inch hooklength.","Pass the other end through the back of the hook eye and lay it along the shank so the loop hangs 1 cm below the bend.","Whip the line down the shank seven or eight times, trapping it.","Pass the end back through the hook eye from front to back and pull tight.","Thread corn onto the hair with a baiting needle and hold it on with a small boilie stop."],fail:"The whole point is that the hook is exposed. If the bait covers the hook point, the rig will not hook fish."}],Yw=[{id:"t1",cat:"Reading water",title:"Fish the seam, not the fast or the slow",body:"Every riffle on the Thames has a visible line where fast water meets slow. Smallmouth and walleye sit on the slow side of that line and dart into the fast water to feed. Cast into the fast water and let your bait swing across the seam."},{id:"t2",cat:"Reading water",title:"Structure beats open water, every time",body:"A single boulder, a fallen tree, a bridge pier, a weed edge, a drop-off. If there is nothing for a fish to relate to, there is no fish. Cast to something, not at nothing."},{id:"t3",cat:"Reading water",title:"Deep holes hold fish through the middle of the day",body:"In summer, fish move shallow at dawn and dusk and drop back into the deepest available water when the sun is high. If you are fishing at noon, fish deep and slow or accept a hard day."},{id:"t4",cat:"Conditions",title:"Watch the river level, not just the weather",body:"UTRCA publishes Thames levels at thamesriver.on.ca. The recommended paddling flow is 15 cubic metres per second on the north and south branches and 20 on the main branch. Those numbers are also a reasonable proxy for whether the bank is fishable and safe."},{id:"t5",cat:"Conditions",title:"Colour after rain is an opportunity",body:"Stained water makes walleye feed all day instead of only at dusk, and lets you get closer to spooky smallmouth. Go bigger, brighter and noisier when the river colours up."},{id:"t6",cat:"Conditions",title:"Low clear summer water demands a lighter approach",body:"In August the Thames runs low and clear and the fish become genuinely spooky. Lengthen your leader, downsize the bait, stay off the skyline, and fish first and last light."},{id:"t7",cat:"Handling",title:"Keep the fish in the water",body:"Keep fish in the water as much as possible. Wet your hands or use wetted gloves before touching one, never touch the gills or eyes, and hold the fish horizontally supporting its belly rather than suspending it vertically."},{id:"t8",cat:"Handling",title:"Have the camera ready before you hook up",body:"Photograph fish in the water where you can, and have the camera set before the fish is landed rather than fumbling for it while the fish is out of the water."},{id:"t9",cat:"Handling",title:"Cut the line on a deeply hooked fish",body:"Remove hooks while the fish is still in the water where possible, using pliers. If it is deeply hooked, cut the line or the hook shank and leave the hook in place \u2014 that fish survives far better than one you dig around inside."},{id:"t10",cat:"Handling",title:"Release properly",body:"Lower the fish gently back into the water rather than dropping it. If it cannot swim away immediately, hold it upright in the current until it goes on its own."},{id:"t11",cat:"Rules",title:"Closed season means you cannot target them at all",body:"Casting to spawning smallmouth in May is a violation even if you release every fish. Targeting a species during its closed season is the offence, not keeping it."},{id:"t12",cat:"Rules",title:"Do not move bait in or out of the zone",body:"FMZ 16 sits in the Southern Bait Management Zone. Live or dead baitfish and leeches may not be transported into or out of a Bait Management Zone. Preserved dead bait is exempt. Buy locally, use locally, and never dump a bait bucket."},{id:"t13",cat:"Rules",title:"Know who needs a licence",body:"Anglers aged 18 to 64 need a licence. Those outside that range do not, but carry all the same rights and responsibilities. For 2026 an Ontario resident pays $26.57 for a 1-year sport licence or $15.07 conservation, plus $8.57 for the three-year Outdoors Card. The 1-day sport licence at $12.21 is the only one that does not need a card."},{id:"t14",cat:"Rules",title:"Warmouth may not be kept",body:"Warmouth is listed as endangered in Ontario and may not be caught or possessed under a recreational fishing licence. It looks like a rock bass with a bigger mouth \u2014 if in doubt, release immediately."},{id:"t15",cat:"Safety",title:"Wade only where you can see the bottom",body:"The Thames bottom is uneven and there may be holes or deeper areas close to you. If you cannot see the bottom, do not step there. The Westminster Ponds pad fringe is the worst offender in the region."},{id:"t16",cat:"Safety",title:"The Thames is not drinking water",body:"Carry your own water. Also consult the Guide to Eating Ontario Sport Fish before keeping anything from an urban river running through a city of 400,000."},{id:"t17",cat:"Gear",title:"One rod covers ninety percent of London",body:`A 6'6" to 7' medium spinning rod with a 2500-size reel, 10 lb braid and an 8 lb fluorocarbon leader handles smallmouth, walleye, pond largemouth and light carp work. Add a heavier bottom rod only when you get serious about carp and cats.`},{id:"t18",cat:"Gear",title:"Crush your barbs",body:"Barbless hooks come out of fish faster and cleanly, and out of your own hand faster too. The Fish & Paddle Guide recommends them for catch and release, and you lose far fewer fish than people claim."},{id:"t19",cat:"Gear",title:"Carry a line bin",body:"Discarded monofilament is the single most visible fishing problem on London's banks, especially at Dorchester and the Forks. Bring a small bag out with you and leave with more line than you brought."},{id:"t20",cat:"Getting started",title:"Borrow before you buy",body:"The conservation areas partner with OFAH on TackleShare, which loans rod, reel and tackle at no charge \u2014 a library service for fishing gear. Use it before spending money."}],cl={sky:["Clear","Part cloud","Overcast","Rain","Snow"],wind:["Calm","Light","Moderate","Strong"],clarity:["Gin clear","Slight stain","Stained","Muddy"],level:["Very low","Normal","High","Flood"],moon:["New","Waxing","Full","Waning"]};function Kw({children:e,onClose:t,bleed:n,asTab:o}){return o?r.default.createElement("div",{className:"tabfull"},e):r.default.createElement(Ze,{onClose:t,bleed:n},e)}function Ze({title:e,onClose:t,children:n,action:o,peek:i=!1,bleed:s=!1}){let[a,l]=(0,r.useState)(!1);return(0,r.useEffect)(()=>{let u=c=>{c.key==="Escape"&&(i&&a?l(!1):t())};return window.addEventListener("keydown",u),()=>window.removeEventListener("keydown",u)},[t,i,a]),r.default.createElement(r.default.Fragment,null,r.default.createElement("div",{className:"scrim",onClick:t}),r.default.createElement("div",{className:i?`sheet peek${a?" full":""}`:"sheet",role:"dialog","aria-modal":"true"},i&&r.default.createElement("div",{className:"grab",onClick:()=>l(u=>!u),role:"presentation"},r.default.createElement("i",null)),!s&&r.default.createElement("div",{className:"sheethdr"},r.default.createElement("h3",{style:{flex:1,minWidth:0}},e),o,i&&r.default.createElement("button",{className:"expand",onClick:()=>l(u=>!u),"aria-expanded":a,"aria-label":a?"Collapse the record":"Expand to full screen"},a?"Collapse":"Expand"),r.default.createElement("button",{className:"x",onClick:t},"Close")),r.default.createElement("div",{style:s?{position:"absolute",inset:0}:{padding:"16px 16px 64px"}},n)))}var Qw=[{id:"regs",label:"Ontario fishing regulations summary",url:"https://www.ontario.ca/document/ontario-fishing-regulations-summary",why:"The one that matters. Seasons, limits and sizes, updated every year."},{id:"licence",label:"Buy or renew a fishing licence",url:"https://www.ontario.ca/page/fishing-licence",wh
