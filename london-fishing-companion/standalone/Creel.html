winter, straight down."},{id:"troll",name:"Trolling",blurb:"Dragging lures behind a moving boat to find scattered fish."}],mc={float:"Fixed float",slipfloat:"Slip float",running:"Running ledger",weightless:"Weightless",splitshot:"Split shot",swivel:"Swivel",leader:"Leader or trace"},my=["Start here","Worth learning","Advanced"],gy=[{id:"trotting",name:"Trotting a float",style:"float",gist:"Let a float run downstream at the speed of the current, with the bait just off the bottom.",water:"Rivers with steady, walking-pace flow",season:"April to November",diff:"Start here",targets:["smb","rock","sucker","carp","wall","perch"],baits:["worm","crawler","corn","bread"],rigs:["float","splitshot"],knots:["uni","clinch"],gear:"A long rod helps more than an expensive one - it lets you keep line off the water. 6 lb line, a 4 g float, size 10 hook.",how:["Find the depth first. Set the float over-deep, trot it through, and shorten until it stops dragging under.","Cast slightly upstream and let the float settle before it reaches you.","Let it travel at the speed of the surface, no faster. If the float is outrunning the foam and leaves, your line is pulling it.","Hold a little line back every few seconds so the bait swings up and then falls again. Most takes happen on that fall.","Strike downstream, not up - you are pulling the hook into the corner of the mouth rather than out of it."],tell:"The float does not just vanish. It lifts, holds under, or slides sideways against the current. Any of those is a fish.",fail:"Fishing too shallow. The bait should be ticking bottom occasionally; if you never touch, you are fishing above them."},{id:"laying-on",name:"Laying on in still water",style:"float",gist:"Float set deeper than the water, so the bait rests on the bottom and the float sits at an angle.",water:"Ponds, canals, slow backwaters",season:"Year round, best May to September",diff:"Start here",targets:["bluegill","pump","crappie","perch","carp","sucker"],baits:["worm","corn","bread","waxworm"],rigs:["float","splitshot"],knots:["clinch","uni"],gear:"Light float, two or three small shot, size 12 to 16 hook. This is the cheapest way to catch fish there is.",how:["Plumb the depth with a heavy shot on the hook until the float sits flat, then shorten by an inch or two so only the tip shows.","Feed a small pinch of bait in the same spot every few minutes. Little and often beats one big helping.","Cast to the same place each time. You are building a pile of interest, not searching.","Sit on your hands. The bites will come to you."],tell:"The float lifts flat and lies down - that is a fish taking the bait and lifting the shot. Strike on the lift, not after it goes under.",fail:"Moving every ten minutes. This tactic works by drawing fish to you, and it needs twenty minutes before it starts."},{id:"slip-float",name:"Slip float for deep water",style:"float",gist:"A float that slides on the line, so you can fish twelve feet deep with a rod you can still cast.",water:"Deep holes, harbour walls, drop-offs, off piers",season:"Year round",diff:"Worth learning",targets:["wall","crappie","perch","wbass","pike"],baits:["minnow","shiner","microjig","jigminnow"],rigs:["slipfloat","swivel"],knots:["uni","palomar"],gear:"A slip float, a bobber stop, a bead, and a swivel. The stop knot sets the depth and reels through the guides.",how:["Thread the stop knot, then the bead, then the float, then tie on a swivel. The bead is what stops the float passing the knot.","Set the stop so the bait sits a foot above whatever the fish are holding on - a weed bed, a ledge, the bottom.","Cast and wait for the float to stand up. It lies flat until the weight has pulled the line through, then cocks.","In current, let it drift the length of the structure, then reel in and repeat rather than dragging it back through."],tell:"A walleye takes a minnow and moves off slowly. Give it three or four seconds before you tighten - striking instantly pulls it away.",fail:"No bead. Without it the stop knot jams into the float and you cannot reel in."},{id:"running-ledger",name:"Ledgering with a running rig",style:"ledger",gist:"Weight sliding freely on the line, so a fish taking the bait feels the hook before it feels the lead.",water:"Rivers and lakes, any depth",season:"May to October",diff:"Start here",targets:["carp","cat","drum","sucker","smb"],baits:["corn","bread","worm","crawler","liver"],rigs:["running","swivel"],knots:["palomar","hair"],gear:"A running lead or feeder above a swivel, a 12 inch hooklength below it. Rod pointed at the bait, line just tight.",how:["Cast, let everything settle, then tighten until the line is straight but not pulling the lead.","Put the rod on a rest with the tip low. You are watching the line or the tip, not holding it.","Recast every twenty minutes even if nothing happens - it refreshes the bait and drops more scent in the same spot.","When it goes, it goes properly. Carp and catfish do not nibble a bottom bait."],tell:"The tip pulls round and stays round, or slack line suddenly appears because the fish swam towards you. Both are takes.",fail:"A hooklength longer than about 18 inches on a running rig tangles on the cast. Keep it short."},{id:"night-cats",name:"Still bait for catfish after dark",style:"ledger",gist:"Smelly bait on the bottom, in the dark, in the deepest slow water you can reach.",water:"River holes below bridges and weirs",season:"June to September, after sunset",diff:"Start here",targets:["cat","drum"],baits:["liver","cutbait","crawler"],rigs:["running","leader"],knots:["palomar","uni"],gear:"Heavier than you think - 15 to 20 lb line, a 2/0 to 4/0 hook, and enough lead to hold in the current.",how:["Get there in daylight and find the deep slow water. Set up before you need a torch.","Fish two rods if the rules allow it, at different distances, until one of them tells you where the fish are.","Keep the bait fresh. Liver washes out in fifteen minutes and after that you are fishing an empty hook.","Bank the rods properly. A channel cat can take an unsecured rod into the river, and this happens to somebody every summer."],tell:"A slow heavy pull that keeps going. Let it develop for a second, then lean into it - do not snatch.",fail:"White light everywhere. Use a red head torch and point it at your hands, not the water."},{id:"drift-bottom",name:"Drifting bait along the bottom",style:"ledger",gist:"Just enough weight to trundle downstream, so the bait moves the way real food moves.",water:"Rivers with clean gravel or sand bottom",season:"May to October",diff:"Worth learning",targets:["smb","wall","rock","sucker","drum"],baits:["crawler","crayfish","minnow","worm"],rigs:["splitshot","swivel"],knots:["clinch","uni"],gear:"Two or three split shot 18 inches above the hook. Adjust the shot, not the retrieve.",how:["Cast up and across, and follow the line with the rod tip as it comes down.","You want it touching bottom every couple of seconds. Constant contact means too much weight; never touching means too little.","Take one step downstream after every two or three drifts, and work the whole run.","When it stops, it is either a rock or a fish. Lift gently - a rock stays put and a fish moves."],tell:"A tap-tap that is sharper than the rhythm of the bottom. Smallmouth hit a drifted crayfish hard.",fail:"Too much lead. The single most common mistake in river fishing, and it kills the presentation stone dead."},{id:"search-cranking",name:"Covering water to find them",style:"lure",gist:"Fan-cast a fast lure across a lot of water until something answers, then slow down and work that spot.",water:"Anywhere new to you",season:"May to October",diff:"Start here",targets:["smb","lmb","pike","wall","wbass"],baits:["crank","spinnerbait","chatterbait","spinner","shadrap"],rigs:["swivel"],knots:["loop","palomar"],gear:"One rod, one fast-moving lure, and a willingness to keep walking.",how:["Cast in a fan from one bank position - left, centre, right - then move twenty paces and repeat.","Retrieve steadily. You are asking a question, not making a presentation.","The moment you get a follow, a knock or a fish, stop searching and work that spot properly with something slower.","Mark it. That is what the pin drop is for, and it is worth more than the fish you just caught."],tell:"Follows count as information. A fish that tracks the lure and turns away is telling you it is there and that you are going too fast.",fail:"Falling in love with one spot. Searching only works if you actually keep moving."},{id:"jig-hopping",name:"Hopping a jig on the bottom",style:"lure",gist:"Lift, let it fall on a semi-slack line, and watch the line rather than the rod.",water:"Rocky rivers, drop-offs, bridge pilings",season:"April to November",diff:"Start here",targets:["smb","wall","rock","crappie","drum","perch"],baits:["tube","grub","jigminnow","microjig"],rigs:["splitshot"],knots:["palomar","clinch"],gear:"The lightest head that still reaches bottom. In the Thames that is usually 1/8 oz, heavier below a weir.",how:["Cast up at forty-five degrees and let it sink on a controlled line - not slack, not tight.","Lift the rod tip a foot, then lower it and let the jig fall back with the current.","Watch where the line enters the water. Almost every take happens on the fall and you will see it before you feel it.","If you are never ticking bottom, go heavier. If you are constantly snagged, go lighter."],tell:"The line twitches, jumps, or simply stops falling. Reel down until you feel weight and then set the hook.",fail:"Waiting to feel the bite. On a falling jig there is nothing to feel - by the time there is, it has gone."},{id:"topwater-window",name:"Topwater in the first and last hour",style:"lure",gist:"A lure on the surface, in low light, over shallow cover. The most exciting bite in fishing.",water:"Weedy shallows, pads, calm bays",season:"June to September",diff:"Worth learning",targets:["lmb","smb","pike"],baits:["popper","frog"],rigs:["weightless"],knots:["loop","palomar"],gear:"A loop knot. It matters more here than anywhere - a tight knot kills the side-to-side action.",how:["Be on the water before first light or stay past sunset. The window is about an hour and it is not negotiable.","Cast past the cover and bring the lure to it, not into it.","Work it in bursts with real pauses. The pause is the part that gets bitten.","Wait until you feel the weight of the fish before you strike. Striking at the splash pulls it away."],tell:"You will hear it before you understand it. Count to one, then lean into it.",fail:"Setting the hook on sight. Everyone does it once, and it costs the best fish of the morning."},{id:"finesse-slow",name:"Finesse when they have shut down",style:"lure",gist:"Small, light and slow, for bright flat days and pressured water when nothing normal works.",water:"Clear ponds and rivers, high sun, no wind",season:"Any time it is tough",diff:"Worth learning",targets:["smb","lmb","crappie","perch","rock"],baits:["senko","texas","microjig","grub"],rigs:["weightless","splitshot"],knots:["palomar","uni"],gear:"Lighter line than you are comfortable with. 6 lb fluorocarbon changes the number of bites on a hard day.",how:["Halve the size of whatever you were using and remove as much weight as you can still cast.","Cast to a specific thing - a shadow, a rock, a dock post - not to open water.","Let it sink all the way on a slack line, then do almost nothing. Shake it in place rather than moving it along.","Give each cast twice as long as feels sensible."],tell:"The line moves sideways. That is the whole bite.",fail:"Impatience. This tactic is slow by design, and rushing it turns it back into the tactic that was not working."},{id:"pike-casting",name:"Casting big lures for pike",style:"lure",gist:"Large, flashy, and always on a trace. Pike will bite through anything else.",water:"Weed edges, bays, slow deep water",season:"Best October to December, and again in spring",diff:"Worth learning",targets:["pike"],baits:["spoon","spinnerbait","jerkbait","crank"],rigs:["leader","swivel"],knots:["palomar","uni"],gear:"A wire or heavy fluorocarbon trace, long forceps, and a knotless landing net. Bring all three or do not fish for pike.",how:["Work the edges of weed rather than the middle of open water.","Vary the retrieve until something answers - pike often want a pause or a change of direction rather than a change of speed.","Do a figure of eight with the rod tip at the end of every retrieve. A following pike frequently takes right at your feet.","Unhook in the water where you can. Support the fish horizontally and never hold one vertically by the jaw."],tell:"Often no take at all, just sudden heavy weight. Sometimes you see the fish before you feel it.",fail:"No trace. You will lose the fish and leave a lure in its mouth, which is the one outcome actually worth avoiding."},{id:"fly-swing",name:"Swinging a wet fly or streamer",style:"fly",gist:"Cast across the current and let the line swing the fly around below you. The current does the work.",water:"Rivers with steady flow",season:"April to October",diff:"Worth learning",targets:["trout","smb","rock"],baits:[],rigs:["leader"],knots:["surgeon","loop"],gear:"A 5 or 6 weight outfit covers almost everything in southern Ontario. Nine foot leader.",how:["Cast across and slightly downstream, then let the line come under tension and swing.","Follow the line around with the rod tip and let it hang directly below you for a few seconds before recasting.","Take two steps downstream after each swing. You are covering the run methodically, not casting at a spot.","Do not strike upwards. Let the fish turn and tighten on its own, then lift."],tell:"A solid pull mid-swing, or a pluck that does not connect - if you get plucked, swing it through again slower.",fail:"Striking like a spin fisherman. On the swing the fish hooks itself, and a hard strike pulls the fly clear."},{id:"fly-dry",name:"Dry fly to a rising fish",style:"fly",gist:"Put a floating fly a little upstream of a fish you have actually seen, and let it drift with no drag.",water:"Clear streams and river tails",season:"May to September, evenings",diff:"Advanced",targets:["trout"],baits:[],rigs:["leader"],knots:["surgeon","clinch"],gear:"Long fine leader - twelve foot down to 5x. The leader matters more than the fly.",how:["Watch first. Find one fish rising in a rhythm before you make a single cast.","Get below it and cast upstream so the fly reaches it before the line does.","Throw a little slack into the cast so the fly drifts at the speed of the water. Any wake at all and the fish is done.","If it refuses twice, change the fly or rest the fish. A third refusal usually ends the opportunity."],tell:"The rise happens where your fly is. Pause, then lift smoothly - a fast strike breaks fine tippet.",fail:"Drag. A fly moving faster or slower than the surface around it is the single reason most dry fly casts fail."},{id:"ice-jigging",name:"Jigging a hole",style:"ice",gist:"A small bait straight down, lifted and dropped, in a hole you drilled over structure.",water:"Hard water on lakes and bays",season:"January to early March",diff:"Worth learning",targets:["perch","crappie","bluegill","wall","pike"],baits:["microjig","waxworm","minnow","jigminnow"],rigs:["splitshot"],knots:["palomar","clinch"],gear:"Short rod, 4 lb line, and a spoon or small jig. A flasher earns its money here more than any other piece of tackle.",how:["Drill several holes over different depths before you fish any of them, so you can move later without making noise.","Drop to the bottom, then lift a foot. Most winter fish sit just off the bottom, not on it.","Lift sharply and let it fall on a slack line, then hold dead still for several seconds. The hold is what gets bitten.","Give a hole ten minutes. If nothing, move - in winter you go to the fish, they do not come to you."],tell:"The line goes slack early on the drop, or the rod tip loads up on the lift.",fail:"Ice thickness taken on somebody else's word. Check it yourself, and never fish new ice alone."},{id:"tip-up",name:"Tip-ups for pike and walleye",style:"ice",gist:"A live bait set at depth on a flagged trap, so you can cover several holes while you jig another.",water:"Weed edges and drop-offs on hard water",season:"January to early March",diff:"Worth learning",targets:["pike","wall"],baits:["shiner","minnow"],rigs:["leader","swivel"],knots:["palomar","uni"],gear:"A wire trace for pike. Check the local limit on how many lines you may set - it varies and it is enforced.",how:["Set the bait a foot or two above the weed or the bottom, not down in it.","Spread the tip-ups across different depths until a flag tells you which depth is right, then move the others to match.","When a flag goes, walk over - do not run, and do not grab the line until the spool has stopped turning.","Pull hand over hand, keeping steady pressure. Slack line is how you lose them."],tell:"The flag is only half of it. Watch whether the spool is still turning - a stopped spool means the fish has dropped it.",fail:"Striking while the spool is running. Let the fish turn the bait first."},{id:"flatline-troll",name:"Flatline trolling",style:"troll",gist:"Lures behind a slow-moving boat, no downrigger, covering water until you find the depth they are at.",water:"Open lake, bays, large rivers",season:"May to October",diff:"Start here",targets:["wall","pike","trout","wbass","smb"],baits:["crank","shadrap","spoon"],rigs:["swivel","leader"],knots:["palomar","loop"],gear:"Line counter reels if you have them. If not, count passes of the handle - you need to be able to repeat what worked.",how:["Start around 2 mph and let out different amounts of line on each rod so they run at different depths.","Note exactly what was out when a fish takes, then put the other rods on the same setting.","Turn regularly. The lures on the outside speed up and the inside ones slow and drop, and takes often come on the turn.","Follow a contour rather than crossing open water at random."],tell:"The rod loads and stays loaded. Most trolled fish hook themselves.",fail:"Every rod set identically. Then you learn nothing when one of them gets a fish."},{id:"bottom-bounce",name:"Bottom bouncing a worm harness",style:"troll",gist:"A weighted arm trundling along the bottom, dragging a spinner and a crawler behind it.",water:"Lake flats and river drifts with clean bottom",season:"June to September",diff:"Worth learning",targets:["wall","drum","sucker"],baits:["crawler","worm"],rigs:["swivel","leader"],knots:["uni","palomar"],gear:"A bottom bouncer heavy enough to hold roughly a forty-five degree line angle at your trolling speed.",how:["Let out line until you feel the bouncer tick bottom, then hold it just there.","Aim for a line angle of about forty-five degrees. Straight down means too slow; way out behind means too little weight.","Go slowly - around 1 mph. The spinner blade needs to turn, not fly.","Drop the rod tip when you feel a take, count to two, then lift into it."],tell:"A distinctly different weight from the rhythm of the bouncer ticking. It feels like the bottom got soft.",fail:"Too fast. The harness rides up off the bottom and you troll over the fish all afternoon."}];var qi=(e,t)=>`${e}:${t}`;function ln(e,t,n){return(e||[]).includes(qi(t,n))}function yy(e,t,n){let o=qi(t,n),i=Array.isArray(e)?e:[];return i.includes(o)?i.filter(s=>s!==o):[o,...i]}function vy(e,t,n=1/0){let o=[];for(let i of e||[]){let s=i.indexOf(":");if(s<1)continue;let a=i.slice(0,s),l=i.slice(s+1),d=t(a,l);if(d&&o.push({kind:a,id:l,rec:d}),o.length>=n)break}return o}function ky(e,t,n,o=Date.now()){let i=qi(t,n),s=(e||{})[i]||{n:0,last:0};return{...e||{},[i]:{n:s.n+1,last:o}}}var Za=(e,t,n)=>((e||{})[qi(t,n)]||{}).n||0,Ja=(e,t,n)=>((e||{})[qi(t,n)]||{}).last||0,wy=[{id:"default",label:"Default"},{id:"most",label:"Most used"},{id:"last",label:"Last used"},{id:"az",label:"A\u2013Z"}],Qa=(e,t)=>String(e.name||"").localeCompare(String(t.name||""));function by(e,{      had six colours, but deep2 and brass2 are tints of deep and brass, so
     using them here would have given two pairs of styles that read as the
     same colour at the size these bars actually appear. */
  --plum:#5A4A6B;
  --sky:#3E7189;
  --shadow:0 1px 0 var(--line2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.lfc{
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--base); color:var(--ink);
  min-height:100vh; max-width:760px; margin:0 auto;
  padding-bottom:92px; position:relative;
  font-size:15px; line-height:1.45;
}
.lfc .serif{font-family:'Newsreader',Georgia,'Iowan Old Style',serif}
.lfc h1,.lfc h2,.lfc h3,.lfc h4{font-family:'Newsreader',Georgia,serif;font-weight:600;margin:0;line-height:1.15;letter-spacing:-0.01em}
.lfc h1{font-size:29px}
.lfc h2{font-size:22px}
.lfc h3{font-size:18px}
.lfc p{margin:0 0 10px}
.lfc button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
.lfc input,.lfc select,.lfc textarea{font-family:inherit;font-size:16px;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:3px;
  padding:11px 12px;color:var(--ink)}
.lfc textarea{min-height:78px;resize:vertical;line-height:1.4}
.lfc input:focus,.lfc select:focus,.lfc textarea:focus,.lfc button:focus-visible{
  outline:2px solid var(--deep);outline-offset:1px}

.pad{padding:0 16px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.muted{color:var(--ink2)}
.tiny{font-size:12.5px;line-height:1.35}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* header */
.hdr{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.hdr .kick{font-size:12.5px;color:var(--ink2);letter-spacing:.02em}

/* season strip \u2014 the hero */
.seasonwrap{background:var(--deep);color:#EAF0F1;padding:16px}
.seasonwrap h2{color:#fff;font-size:20px}
.seasonwrap .date{font-size:12.5px;color:#A9C2C9;margin-top:2px}
.seasongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;margin-top:13px}
.sbadge{background:rgba(255,255,255,.07);border-left:3px solid var(--moss);
  padding:7px 9px;border-radius:2px}
.sbadge.shut{border-left-color:var(--rust);opacity:.62}
.sbadge .nm{font-size:13px;font-weight:500;color:#fff}
.sbadge .st{font-size:11.5px;color:#A9C2C9;margin-top:1px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px}
.card.flat{background:var(--card2);border-color:var(--line2)}
.listbtn{display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:13px 14px}
.listbtn:active{background:var(--card2)}

/* chips */
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:2px;
  background:var(--card2);border:1px solid var(--line2);color:var(--ink2);white-space:nowrap}
.chip.solid{background:var(--deep);border-color:var(--deep);color:#fff}
.chip.brass{background:#F2E6CF;border-color:#DEC79A;color:#6B4A15}
.chip.open{background:#DDEBD9;border-color:#B6D0B1;color:#2C5228}
.chip.shut{background:#F0DDDD;border-color:#D9B6B6;color:#722525}

/* access gauge */
.gauge{display:flex;gap:2px;align-items:flex-end;height:16px}
.gauge i{width:5px;background:var(--line);border-radius:1px;display:block}
.gauge i.on{background:var(--deep)}

/* tabs */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;
  background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:40;
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{padding:10px 1px 12px;font-size:10.5px;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--deep)}
.tabbar button.on svg{stroke:var(--deep)}
.tabbar svg{width:21px;height:21px;stroke:var(--ink3);fill:none;stroke-width:1.6}

.segbar{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--card)}
.segbar button{flex:1;padding:9px 6px;font-size:13.5px;color:var(--ink2);border-right:1px solid var(--line2)}
.segbar button:last-child{border-right:none}
.segbar button.on{background:var(--deep);color:#fff}

/* buttons */
.btn{background:var(--deep);color:#fff;padding:13px 16px;border-radius:4px;
  font-size:15px;font-weight:500;width:100%;text-align:center;display:block}
.btn:active{background:#253D46}
.btn.ghost{background:transparent;color:var(--deep);border:1px solid var(--line)}
.btn.brass{background:var(--brass)}
.btn.danger{background:transparent;color:var(--rust);border:1px solid #D9B6B6}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto;display:inline-block}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,28,20,.5);z-index:50}
.sheet{position:fixed;inset:0;z-index:51;background:var(--base);
  overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheethdr{position:sticky;top:0;background:var(--base);z-index:2;
  border-bottom:1px solid var(--line);padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
.x{font-size:15px;color:var(--deep);padding:6px 2px;white-space:nowrap}
.linkrow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);padding:8px 9px}
.linkrow a{display:flex;align-items:center;gap:7px;flex:1;min-width:0;color:var(--ink)}
.linkrow-label{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkrow-host{font-size:11px;color:var(--ink3);margin-left:auto;white-space:nowrap;flex:0 0 auto}
.linkx{color:var(--ink3);padding:4px;flex:0 0 auto;display:grid;place-items:center}
.starbtn{color:var(--ink3);padding:5px 3px;display:inline-flex;align-items:center}
.starbtn.on{color:var(--brass)}
.backlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--deep);
  text-transform:uppercase;letter-spacing:.07em;padding:2px 0 5px}

/* A RECORD opens as a peek: the page it came from stays visible above it, so
   arriving at a tactic from a fish record reads as going deeper rather than
   going somewhere else. You reach one record from four or five places, and a
   full screen made every one of those feel like leaving.

   FORMS do not do this. "Log a catch" is a task, not a reference - it wants
   the whole screen and there is nothing behind it worth keeping in view. So
   peek is opt-in per sheet rather than the default.

   Animating "top" rather than "transform" matters: bottom stays pinned at 0,
   so the sheet's own height changes with it and the last line of content is
   always reachable. A translated sheet pushes its own footer off-screen. */
.sheet.peek{top:13%;border-radius:14px 14px 0 0;box-shadow:0 -8px 28px -12px rgba(0,0,0,.4)}
.sheet.peek.full{top:0;border-radius:0}
.grab{display:flex;justify-content:center;padding:7px 0 1px;cursor:pointer}
.grab i{display:block;width:34px;height:4px;border-radius:3px;background:var(--line);
  transition:background .15s}
.grab:hover i,.grab:focus-visible i{background:var(--ink3)}
.expand{font-size:13px;color:var(--deep);padding:6px 4px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px}
@media (prefers-reduced-motion:no-preference){
  .sheet.peek{transition:top .2s ease,border-radius .2s ease}
}

/* encyclopedia home */
/* map, full bleed */
.mapfull{position:absolute;inset:0;overflow:hidden;display:flex;flex-direction:column}
/* The viewport takes whatever the drawer leaves. min-height:0 is what lets a
   flex child actually shrink rather than insisting on its content size. */
.mapviewport{flex:1;position:relative;min-height:0}
.mapcanvas{position:absolute;inset:0}
.mapcanvas canvas{display:block;touch-action:none;cursor:grab}

/* The control column starts BELOW the top bar and the drawer is anchored to
   the bottom, so in the resting state nothing can overlap anything. When the
   drawer is pulled up it would eventually reach the column, so the column
   fades out instead - the drawer is what you are looking at by then. */
.maptop{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:7px;
  align-items:center;z-index:3}
.mappill{display:inline-flex;align-items:center;gap:6px;background:rgba(252,253,250,.94);
  border:1px solid rgba(0,0,0,.10);border-radius:999px;padding:7px 12px;font-size:12.5px;
  font-weight:600;color:var(--ink);box-shadow:0 3px 10px -4px rgba(0,0,0,.35);
  white-space:nowrap;min-width:0;max-width:100%}
.mappill .sub{font-weight:400;color:var(--ink3);font-size:11px;overflow:hidden;
  text-overflow:ellipsis}

/* Hangs under the top bar, so it never reaches the control column or the
   drawer. Scrolls if the list ever outgrows the space. */
.regionpick{position:absolute;left:10px;top:56px;width:min(260px,calc(100% - 76px));z-index:4;
  background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  box-shadow:0 10px 28px -10px rgba(0,0,0,.45);max-height:60%;overflow-y:auto}
.regionrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%;
  text-align:left;padding:10px 12px;font-size:13.5px}
.regionrow+.regionrow{border-top:1px solid var(--line2)}
.regionrow.on{background:var(--card2)}
.regionrow.on .regionnm{font-weight:700;color:var(--deep)}
.regionnm{min-width:0;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.regionflag{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brass)}
.regionmt{font-size:11px;color:var(--ink3);flex:0 0 auto}

.mapfab{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:8px;
  z-index:3}
.mfab{width:40px;height:40px;border-radius:13px;background:rgba(252,253,250,.94);
  border:1px solid rgba(0,0,0,.10);display:grid;place-items:center;color:var(--deep);
  box-shadow:0 3px 10px -3px rgba(0,0,0,.32)}
.mfab.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.mfab:disabled{opacity:.5}
.mfab .lbl{font-size:8px;letter-spacing:.04em;text-transform:uppercase;margin-top:1px}

.mapdrawer{flex:0 0 auto;background:var(--base);border-top:1px solid var(--line2);
  box-shadow:0 -8px 26px -12px rgba(0,0,0,.3);display:flex;flex-direction:column;
  /* Not a percentage. The floor is set by what has to FIT above it - the
     control column is 232px and the top bar ends at 58 - so a percentage
     would collide on a short screen and leave a gap on a tall one. */
  max-height:calc(100% - 300px)}
.mapgrab{display:flex;justify-content:center;padding:8px 0 6px;flex:0 0 auto}
.mapgrab i{width:34px;height:4px;border-radius:3px;background:var(--line);display:block}
.mapdrawerhd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:0 15px 8px;flex:0 0 auto}
.mapdrawerhd .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.mapdrawerhd .mt{font-size:10.5px;color:var(--ink3);flex:0 0 auto}
.mapdrawerbody{overflow-y:auto;padding:0 15px 14px}
.mapdrawerbody::-webkit-scrollbar{width:0}
/* Attribution lives in the drawer, which is always on screen, so it can never
   be covered by the drawer or the controls. */
.mapattrib{font-size:9.5px;color:var(--ink3);padding:0 15px 10px;flex:0 0 auto}

/* dashboard */
.placeline{display:flex;align-items:center;gap:7px;min-width:0}
.placebtn{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);color:var(--deep);flex:0 0 22px}
.placebtn:disabled{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .spin{animation:sp 1.1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
}

/* The white surround is not decoration - a QR code with no quiet zone
   around it will not scan. The svg viewBox carries two modules of margin
   and this keeps that margin white whatever the card behind it is doing. */
.qrwrap{margin-top:11px;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:12px;display:grid;place-items:center}
.qrwrap svg{width:100%;max-width:236px;height:auto;display:block}
.wxtile{display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:12px;background:var(--card);box-shadow:var(--shadow);
  padding:11px 13px 10px;margin-top:12px;border-left:4px solid var(--sky)}
.wxtile:disabled{opacity:.7}
.wxhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wxwhere{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wxwhen{display:inline-flex;align-items:center;font-size:11.5px;color:var(--deep);flex:0 0 auto}
.wxrow{display:flex;align-items:center;gap:12px;margin-top:6px}
.wxtemp{font-size:26px;font-weight:700;letter-spacing:-.02em}
.wxbits{display:flex;flex-direction:column;font-size:13px;min-width:0}
.wxnote{font-size:11px;color:var(--ink3);line-height:1.35;margin-top:8px;
  padding-top:7px;border-top:1px solid var(--line2)}
.nearrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid var(--line);border-radius:10px;background:var(--card);padding:10px 11px;
  box-shadow:var(--shadow)}
.nearicon{width:28px;height:28px;flex:0 0 28px;border-radius:8px;display:grid;place-items:center;color:#fff}
.nearicon.spot{background:var(--deep)} .nearicon.pin{background:var(--brass)}
.nearbd{flex:1;min-width:0}
.nearname{display:block;font-size:14px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.nearkind{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.neardist{font-size:12px;color:var(--ink2);flex:0 0 auto;font-variant-numeric:tabular-nums}
.ratecard{border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.ratecard.t-prime{border-left:4px solid var(--moss)}
.ratecard.t-good{border-left:4px solid var(--deep)}
.ratecard.t-fair{border-left:4px solid var(--brass)}
.ratecard.t-slow{border-left:4px solid var(--ink3)}
.ratehead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 13px}
.ratedial{position:relative;width:44px;height:44px;flex:0 0 44px;display:grid;place-items:center}
.t-prime .ratedial{color:var(--moss)} .t-good .ratedial{color:var(--deep)}
.t-fair .ratedial{color:var(--brass)} .t-slow .ratedial{color:var(--ink3)}
.ratedial svg{position:absolute;inset:0}
.ratenum{font-size:14px;font-weight:700;color:var(--ink)}
.ratetxt{flex:1;min-width:0}
.ratelabel{display:block;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.ratesub{display:block;font-size:12.5px;color:var(--ink2);margin-top:1px}
.ratechev{color:var(--ink3);flex:0 0 14px;transition:transform .16s ease}
.ratechev.up{transform:rotate(180deg)}
.ratebody{border-top:1px solid var(--line2);padding:10px 13px 12px}
.raterow{display:flex;align-items:center;gap:9px;padding:5px 0}
.raterow+.raterow{border-top:1px solid var(--line2)}
.ratekind{width:8px;height:8px;border-radius:2px;flex:0 0 8px}
.k-moon{background:var(--plum)} .k-light{background:var(--brass)}
.k-weather{background:var(--sky)} .k-pressure{background:var(--moss)}
.raterow-label{flex:1;min-width:0;font-size:13.5px}
.raterow-delta{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.raterow-delta.up{color:var(--moss)} .raterow-delta.down{color:var(--rust)}

.seasoncard{border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;margin-top:12px}
.seasonhero{display:flex;gap:12px;align-items:center;padding:13px;
  background:linear-gradient(135deg,#2E4A55,#22333B);color:#EAF0EC}
.seasonart{width:96px;height:78px;flex:0 0 96px;border-radius:9px;overflow:hidden;
  background:rgba(255,255,255,.09);display:grid;place-items:center}
.seasonart img{width:100%;height:100%;object-fit:cover;display:block}
.seasonmain{min-width:0;flex:1}
.seasonkick{font-size:11px;text-transform:uppercase;letter-spacing:.11em;opacity:.75}
.seasonmain h2{font-size:20px;margin:2px 0 0;letter-spacing:-.015em;color:#F2F6F2}
.seasonwhy{font-size:12.5px;line-height:1.4;margin:5px 0 0;opacity:.9;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seasonopen{font-size:11.5px;margin-top:6px;opacity:.8}
.seasonmore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;
  padding:10px;font-size:12.5px;font-weight:600;color:var(--deep);
  border-top:1px solid var(--line2)}
.filterbar{display:flex;gap:5px;overflow-x:auto;padding:10px 0 3px;scrollbar-width:none}
.filterbar::-webkit-scrollbar{height:0}
.fchip{flex:0 0 auto;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;
  padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink2);white-space:nowrap}
.fchip.on{background:var(--deep);border-color:var(--deep);color:#F1F4EF}
.fchip.clear{border-style:dashed;color:var(--ink3)}
.fchip:disabled{opacity:.4}
.quickbar{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
.quickbar::-webkit-scrollbar{height:0}
.quickchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;
  color:var(--ink);white-space:nowrap}
.quickchip i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}

/* Four columns, and only the COLUMN span is set per size - height comes
   from aspect-ratio. Spanning rows as well would need a fixed row height,
   which cannot be derived from the column width in CSS, and every attempt
   at it leaves gaps when a small tile sits beside a wide one. This way
   four smalls fill a row on their own and the browser does the packing. */
.encygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;
  grid-auto-flow:row dense}
.encytile{border:1px solid var(--line);border-radius:11px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;min-width:0;display:flex;flex-direction:column}
/* Two columns wide, so it is a squat rectangle rather than a square - room
   for the name on one line, which a quarter-width tile did not have. */
.encytile.s-small{aspect-ratio:2}
.encytile.s-wide{aspect-ratio:2}
.encytile.s-large{aspect-ratio:1}
/* Once a tile is open its content sets the height - an aspect ratio would
   either clip the preview rows or leave a hole under them. */
.encytile.open{aspect-ratio:auto}
.encytile.s-large{aspect-ratio:auto;min-height:210px}
.encytile.dragging{opacity:.55;transform:scale(.97)}
.encytile.arranging{touch-action:none;cursor:grab}
.encytiles{display:flex;flex-direction:column;gap:7px;margin-top:14px}

/* A small tile has a quarter of the width, so it drops the blurb, the count
   and the chevron and stacks what is left. */
.encytile.s-small .encytile-head{gap:9px;padding:11px 12px;height:100%}
.encytile.s-small .encytile-name{font-size:14px;line-height:1.2}
.encytile.s-small.open .encytile-head{flex-direction:row;align-items:center;gap:11px;
  padding:12px 13px;height:auto}
.encytile.s-small.open .encytile-name{font-size:15.5px}

.tilebar{display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--line2);background:var(--card2)}
.tilebtn{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--deep);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--card);
  white-space:nowrap}
.tilebtn.danger{color:var(--rust);border-color:#D8BDBD}
.tilebtn.on{background:var(--deep);border-color:var(--deep);color:#F1F4EF}
.tilegrip{color:var(--ink3);flex:0 0 auto}
.tileicon{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;
  border:1px solid var(--line);background:var(--card);color:var(--deep);flex:0 0 22px}
.tileicon:disabled{opacity:.3}
.tileicon.danger{color:var(--rust);border-color:#D8BDBD;margin-left:auto}
.tilebar .tilebtn{padding:3px 7px;min-width:24px;text-align:center}
.encytile{border:1px solid var(--line);border-radius:11px;background:var(--card);
  box-shadow:var(--shadow);overflow:hidden}
.encytile.open{border-color:var(--line);box-shadow:0 2px 10px -6px rgba(0,0,0,.3)}
.encytile-head{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px}
.encytile-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:#fff;flex:0 0 34px}
.encytile-txt{flex:1;min-width:0}
.encytile-name{display:block;font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.encytile-blurb{display:block;font-size:12.5px;color:var(--ink2);line-height:1.35;margin-top:1px}
.encytile-n{font-size:12.5px;color:var(--ink3);flex:0 0 auto}
.encytile-chev{color:var(--ink3);flex:0 0 14px;transition:transform .16s ease}
.encytile.open .encytile-chev{transform:rotate(180deg)}
.encytile-body{border-top:1px solid var(--line2);padding:5px 13px 11px}
.encyrow{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:8px 0;
  border-bottom:1px solid var(--line2)}
.encyrow:last-of-type{border-bottom:none}
.encyrow-art{width:34px;height:26px;flex:0 0 34px;border-radius:4px;overflow:hidden;
  background:var(--card2);display:grid;place-items:center}
.encyrow-art img{width:100%;height:100%;object-fit:cover;display:block}
.encyrow-dot{width:8px;height:8px;border-radius:2px;flex:0 0 8px;margin-left:13px}
.encyrow-name{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.encyrow-mine{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.encyseeall{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--deep);
  padding:9px 0 2px;font-weight:600}

.encyhit{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left;padding:11px 12px}
.encyhit-bar{width:3px;border-radius:2px;flex:0 0 3px}
.encyhit-bd{flex:1;min-width:0}
.encyhit-name{display:block;font-weight:600;font-size:14.5px}
.encyhit-cat{display:block;font-size:11.5px;color:var(--ink3);text-transform:uppercase;
  letter-spacing:.07em;margin-top:1px}

.favslots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.favslot{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.favslot-art{width:100%;aspect-ratio:1;border:1.5px solid;border-radius:9px;overflow:hidden;
  background:var(--card);display:grid;place-items:center}
.favslot-art img{width:100%;height:100%;object-fit:cover;display:block}
.favslot-art i{width:11px;height:11px;border-radius:3px}
.favslot-name{font-size:10.5px;line-height:1.2;text-align:center;color:var(--ink2);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* tactics */
.tac{display:flex;gap:10px;align-items:stretch;width:100%;text-align:left}
.tac .bar{width:4px;flex:0 0 4px;border-radius:3px}
.tac .bd{min-width:0;flex:1}
.diffchip{font-size:11px;padding:2px 6px;border-radius:4px;white-space:nowrap;flex:0 0 auto}
.diffchip.d1{background:#E1EADF;color:#2F5A2B}
.diffchip.d2{background:#F0E6D3;color:#7A5416}
.diffchip.d3{background:#EFE1E1;color:#7E2A2A}
.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.glance .g{background:var(--card2);border-radius:5px;padding:7px 8px;min-width:0}
.glance .g b{display:block;font-size:11px;color:var(--ink3);font-weight:500;
  text-transform:uppercase;letter-spacing:.06em}
.glance .g span{font-size:12.5px;line-height:1.3;display:block;margin-top:2px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;font-size:14px;line-height:1.5;
  color:var(--ink2);margin-bottom:9px}
.steps li:before{content:counter(s);flex:0 0 19px;height:19px;border-radius:5px;
  background:var(--card2);color:var(--ink3);font-size:11.5px;display:grid;
  place-items:center;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  background:var(--card2);border-radius:999px;padding:4px 10px;font-size:13px;
  color:var(--ink);margin:0 5px 5px 0}
.pill i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.callout{border-radius:6px;padding:9px 11px;font-size:13.5px;line-height:1.45}
.callout b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:3px;font-weight:600}
.callout.good{background:#E5EDE3;color:#22371F} .callout.good b{color:var(--moss)}
.callout.bad{background:#F1E3E2;color:#3D1C1C}  .callout.bad b{color:var(--rust)}

/* field */
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.optgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:3px;
  padding:11px 8px;font-size:13.5px;text-align:center;color:var(--ink)}
.opt.on{background:var(--deep);border-color:var(--deep);color:#fff}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);font-size:12.5px;
  padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}

/* prose */
.prose{font-family:'Newsreader',Georgia,serif;font-size:16.5px;line-height:1.58;color:#2A3327}
.prose p{margin:0 0 11px;max-width:66ch}

hr.rule{border:none;border-top:1px solid var(--line);margin:18px 0}
.divlabel{display:flex;align-items:center;gap:9px;color:var(--ink2);font-size:12.5px;margin:20px 0 9px}
.divlabel:after{content:"";flex:1;height:1px;background:var(--line)}

@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .17s ease-out}
  @keyframes rise{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
}
