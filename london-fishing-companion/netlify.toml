# Netlify configuration for London Fishing Companion.
# The only thing that genuinely matters here is the sw.js header: if the
# service worker itself gets cached, phones keep serving an old build
# forever and your updates never land.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# The bundle is content-addressed by the service worker cache version,
# so it is safe to let the browser hold on to it.
[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# Single page app: anything that isn't a real file falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
